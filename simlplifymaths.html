<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tiger Warriors - சுருக்குதல் (Simplification) 25 வினாக்கள்</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; font-weight: bold; }
    body { background: #080604; color: #f8fafc; padding: 12px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { width: 100%; max-width: 950px; background: #0f172a; border-radius: 14px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); border: 1px solid #334155; }
    
    .test-header { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; border: 1px solid #334155; }
    .timer { font-size: 15px; font-weight: bold; color: #fbbf24; background: #091326; padding: 6px 12px; border-radius: 6px; border: 1px solid #fbbf24; box-shadow: inset 0 0 5px rgba(251, 191, 36, 0.2); }
    .lang-btn { background: #0284c7; color: #fff; border: 1px solid #38bdf8; padding: 6px 14px; border-radius: 6px; font-size: 13px; cursor: pointer; transition: 0.2s; }
    .lang-btn:hover { background: #0369a1; }

    .q-grid { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 16px; max-height: 140px; overflow-y: auto; padding: 8px; background: #1e293b; border-radius: 8px; justify-content: center; }
    .q-num-btn { width: 30px; height: 30px; border-radius: 5px; border: none; background: #334155; color: #fff; font-size: 10px; cursor: pointer; font-weight: bold; }
    .q-num-btn.active { border: 2px solid #38bdf8; background: #0284c7; }
    .q-num-btn.answered { background: #10b981; }

    .q-box { background: #1e293b; padding: 18px; border-radius: 10px; margin-bottom: 16px; border: 1px solid #334155; }
    .q-text { white-space: pre-line; line-height: 1.6; font-size: 15px; color: #f8fafc; }
    
    .option-card { background: #0f172a; border: 1px solid #334155; padding: 12px 16px; border-radius: 8px; margin-top: 10px; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: 0.2s; white-space: pre-line; line-height: 1.4; }
    .option-card:hover { border-color: #38bdf8; background: #1e293b; }
    .option-card.selected { border-color: #10b981; background: #064e3b; }
    .option-card.correct-ans { border-color: #10b981; background: #065f46; font-weight: bold; }
    .option-card.wrong-ans { border-color: #ef4444; background: #7f1d1d; }

    .explanation-box { background: #091326; border: 1px solid #38bdf8; border-radius: 8px; padding: 12px; margin-top: 14px; font-size: 13px; color: #7dd3fc; line-height: 1.5; }
    
    .nav-btns { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    .btn-action { background: #334155; color: #fff; border: none; padding: 10px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 13px; text-align: center; }
    .btn-action:hover { opacity: 0.9; }
    .btn-blue { background: #2563eb; }
    .btn-purple { background: #7c3aed; }
    .btn-danger { background: #ef4444; }
    .btn-green { background: #22c55e; }

    .result-box { text-align: center; padding: 25px; background: #1e293b; border-radius: 16px; margin-top: 10px; border: 1px solid rgba(0, 242, 254, 0.3); display: flex; flex-direction: column; align-items: center; }
    .score-circle { width: 130px; height: 130px; border-radius: 50%; background: conic-gradient(#10b981 0deg, #0f172a 0deg); display: flex; flex-direction: column; justify-content: center; align-items: center; margin: 0 auto 15px auto; border: 4px solid #38bdf8; box-shadow: 0 0 20px rgba(56, 189, 248, 0.4); }
    .score-num { font-size: 30px; color: #f8fafc; font-weight: bold; }
    
    .result-stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; width: 100%; max-width: 400px; }
    .stat-pill { background: #0f172a; border-radius: 12px; padding: 10px; border: 1px solid #334155; text-align: center; }
    .stat-pill.gold { border-color: #fbbf24; }
    .stat-pill.blue { border-color: #38bdf8; }
    .stat-pill.red { border-color: #ef4444; }

    .footer-badge { text-align: center; font-size: 11px; color: #38bdf8; margin-top: 15px; font-weight: bold; letter-spacing: 0.5px; }
  </style>
</head>
<body>

<div class="card">
  <script>
      if (localStorage.getItem('tiger_auth_passed') !== 'true') {
          alert("⚠ பாதுகாப்பு எச்சரிக்கை: நீங்கள் Tiger Warriors போர்ட்டலில் லாகின் செய்யவில்லை! முதலில் மெயின் போர்ட்டலில் லாகின் செய்யவும்.");

  </script>

  <div id="testView">
    <div class="test-header">
      <div>
        <h3 style="color: #38bdf8; font-size: 15px;" id="headerTitle">🐅 TIGER WARRIORS - சுருக்குதல் (25 வினாக்கள்)</h3>
        <span style="font-size: 11px; color: #94a3b8;">TNPSC / 2 / 2A / 4 • MATHS UNIT 1</span>
      </div>
      <div style="display: flex; gap: 8px; align-items: center;">
        <button class="lang-btn" onclick="toggleLanguage()" id="langBtn">🌐 English</button>
        <div class="timer" id="timerBox">⏱️ 30:00</div>
        <button class="btn-action btn-purple" id="backToResultBtn" onclick="returnToResult()" style="display: none; padding: 6px 12px; font-size: 12px;">📊 ரிசல்ட் செல்</button>
        <button class="btn-action btn-danger" id="dashFromKeyBtn" onclick="returnToDashboard()" style="display: none; padding: 6px 12px; font-size: 12px;">🏠 முகப்பு</button>
      </div>
    </div>

    <div class="q-grid" id="questionGrid"></div>

    <div class="q-box">
      <div id="qTitle" class="q-text"></div>
      <div id="optionsBox"></div>
      <div id="expBox" class="explanation-box" style="display: none;"></div>
    </div>

    <div class="nav-btns">
      <button class="btn-action" id="prevBtn" onclick="navigateNumberQuery(-1)">⬅️ முந்தையது</button>
      <button class="btn-action" id="clearBtn" onclick="clearChoice()">🧹 விடையை நீக்கு</button>
      <button class="btn-action btn-blue" id="nextBtn" onclick="navigateNumberQuery(1)">அடுத்து ➡️</button>
      <button class="btn-action btn-danger" id="finalSubmitBtn" onclick="submitTest()">✅ தேர்வைச் சமர்ப்பிக்க (Submit)</button>
    </div>
  </div>

  <div id="resultView" style="display: none;">
    <h2 style="color: #38bdf8; text-align: center; margin-bottom: 10px;" id="resHeader">🏆 தேர்வு முடிவுகள் (Test Results) 🎯</h2>
    <div class="result-box">
      <div class="score-circle" id="scoreCircle">
        <div class="score-num" id="scoreDisplay">0/25</div>
        <span id="percentageDisplay" style="font-size: 11px; color: #fbbf24;">0%</span>
      </div>

      <div class="result-stats-grid">
        <div class="stat-pill gold">
          <h3 id="correctCnt" style="color: #10b981; font-size: 18px;">0</h3>
          <span style="font-size: 11px; color: #cbd5e1;" id="lblCorrect">சரியானது ✅</span>
        </div>
        <div class="stat-pill red">
          <h3 id="wrongCnt" style="color: #ef4444; font-size: 18px;">0</h3>
          <span style="font-size: 11px; color: #cbd5e1;" id="lblWrong">தவறானது ❌</span>
        </div>
        <div class="stat-pill blue">
          <h3 id="unansCnt" style="color: #f59e0b; font-size: 18px;">0</h3>
          <span style="font-size: 11px; color: #cbd5e1;" id="lblUnans">விடையில்லை ⚠️</span>
        </div>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px;">
      <button class="btn-action btn-blue" onclick="reviewAnswerKey()" id="btnKey">🔍 விடை குறிப்பு (Answer Key)</button>
      <button class="btn-action btn-purple" onclick="returnToDashboard()" id="btnDash">🏠 முகப்புப் பக்கம்</button>
      <button class="btn-action btn-green" onclick="retakeTest()" id="btnRetake">🔄 மீண்டும் தேர்வு</button>
      <button class="btn-action btn-danger" onclick="exitPortal()" id="btnExit">🚪 வெளியேறு</button>
    </div>
    <div class="footer-badge" style="margin-top: 20px;">🐅 டைகர் வாரியர் போர்டல் - இயக்குநர்: Dr. K. மணிகாசி 🐅</div>
  </div>
</div>

<script>
  let currentLang = 'ta'; // 'ta' or 'en'

  const questionsData = [
    {
      q_ta: "1. சுருக்குக: 100 + 8 × 2 - 6 ÷ 2",
      q_en: "1. Simplify: 100 + 8 × 2 - 6 ÷ 2",
      o: ["a) 113", "b) 105", "c) 112", "d) 118"],
      a: 0,
      exp_ta: "விளக்கம் (BODMAS Rule):\nவகுத்தல்: 6 ÷ 2 = 3\nபெருக்கல்: 8 × 2 = 16\nகூட்டல் & கழித்தல்: 100 + 16 - 3 = 113.",
      exp_en: "Explanation (BODMAS Rule):\nDivision: 6 ÷ 2 = 3\nMultiplication: 8 × 2 = 16\nAddition & Subtraction: 100 + 16 - 3 = 113."
    },
    {
      q_ta: "2. சுருக்குக: (1/2 + 1/4) ÷ (1/2 - 1/4)",
      q_en: "2. Simplify: (1/2 + 1/4) ÷ (1/2 - 1/4)",
      o: ["a) 1", "b) 2", "c) 3", "d) 4"],
      a: 2,
      exp_ta: "விளக்கம்:\n1/2 + 1/4 = 3/4\n1/2 - 1/4 = 1/4\n(3/4) ÷ (1/4) = (3/4) × (4/1) = 3.",
      exp_en: "Explanation:\n1/2 + 1/4 = 3/4\n1/2 - 1/4 = 1/4\n(3/4) ÷ (1/4) = (3/4) × (4/1) = 3."
    },
    {
      q_ta: "3. 256 இன் வர்க்கமூலம் (Square Root) காண்க: √256 + √81",
      q_en: "3. Find the value of: √256 + √81",
      o: ["a) 25", "b) 23", "c) 21", "d) 19"],
      a: 0,
      exp_ta: "விளக்கம்:\n√256 = 16\n√81 = 9\n16 + 9 = 25.",
      exp_en: "Explanation:\n√256 = 16\n√81 = 9\n16 + 9 = 25."
    },
    {
      q_ta: "4. சுருக்குக: (a + b)² - (a - b)²",
      q_en: "4. Simplify: (a + b)² - (a - b)²",
      o: ["a) 2(a² + b²)", "b) 4ab", "c) 2ab", "d) a² - b²"],
      a: 1,
      exp_ta: "விளக்கம்:\n(a² + 2ab + b²) - (a² - 2ab + b²) = 4ab.",
      exp_en: "Explanation:\n(a² + 2ab + b²) - (a² - 2ab + b²) = 4ab."
    },
    {
      q_ta: "5. மதிப்பு காண்க: 0.2 × 0.2 + 0.2 × 0.02",
      q_en: "5. Find the value of: 0.2 × 0.2 + 0.2 × 0.02",
      o: ["a) 0.044", "b) 0.44", "c) 0.0044", "d) 0.404"],
      a: 0,
      exp_ta: "விளக்கம்:\n0.2 × 0.2 = 0.04\n0.2 × 0.02 = 0.004\n0.04 + 0.004 = 0.044.",
      exp_en: "Explanation:\n0.2 × 0.2 = 0.04\n0.2 × 0.02 = 0.004\n0.04 + 0.004 = 0.044."
    },
    {
      q_ta: "6. சுருக்குக: √(16 + √(9 + √49))",
      q_en: "6. Simplify: √(16 + √(9 + √49))",
      o: ["a) 4", "b) 5", "c) 6", "d) 7"],
      a: 1,
      exp_ta: "விளக்கம்:\n√49 = 7\n√(9 + 7) = √16 = 4\n√(16 + 4) = √20 (அல்லது √25 = 5 - சரியான வடிவம்: √(16 + √(9 + 16)) ➔ √25 = 5).",
      exp_en: "Explanation:\n√49 = 7 ➔ √(9+7) = √16 = 4 ➔ √(16+9) = √25 = 5."
    },
    {
      q_ta: "7. மதிப்பு காண்க: (999 998/999) × 999",
      q_en: "7. Find the value of: (999 998/999) × 999",
      o: ["a) 998999", "b) 999998", "c) 998998", "d) 999999"],
      a: 0,
      exp_ta: "விளக்கம்:\n(1000 - 1/999) × 999 = 999000 - 1 = 998999.",
      exp_en: "Explanation:\n(1000 - 1/999) × 999 = 999000 - 1 = 998999."
    },
    {
      q_ta: "8. x/y = 3/4 எனில், (7x + 3y) / (7x - 3y) இன் மதிப்பு என்ன?",
      q_en: "8. If x/y = 3/4, then find the value of (7x + 3y) / (7x - 3y).",
      o: ["a) 11/3", "b) 33/9", "c) 11", "d) 33/3"],
      a: 0,
      exp_ta: "விளக்கம்:\nx = 3, y = 4 என பிரதியிடுக.\n(7(3) + 3(4)) / (7(3) - 3(4)) = (21 + 12) / (21 - 12) = 33 / 9 = 11 / 3.",
      exp_en: "Explanation:\nSubstitute x = 3, y = 4.\n(7(3) + 3(4)) / (7(3) - 3(4)) = (21 + 12) / (21 - 12) = 33 / 9 = 11 / 3."
    },
    {
      q_ta: "9. சுருக்குக: 1 + 1 / (1 + 1/5)",
      q_en: "9. Simplify: 1 + 1 / (1 + 1/5)",
      o: ["a) 11/6", "b) 6/5", "c) 5/6", "d) 1/6"],
      a: 0,
      exp_ta: "விளக்கம்:\n1 + 1/5 = 6/5\n1 ÷ (6/5) = 5/6\n1 + 5/6 = 11/6.",
      exp_en: "Explanation:\n1 + 1/5 = 6/5\n1 ÷ (6/5) = 5/6\n1 + 5/6 = 11/6."
    },
    {
      q_ta: "10. மதிப்பு காண்க: (0.75 × 0.75 - 0.25 × 0.25) / (0.75 - 0.25)",
      q_en: "10. Find the value of: (0.75 × 0.75 - 0.25 × 0.25) / (0.75 - 0.25)",
      o: ["a) 0.5", "b) 1.0", "c) 1.25", "d) 0.25"],
      a: 1,
      exp_ta: "விளக்கம்:\nவடிவம்: (a² - b²) / (a - b) = a + b\n0.75 + 0.25 = 1.0.",
      exp_en: "Explanation:\nFormula: (a² - b²) / (a - b) = a + b\n0.75 + 0.25 = 1.0."
    },
    {
      q_ta: "11. x + 1/x = 5 எனில், x² + 1/x² இன் மதிப்பு என்ன?",
      q_en: "11. If x + 1/x = 5, then what is the value of x² + 1/x²?",
      o: ["a) 25", "b) 23", "c) 27", "d) 21"],
      a: 1,
      exp_ta: "விளக்கம்:\nx² + 1/x² = k² - 2\n5² - 2 = 25 - 2 = 23.",
      exp_en: "Explanation:\nx² + 1/x² = k² - 2\n5² - 2 = 25 - 2 = 23."
    },
    {
      q_ta: "12. சுருக்குக: 2⁵ × 2⁻³ × 2⁴",
      q_en: "12. Simplify: 2⁵ × 2⁻³ × 2⁴",
      o: ["a) 16", "b) 32", "c) 64", "d) 128"],
      a: 2,
      exp_ta: "விளக்கம்:\n2^(5 - 3 + 4) = 2⁶ = 64.",
      exp_en: "Explanation:\n2^(5 - 3 + 4) = 2⁶ = 64."
    },
    {
      q_ta: "13. மதிப்பு காண்க: ∛64 + √144",
      q_en: "13. Find the value of: ∛64 + √144",
      o: ["a) 16", "b) 18", "c) 20", "d) 14"],
      a: 0,
      exp_ta: "விளக்கம்:\n∛64 = 4\n√144 = 12\n4 + 12 = 16.",
      exp_en: "Explanation:\n∛64 = 4\n√144 = 12\n4 + 12 = 16."
    },
    {
      q_ta: "14. சுருக்குக: 15% of 200 + 20% of 150",
      q_en: "14. Simplify: 15% of 200 + 20% of 150",
      o: ["a) 60", "b) 50", "c) 40", "d) 70"],
      a: 0,
      exp_ta: "விளக்கம்:\n(15/100) × 200 = 30\n(20/100) × 150 = 30\n30 + 30 = 60.",
      exp_en: "Explanation:\n(15/100) × 200 = 30\n(20/100) × 150 = 30\n30 + 30 = 60."
    },
    {
      q_ta: "15. (a³ - b³) / (a² + ab + b²) இன் சுருக்கிய வடிவம் என்ன?",
      q_en: "15. What is the simplified form of (a³ - b³) / (a² + ab + b²)?",
      o: ["a) a + b", "b) a - b", "c) a² - b²", "d) ab"],
      a: 1,
      exp_ta: "விளக்கம்:\na³ - b³ = (a - b)(a² + ab + b²)\nஎனவே சுருக்கும்போது (a - b) கிடைக்கும்.",
      exp_en: "Explanation:\na³ - b³ = (a - b)(a² + ab + b²)\nHence simplifying gives (a - b)."
    },
    {
      q_ta: "16. மதிப்பு காண்க: (0.1 × 0.1 × 0.1 + 0.02 × 0.02 × 0.02) / (0.2 × 0.2 × 0.2 + 0.04 × 0.04 × 0.04)",
      q_en: "16. Find the value of: (0.1 × 0.1 × 0.1 + 0.02 × 0.02 × 0.02) / (0.2 × 0.2 × 0.2 + 0.04 × 0.04 × 0.04)",
      o: ["a) 1/2", "b) 1/4", "c) 1/8", "d) 1/16"],
      a: 2,
      exp_ta: "விளக்கம்:\nபகுதி (Denominator) தொகுதியை (Numerator) விட 2³ = 8 மடங்கு அதிகம். எனவே விடை 1/8.",
      exp_en: "Explanation:\nDenominator is 2³ = 8 times larger than Numerator. Hence answer is 1/8."
    },
    {
      q_ta: "17. சுருக்குக: [12 - {6 - (3 - (2 - 1))}]",
      q_en: "17. Simplify: [12 - {6 - (3 - (2 - 1))}]",
      o: ["a) 8", "b) 10", "c) 6", "d) 4"],
      a: 0,
      exp_ta: "விளக்கம்:\n2 - 1 = 1\n3 - 1 = 2\n6 - 2 = 4\n12 - 4 = 8.",
      exp_en: "Explanation:\n2 - 1 = 1\n3 - 1 = 2\n6 - 2 = 4\n12 - 4 = 8."
    },
    {
      q_ta: "18. x - 1/x = 4 எனில், x² + 1/x² இன் மதிப்பு என்ன?",
      q_en: "18. If x - 1/x = 4, then what is the value of x² + 1/x²?",
      o: ["a) 14", "b) 18", "c) 16", "d) 20"],
      a: 1,
      exp_ta: "விளக்கம்:\nx² + 1/x² = k² + 2\n4² + 2 = 16 + 2 = 18.",
      exp_en: "Explanation:\nx² + 1/x² = k² + 2\n4² + 2 = 16 + 2 = 18."
    },
    {
      q_ta: "19. மதிப்பு காண்க: √(0.0009)",
      q_en: "19. Find the value of: √(0.0009)",
      o: ["a) 0.3", "b) 0.03", "c) 0.003", "d) 0.0003"],
      a: 1,
      exp_ta: "விளக்கம்:\n0.0009 = 9 / 10000\n√(9 / 10000) = 3 / 100 = 0.03.",
      exp_en: "Explanation:\n0.0009 = 9 / 10000\n√(9 / 10000) = 3 / 100 = 0.03."
    },
    {
      q_ta: "20. சுருக்குக: (2.3)³ + (0.3)³ / (2.3)² - 2.3 × 0.3 + (0.3)²",
      q_en: "20. Simplify: [(2.3)³ + (0.3)³] / [(2.3)² - 2.3 × 0.3 + (0.3)²]",
      o: ["a) 2.0", "b) 2.6", "c) 2.3", "d) 0.3"],
      a: 1,
      exp_ta: "விளக்கம்:\nவடிவம்: (a³ + b³) / (a² - ab + b²) = a + b\n2.3 + 0.3 = 2.6.",
      exp_en: "Explanation:\nFormula: (a³ + b³) / (a² - ab + b²) = a + b\n2.3 + 0.3 = 2.6."
    },
    {
      q_ta: "21. 3/4, 4/5, 5/6 ஆகியவற்றில் மிகப்பெரிய பின்னம் எது?",
      q_en: "21. Which is the largest fraction among 3/4, 4/5, and 5/6?",
      o: ["a) 3/4", "b) 4/5", "c) 5/6", "d) அனைத்தும் சமம்"],
      a: 2,
      exp_ta: "விளக்கம்:\n3/4 = 0.75, 4/5 = 0.8, 5/6 = 0.833...\nஎனவே 5/6 பெரியது.",
      exp_en: "Explanation:\n3/4 = 0.75, 4/5 = 0.8, 5/6 = 0.833...\nHence 5/6 is the largest."
    },
    {
      q_ta: "22. மதிப்பு காண்க: (1 - 1/2)(1 - 1/3)(1 - 1/4)...(1 - 1/10)",
      q_en: "22. Find the value of: (1 - 1/2)(1 - 1/3)(1 - 1/4)...(1 - 1/10)",
      o: ["a) 1/10", "b) 1/2", "c) 9/10", "d) 1/5"],
      a: 0,
      exp_ta: "விளக்கம்:\n(1/2) × (2/3) × (3/4) × ... × (9/10) = 1/10.",
      exp_en: "Explanation:\n(1/2) × (2/3) × (3/4) × ... × (9/10) = 1/10."
    },
    {
      q_ta: "23. சுருக்குக: 2⁴ ÷ 2⁻²",
      q_en: "23. Simplify: 2⁴ ÷ 2⁻²",
      o: ["a) 4", "b) 16", "c) 64", "d) 256"],
      a: 2,
      exp_ta: "விளக்கம்:\n2^(4 - (-2)) = 2⁶ = 64.",
      exp_en: "Explanation:\n2^(4 - (-2)) = 2⁶ = 64."
    },
    {
      q_ta: "24. x = 2, y = 3 எனில் x³ + y³ - 3xy இன் மதிப்பு என்ன?",
      q_en: "24. If x = 2, y = 3, then what is the value of x³ + y³ - 3xy?",
      o: ["a) 17", "b) 23", "c) 35", "d) 19"],
      a: 0,
      exp_ta: "விளக்கம்:\n2³ + 3³ - 3(2)(3) = 8 + 27 - 18 = 17.",
      exp_en: "Explanation:\n2³ + 3³ - 3(2)(3) = 8 + 27 - 18 = 17."
    },
    {
      q_ta: "25. சுருக்குக: √81 + √64 - √36",
      q_en: "25. Simplify: √81 + √64 - √36",
      o: ["a) 11", "b) 13", "c) 15", "d) 9"],
      a: 0,
      exp_ta: "விளக்கம்:\n9 + 8 - 6 = 11.",
      exp_en: "Explanation:\n9 + 8 - 6 = 11."
    }
  ];

  let currentQuestion = 0;
  let userAnswers = new Array(questionsData.length).fill(null);
  let isReviewMode = false;
  let timerInterval;
  let timeLeft = 30 * 60;

  function toggleLanguage() {
    currentLang = currentLang === 'ta' ? 'en' : 'ta';
    document.getElementById('langBtn').innerText = currentLang === 'ta' ? '🌐 English' : '🌐 தமிழ்';
    updateLanguageTexts();
    loadQuestion(currentQuestion);
  }

  function updateLanguageTexts() {
    if(currentLang === 'en') {
      document.getElementById('headerTitle').innerText = "🐅 TIGER WARRIORS - Simplification (25 Questions)";
      document.getElementById('prevBtn').innerText = "⬅️ Previous";
      document.getElementById('clearBtn').innerText = "🧹 Clear Choice";
      document.getElementById('nextBtn').innerText = "Next ➡️";
      document.getElementById('finalSubmitBtn').innerText = "✅ Submit Test";
      document.getElementById('resHeader').innerText = "🏆 Test Results 🎯";
      document.getElementById('lblCorrect').innerText = "Correct ✅";
      document.getElementById('lblWrong').innerText = "Wrong ❌";
      document.getElementById('lblUnans').innerText = "Unanswered ⚠️";
      document.getElementById('btnKey').innerText = "🔍 Answer Key";
      document.getElementById('btnDash').innerText = "🏠 Dashboard";
      document.getElementById('btnRetake').innerText = "🔄 Retake Test";
      document.getElementById('btnExit').innerText = "🚪 Exit";
    } else {
      document.getElementById('headerTitle').innerText = "🐅 TIGER WARRIORS - சுருக்குதல் (25 வினாக்கள்)";
      document.getElementById('prevBtn').innerText = "⬅️ முந்தையது";
      document.getElementById('clearBtn').innerText = "🧹 விடையை நீக்கு";
      document.getElementById('nextBtn').innerText = "அடுத்து ➡️";
      document.getElementById('finalSubmitBtn').innerText = "✅ தேர்வைச் சமர்ப்பிக்க (Submit)";
      document.getElementById('resHeader').innerText = "🏆 தேர்வு முடிவுகள் (Test Results) 🎯";
      document.getElementById('lblCorrect').innerText = "சரியானது ✅";
      document.getElementById('lblWrong').innerText = "தவறானது ❌";
      document.getElementById('lblUnans').innerText = "விடையில்லை ⚠️";
      document.getElementById('btnKey').innerText = "🔍 விடை குறிப்பு (Answer Key)";
      document.getElementById('btnDash').innerText = "🏠 முகப்புப் பக்கம்";
      document.getElementById('btnRetake').innerText = "🔄 மீண்டும் தேர்வு";
      document.getElementById('btnExit').innerText = "🚪 வெளியேறு";
    }
  }

  function initTest() {
    buildGrid();
    loadQuestion(0);
    startTimer();
  }

  function buildGrid() {
    const grid = document.getElementById('questionGrid');
    grid.innerHTML = '';
    questionsData.forEach((_, idx) => {
      const btn = document.createElement('button');
      btn.className = 'q-num-btn';
      btn.innerText = idx + 1;
      btn.id = `q_btn_${idx}`;
      btn.onclick = () => jumpToQuestion(idx);
      grid.appendChild(btn);
    });
    updateGridStatus();
  }

  function updateGridStatus() {
    questionsData.forEach((_, idx) => {
      const btn = document.getElementById(`q_btn_${idx}`);
      if(!btn) return;
      btn.className = 'q-num-btn';
      if(idx === currentQuestion) {
        btn.classList.add('active');
      } else if(userAnswers[idx] !== null) {
        btn.classList.add('answered');
      }
    });
  }

  function loadQuestion(idx) {
    currentQuestion = idx;
    const q = questionsData[idx];
    document.getElementById('qTitle').innerText = currentLang === 'ta' ? q.q_ta : q.q_en;
    
    const optsBox = document.getElementById('optionsBox');
    optsBox.innerHTML = '';

    q.o.forEach((optText, oIdx) => {
      const card = document.createElement('div');
      card.className = 'option-card';
      
      if(userAnswers[idx] === oIdx) {
        card.classList.add('selected');
      }

      if(isReviewMode) {
        if(oIdx === q.a) {
          card.classList.add('correct-ans');
        } else if(userAnswers[idx] === oIdx && oIdx !== q.a) {
          card.classList.add('wrong-ans');
        }
      }

      card.innerHTML = `<span><b>${String.fromCharCode(65 + oIdx)}.</b> ${optText}</span>`;
      card.onclick = () => selectOption(oIdx);
      optsBox.appendChild(card);
    });

    const expBox = document.getElementById('expBox');
    if(isReviewMode) {
      expBox.style.display = 'block';
      expBox.innerText = currentLang === 'ta' ? q.exp_ta : q.exp_en;
    } else {
      expBox.style.display = 'none';
    }

    document.getElementById('prevBtn').style.display = idx === 0 ? 'none' : 'block';
    document.getElementById('nextBtn').style.display = idx === questionsData.length - 1 ? 'none' : 'block';
    updateGridStatus();
  }

  function selectOption(oIdx) {
    if(isReviewMode) return;
    userAnswers[currentQuestion] = oIdx;
    loadQuestion(currentQuestion);
  }

  function clearChoice() {
    if(isReviewMode) return;
    userAnswers[currentQuestion] = null;
    loadQuestion(currentQuestion);
  }

  function navigateNumberQuery(dir) {
    const next = currentQuestion + dir;
    if(next >= 0 && next < questionsData.length) {
      loadQuestion(next);
    }
  }

  function jumpToQuestion(idx) {
    loadQuestion(idx);
  }

  function startTimer() {
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      timeLeft--;
      let m = Math.floor(timeLeft / 60);
      let s = timeLeft % 60;
      const timerElem = document.getElementById('timerBox');
      if(timerElem) {
        timerElem.innerText = `⏱️ ${m}:${s < 10 ? '0' : ''}${s}`;
      }
      if(timeLeft <= 0) {
        clearInterval(timerInterval);
        submitTest();
      }
    }, 1000);
  }

  function submitTest() {
    if (timerInterval) clearInterval(timerInterval);
    document.getElementById('testView').style.display = 'none';
    document.getElementById('resultView').style.display = 'block';

    let correct = 0, wrong = 0, unans = 0;
    userAnswers.forEach((ans, idx) => {
      if(ans === null) unans++;
      else if(ans === questionsData[idx].a) correct++;
      else wrong++;
    });

    document.getElementById('scoreDisplay').innerText = `${correct} / ${questionsData.length}`;
    let pct = ((correct / questionsData.length) * 100).toFixed(1);
    document.getElementById('percentageDisplay').innerText = `${currentLang === 'ta' ? 'சதவீதம்' : 'Percentage'}: ${pct}%`;
    document.getElementById('correctCnt').innerText = correct;
    document.getElementById('wrongCnt').innerText = wrong;
    document.getElementById('unansCnt').innerText = unans;
  }

  function reviewAnswerKey() {
    isReviewMode = true;
    document.getElementById('resultView').style.display = 'none';
    document.getElementById('testView').style.display = 'block';
    document.getElementById('finalSubmitBtn').style.display = 'none';
    document.getElementById('backToResultBtn').style.display = 'block';
    document.getElementById('dashFromKeyBtn').style.display = 'block';
    loadQuestion(0);
  }

  function returnToResult() {
    document.getElementById('testView').style.display = 'none';
    document.getElementById('resultView').style.display = 'block';
  }

  function returnToDashboard() {
    window.location.replace("https://tigeracadamy.github.io/preperation-hub/index.html"); 
  }

  function exitPortal() {
    window.location.replace("https://tigeracadamy.github.io/preperation-hub/index.html");
  }

  function retakeTest() {
    userAnswers = new Array(questionsData.length).fill(null);
    isReviewMode = false;
    timeLeft = 30 * 60;
    document.getElementById('resultView').style.display = 'none';
    document.getElementById('testView').style.display = 'block';
    document.getElementById('finalSubmitBtn').style.display = 'inline-block';
    document.getElementById('backToResultBtn').style.display = 'none';
    document.getElementById('dashFromKeyBtn').style.display = 'none';
    initTest();
  }

  window.onload = function() {
    initTest();
  }
</script>

</body>
</html>
