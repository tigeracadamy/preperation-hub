<script>
  let currentLang = 'ta';

  const questionsData = [
    {
      q_ta: "1. ₹4000 அசலுக்கு ஆண்டு வட்டி வீதம் 5% எனில், 2 ஆண்டுகளில் கிடைக்கும் கூட்டுவட்டி என்ன?\n[TNPSC Group 4 - PYQ]",
      q_en: "1. Find the compound interest on ₹4000 at 5% per annum for 2 years.\n[TNPSC Group 4 - PYQ]",
      o: ["a) ₹410", "b) ₹420", "c) ₹400", "d) ₹450"],
      a: 0,
      exp_ta: "<b>விளக்கம்:</b><br>A = P(1 + R/100)^n = 4000 × (1 + 5/100)² = 4000 × (21/20) × (21/20) = 4000 × (441/400) = ₹4410.<br>கூட்டுவட்டி CI = A - P = 4410 - 4000 = ₹410.",
      exp_en: "<b>Explanation:</b><br>A = 4000 × (21/20)² = ₹4410. CI = 4410 - 4000 = ₹410."
    },
    {
      q_ta: "2. ஒரு குறிப்பிட்ட தொகையானது கூட்டுவட்டி முறையில் 2 ஆண்டுகளில் 4 மடங்காகிறது எனில், அது எத்தனை ஆண்டுகளில் 8 மடங்காகும்?\n[TNPSC Group 2A - PYQ]",
      q_en: "2. A sum of money placed at compound interest becomes 4 times in 2 years. In how many years will it become 8 times?\n[TNPSC Group 2A - PYQ]",
      o: ["a) 3 ஆண்டுகள்", "b) 4 ஆண்டுகள்", "c) 5 ஆண்டுகள்", "d) 6 ஆண்டுகள்"],
      a: 0,
      exp_ta: "<b>விளக்கம்:</b><br>2 ஆண்டுகளில் 4 மடங்கு (2²). 8 மடங்கு என்பது 2³ ஆகும். எனவே காலங்களின் பெருக்குத் தொகை: 2 × (3/2) = 3 ஆண்டுகள் (அல்லது சுருக்கமாக: 2 வருடம் = 4 மடங்கு, 4 வருடம் = 16 மடங்கு. எனவே 3 வருடம் = 2^(3) = 8 மடங்கு).",
      exp_en: "<b>Explanation:</b><br>4 times in 2 years means (2²). 8 times is 2³. Thus time required = 3 years."
    },
    {
      q_ta: "3. ₹8000 தொகைக்கு ஆண்டுக்கு 10% வட்டி வீதம், அரை ஆண்டுக்கு ஒருமுறை வட்டி கணக்கிடப்பட்டால் 1 வருடத்தில் கிடைக்கும் கூட்டுவட்டி என்ன?\n[TNPSC Group 1 - PYQ]",
      q_en: "3. Find the compound interest on ₹8000 at 10% per annum compounded half-yearly for 1 year.\n[TNPSC Group 1 - PYQ]",
      o: ["a) ₹820", "b) ₹840", "c) ₹800", "d) ₹850"],
      a: 0,
      exp_ta: "<b>விளக்கம்:</b><br>அரை ஆண்டு என்பதால் R = 10/2 = 5% மற்றும் N = 1 × 2 = 2 காலங்கள்.<br>A = 8000 × (105/100)² = 8000 × (21/20) × (21/20) = ₹8820.<br>CI = 8820 - 8000 = ₹820.",
      exp_en: "<b>Explanation:</b><br>Half-yearly: R = 5%, N = 2. A = 8000 × (21/20)² = ₹8820. CI = ₹820."
    },
    {
      q_ta: "4. ₹10,000 அசலுக்கு 3 ஆண்டுகளுக்கு ஆண்டு வட்டி வீதம் முறையே முதல் ஆண்டு 4%, இரண்டாம் ஆண்டு 5%, மூன்றாம் ஆண்டு 6% எனில் மொத்தத் தொகை என்ன?\n[TNPSC Group 2 - PYQ]",
      q_en: "4. Find the amount on ₹10,000 for 3 years if the rates of interest for successive years are 4%, 5%, and 6% respectively.\n[TNPSC Group 2 - PYQ]",
      o: ["a) ₹11,575.20", "b) ₹11,500", "c) ₹11,600", "d) ₹11,480"],
      a: 0,
      exp_ta: "<b>விளக்கம்:</b><br>A = 10000 × (104/100) × (105/100) × (106/100) = 10000 × 1.04 × 1.05 × 1.06 = ₹11,575.20.",
      exp_en: "<b>Explanation:</b><br>A = 10000 × (104/100) × (105/100) × (106/100) = ₹11,575.20."
    },
    {
      q_ta: "5. ஒரு அசலுக்கு 2 ஆண்டுகளில் 4% வட்டி வீதத்தில் கிடைக்கும் கூட்டுவட்டி ₹102 எனில், அந்த அசல் என்ன?\n[TNPSC VAO - PYQ]",
      q_en: "5. If the compound interest on a sum for 2 years at 4% per annum is ₹102, find the principal.\n[TNPSC VAO - PYQ]",
      o: ["a) ₹1250", "b) ₹1200", "c) ₹1500", "d) ₹1000"],
      a: 0,
      exp_ta: "<b>விளக்கம்:</b><br>CI = P[(1 + R/100)^n - 1] ➔ 102 = P[(1 + 4/100)² - 1] = P[(26/25)² - 1] = P[(676/625) - 1] = P(51/625)<br>P = (102 × 625) / 51 = 2 × 625 = ₹1250.",
      exp_en: "<b>Explanation:</b><br>CI = P[(26/25)² - 1] = P(51/625) = 102 ➔ P = ₹1250."
    },
    {
      q_ta: "6. ஒரு குறிப்பிட்ட தொகையானது 3 ஆண்டுகளில் கூட்டுவட்டி முறையில் 8 மடங்காகிறது எனில், வட்டி வீதம் என்ன?\n[TNPSC CCSE - PYQ]",
      q_en: "6. A sum of money becomes 8 times in 3 years at compound interest. Find the rate of interest per annum.\n[TNPSC CCSE - PYQ]",
      o: ["a) 100%", "b) 50%", "c) 25%", "d) 200%"],
      a: 0,
      exp_ta: "<b>விளக்கம்:</b><br>A = P(1 + R/100)^n ➔ 8P = P(1 + R/100)³ ➔ 2³ = (1 + R/100)³<br>2 = 1 + R/100 ➔ R/100 = 1 ➔ R = 100%.",
      exp_en: "<b>Explanation:</b><br>8P = P(1 + R/100)³ ➔ 2 = 1 + R/100 ➔ R = 100%."
    },
    {
      q_ta: "7. ₹5000 தொகைக்கு 2 ஆண்டுகளுக்கு ஆண்டுக்கு 8% வட்டி வீதம் தனிவட்டிக்கும் கூட்டுவட்டிக்கும் உள்ள வித்தியாசம் என்ன?\n[TNPSC Group 4 - PYQ]",
      q_en: "7. Find the difference between simple interest and compound interest on ₹5000 for 2 years at 8% per annum.\n[TNPSC Group 4 - PYQ]",
      o: ["a) ₹32", "b) ₹30", "c) ₹35", "d) ₹40"],
      a: 0,
      exp_ta: "<b>விளக்கம்:</b><br>2 ஆண்டுகளுக்கு CI - SI வித்தியாசம் = P(R/100)² = 5000 × (8/100)² = 5000 × (64 / 10000) = 320000 / 10000 = ₹32.",
      exp_en: "<b>Explanation:</b><br>Difference for 2 years = P(R/100)² = 5000 × (8/100)² = ₹32."
    },
    {
      q_ta: "8. கூட்டுவட்டி முறையில் ஒரு குறிப்பிட்ட தொகையானது 4 ஆண்டுகளில் தன் இரு மடங்காகிறது எனில், எத்தனையாண்டுகளில் அது 16 மடங்காகும்?\n[TNPSC Group 1 - PYQ]",
      q_en: "8. A sum placed at compound interest doubles itself in 4 years. In how many years will it amount to 16 times?\n[TNPSC Group 1 - PYQ]",
      o: ["a) 16 ஆண்டுகள்", "b) 12 ஆண்டுகள்", "c) 8 ஆண்டுகள்", "d) 20 ஆண்டுகள்"],
      a: 0,
      exp_ta: "<b>விளக்கம்:</b><br>4 ஆண்டுகளில் 2 மடங்கு. 16 மடங்கு என்பது 2⁴ ஆகும்.<br>காலம் = 4 × 4 = 16 ஆண்டுகள்.",
      exp_en: "<b>Explanation:</b><br>Doubles in 4 years. 16 = 2⁴. Total time = 4 × 4 = 16 years."
    },
    {
      q_ta: "9. ₹6000 அசலுக்கு 1.5 ஆண்டுகளுக்கு ஆண்டுக்கு 20% வட்டி வீதம், அரை ஆண்டுக்கு ஒருமுறை வட்டி கணக்கிடப்பட்டால் கிடைக்கும் கூட்டுவட்டி என்ன?\n[TNPSC Group 2 - PYQ]",
      q_en: "9. Find the compound interest on ₹6000 for 1.5 years at 20% per annum compounded half-yearly.\n[TNPSC Group 2 - PYQ]",
      o: ["a) ₹2052", "b) ₹2000", "c) ₹2100", "d) ₹1980"],
      a: 0,
      exp_ta: "<b>விளக்கம்:</b><br>அரை ஆண்டு என்பதால் R = 20/2 = 10% மற்றும் N = 1.5 × 2 = 3 காலங்கள்.<br>A = 6000 × (110/100)³ = 6000 × (1.1)³ = 6000 × 1.331 = ₹8052.<br>CI = 8052 - 6000 = ₹2052.",
      exp_en: "<b>Explanation:</b><br>Half-yearly: R = 10%, N = 3. A = 6000 × (1.1)³ = ₹8052. CI = ₹2052."

    {
      q_ta: "10. எந்த அசலானது 5% கூட்டுவட்டி வீதத்தில் 2 ஆண்டுகளில் ₹441 ஐ வட்டியாகத் தரும்?\n[TNPSC Group 4 - PYQ]",
      q_en: "10. Find the principal which gives ₹441 as compound interest at 5% per annum for 2 years.\n[TNPSC Group 4 - PYQ]",

      q_en: "29. A sum gives SI of ₹200 and CI of ₹210 for 2 years. Find the rate of interest.\n[Expected Question - Group 1/2A]",
      o: ["a) 10%", "b) 5%", "c) 8%", "d) 12%"],
      a: 0,
      exp_ta: "<b>விளக்கம்:</b><br>முதல் ஆண்டு தனிவட்டி = ₹100. கூடுதல் வட்டி ₹10 என்பது முதல் ஆண்டு வட்டி மீது கிடைத்த வட்டியாகும்.<br>R = (10 / 100) × 100 = 10%.",
      exp_en: "<b>Explanation:</b><br>Difference = ₹10 on first year's interest of ₹100. R = (10 / 100) × 100 = 10%."
    },
    {
      q_ta: "30. ₹5000 தொகைக்கு ஆண்டுக்கு 8% வட்டி வீதம் 2 ஆண்டுகளுக்கு அரை ஆண்டுக்கு ஒருமுறை வட்டி கணக்கிடப்பட்டால் கிடைக்கும் கூட்டுவட்டி என்ன?\n[எதிர்பார்க்கப்படும் வினா - Group 2]",
      q_en: "30. Find compound interest on ₹5000 at 8% per annum for 2 years compounded half-yearly.\n[Expected Question - Group 2]",
      o: ["a) ₹858.30", "b) ₹840", "c) ₹850", "d) ₹820"],
      a: 0,
      exp_ta: "<b>விளக்கம்:</b><br>அரை ஆண்டு என்பதால் R = 8/2 = 4% மற்றும் N = 2 × 2 = 4 காலங்கள்.<br>A = 5000 × (104/100)⁴ = 5000 × (26/25)⁴ = 5000 × 1.16985 = ₹5858.30.<br>CI = ₹858.30.",
      exp_en: "<b>Explanation:</b><br>Half-yearly: R = 4%, N = 4. A = ₹5858.30. CI = ₹858.30."
    }
  ];

  let currentQuestion = 0;
  let userAnswers = new Array(questionsData.length).fill(null);
  let isReviewMode = false;
  let timerInterval;
  let timeLeft = 45 * 60;

  function toggleLanguage() {
    currentLang = currentLang === 'ta' ? 'en' : 'ta';
    document.getElementById('langBtn').innerText = currentLang === 'ta' ? '🌐 English' : '🌐 தமிழ்';
    updateLanguageTexts();
    loadQuestion(currentQuestion);
  }

  function updateLanguageTexts() {
    if(currentLang === 'en') {
      document.getElementById('headerTitle').innerText = "🐅 TIGER WARRIORS - Compound Interest (30 Questions)";
      document.getElementById('prevBtn').innerText = "⬅️ Previous";
      document.getElementById('clearBtn').innerText = "🧹 Clear Choice";
      document.getElementById('nextBtn').innerText = "Next ➡️";
      document.getElementById('finalSubmitBtn').innerText = "✅ Submit Test";
      document.getElementById('resHeader').innerText = "🏆 Test Results 🎯";
      document.getElementById('lblCorrect').innerText = "Correct ✅";
      document.getElementById('lblWrong').innerText = "Wrong ❌";
      document.getElementById('lblUnans').innerText = "Unanswered ⚠️";
      document.getElementById('btnKey').innerText = "🔍 Answer Key";
      document.getElementById('btnDash').innerText = "🏠 Dashboard";
      document.getElementById('btnRetake').innerText = "🔄 Retake Test";
      document.getElementById('btnExit').innerText = "🚪 Exit";
    } else {
      document.getElementById('headerTitle').innerText = "🐅 TIGER WARRIORS - கூட்டுவட்டி (Compound Interest) 30 வினாக்கள்";
      document.getElementById('prevBtn').innerText = "⬅️ முந்தையது";
      document.getElementById('clearBtn').innerText = "🧹 விடையை நீக்கு";
      document.getElementById('nextBtn').innerText = "அடுத்து ➡️";
      document.getElementById('finalSubmitBtn').innerText = "✅ தேர்வைச் சமர்ப்பிக்க (Submit)";
      document.getElementById('resHeader').innerText = "🏆 தேர்வு முடிவுகள் (Test Results) 🎯";
      document.getElementById('lblCorrect').innerText = "சரியானது ✅";
      document.getElementById('lblWrong').innerText = "தவறானது ❌";
      document.getElementById('lblUnans').innerText = "விடையில்லை ⚠️";
      document.getElementById('btnKey').innerText = "🔍 விடை குறிப்பு & விளக்கம்";
      document.getElementById('btnDash').innerText = "🏠 முகப்புப் பக்கம்";
      document.getElementById('btnRetake').innerText = "🔄 மீண்டும் தேர்வு";
      document.getElementById('btnExit').innerText = "🚪 வெளியேறு";
    }
  }

  function initTest() {
    buildGrid();
    loadQuestion(0);
    startTimer();
  }

  function buildGrid() {
    const grid = document.getElementById('questionGrid');
    grid.innerHTML = '';
    questionsData.forEach((_, idx) => {
      const btn = document.createElement('button');
      btn.className = 'q-num-btn';
      btn.innerText = idx + 1;
      btn.id = `q_btn_${idx}`;
      btn.onclick = () => jumpToQuestion(idx);
      grid.appendChild(btn);
    });
    updateGridStatus();
  }

  function updateGridStatus() {
    questionsData.forEach((_, idx) => {
      const btn = document.getElementById(`q_btn_${idx}`);
      if(!btn) return;
      btn.className = 'q-num-btn';
      if(idx === currentQuestion) {
        btn.classList.add('active');
      } else if(userAnswers[idx] !== null) {
        btn.classList.add('answered');
      }
    });
  }

  function searchInAI(provider, questionIdx) {
    const q = questionsData[questionIdx];
    const questionText = (currentLang === 'ta' ? q.q_ta : q.q_en).replace(/<[^>]*>?/gm, '');
    const optionsText = q.o.join(", ");
    const fullQuery = encodeURIComponent(`Explain this TNPSC Compound Interest question step by step:\n${questionText}\nOptions: ${optionsText}`);
    
    let targetUrl = "";
    if (provider === 'chatgpt') {
      targetUrl = `https://chatgpt.com/?q=${fullQuery}`;
    } else if (provider === 'gemini') {
      targetUrl = `https://gemini.google.com/app`;
    } else if (provider === 'perplexity') {
      targetUrl = `https://www.perplexity.ai/?q=${fullQuery}`;
    } else if (provider === 'google') {
      targetUrl = `https://www.google.com/search?q=${fullQuery}`;
    }

    window.open(targetUrl, '_blank');
  }

  function loadQuestion(idx) {
    currentQuestion = idx;
    const q = questionsData[idx];
    document.getElementById('qTitle').innerText = currentLang === 'ta' ? q.q_ta : q.q_en;
    
    const optsBox = document.getElementById('optionsBox');
    optsBox.innerHTML = '';

    q.o.forEach((optText, oIdx) => {
      const card = document.createElement('div');
      card.className = 'option-card';
      
      if(userAnswers[idx] === oIdx) {
        card.classList.add('selected');
      }

      if(isReviewMode) {
        if(oIdx === q.a) {
          card.classList.add('correct-ans');
        } else if(userAnswers[idx] === oIdx && oIdx !== q.a) {
          card.classList.add('wrong-ans');
        }
      }

      card.innerHTML = `<span><b>${String.fromCharCode(65 + oIdx)}.</b> ${optText}</span>`;
      card.onclick = () => selectOption(oIdx);
      optsBox.appendChild(card);
    });

    const expBox = document.getElementById('expBox');
    if(isReviewMode) {
      expBox.style.display = 'block';
      let baseExp = currentLang === 'ta' ? q.exp_ta : q.exp_en;
      
      expBox.innerHTML = `
        <div style="font-size: 14px; margin-bottom: 8px;">${baseExp}</div>
        <div style="font-size: 12px; color: #fbbf24; margin-top: 10px; font-weight: bold;">🤖 AI Link Buttons (Opens in New Tab):</div>
        <div class="ai-btn-group">
          <button class="ai-link-btn btn-chatgpt" onclick="searchInAI('chatgpt', ${idx})">🟢 ChatGPT</button>
          <button class="ai-link-btn btn-gemini" onclick="searchInAI('gemini', ${idx})">✨ Gemini AI</button>
          <button class="ai-link-btn btn-perplexity" onclick="searchInAI('perplexity', ${idx})">🔵 Perplexity</button>
          <button class="ai-link-btn btn-google" onclick="searchInAI('google', ${idx})">🔍 Google Search</button>
        </div>
      `;
    } else {
      expBox.style.display = 'none';
    }

    document.getElementById('prevBtn').style.display = idx === 0 ? 'none' : 'block';
    document.getElementById('nextBtn').style.display = idx === questionsData.length - 1 ? 'none' : 'block';
    updateGridStatus();
  }

  function selectOption(oIdx) {
    if(isReviewMode) return;
    userAnswers[currentQuestion] = oIdx;
    loadQuestion(currentQuestion);
  }

  function clearChoice() {
    if(isReviewMode) return;
    userAnswers[currentQuestion] = null;
    loadQuestion(currentQuestion);
  }

  function navigateNumberQuery(dir) {
    const postNext = currentQuestion + dir;
    if(postNext >= 0 && postNext < questionsData.length) {
      loadQuestion(postNext);
    }
  }

  function jumpToQuestion(idx) {
    loadQuestion(idx);
  }

  function startTimer() {
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      timeLeft--;
      let m = Math.floor(timeLeft / 60);
      let s = timeLeft % 60;
      const timerElem = document.getElementById('timerBox');
      if(timerElem) {
        timerElem.innerText = `⏱️ ${m}:${s < 10 ? '0' : ''}${s}`;
      }
      if(timeLeft <= 0) {
        clearInterval(timerInterval);
        submitTest();
      }
    }, 1000);
  }

  function submitTest() {
    if (timerInterval) clearInterval(timerInterval);
    document.getElementById('testView').style.display = 'none';
    document.getElementById('resultView').style.display = 'block';

    let correct = 0, wrong = 0, unans = 0;
    userAnswers.forEach((ans, idx) => {
      if(ans === null) unans++;
      else if(ans === questionsData[idx].a) correct++;
      else wrong++;
    });

    document.getElementById('scoreDisplay').innerText = `${correct} / ${questionsData.length}`;
    let pct = ((correct / questionsData.length) * 100).toFixed(1);
    document.getElementById('percentageDisplay').innerText = `${currentLang === 'ta' ? 'சதவீதம்' : 'Percentage'}: ${pct}%`;
    document.getElementById('correctCnt').innerText = correct;
    document.getElementById('wrongCnt').innerText = wrong;
    document.getElementById('unansCnt').innerText = unans;
  }

  function reviewAnswerKey() {
    isReviewMode = true;
    document.getElementById('resultView').style.display = 'none';
    document.getElementById('testView').style.display = 'block';
    document.getElementById('finalSubmitBtn').style.display = 'none';
    document.getElementById('backToResultBtn').style.display = 'block';
    document.getElementById('dashFromKeyBtn').style.display = 'block';
    loadQuestion(0);
  }

  function returnToResult() {
    document.getElementById('testView').style.display = 'none';
    document.getElementById('resultView').style.display = 'block';
  }

  function returnToDashboard() {
    window.location.replace("https://tigeracadamy.github.io/preperation-hub/index.html"); 
  }

  function exitPortal() {
    window.location.replace("https://tigeracadamy.github.io/preperation-hub/index.html");
  }

  function retakeTest() {
    userAnswers = new Array(questionsData.length).fill(null);
    isReviewMode = false;
    timeLeft = 45 * 60;
    document.getElementById('resultView').style.display = 'none';
    document.getElementById('testView').style.display = 'block';
    document.getElementById('finalSubmitBtn').style.display = 'inline-block';
    document.getElementById('backToResultBtn').style.display = 'none';
    document.getElementById('dashFromKeyBtn').style.display = 'none';
    initTest();
  }

  window.onload = function() {
    initTest();
  }
</script>
