<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tiger Warriors - வேர்ச்சொல் 50 வினாக்கள்</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; font-weight: bold; }
    body { background: #080604; color: #f8fafc; padding: 12px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { width: 100%; max-width: 950px; background: #0f172a; border-radius: 14px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); border: 1px solid #334155; }
    
    .test-header { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; border: 1px solid #334155; }
    .timer { font-size: 15px; font-weight: bold; color: #fbbf24; background: #091326; padding: 6px 12px; border-radius: 6px; border: 1px solid #fbbf24; box-shadow: inset 0 0 5px rgba(251, 191, 36, 0.2); }
    
    .q-grid { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 16px; max-height: 140px; overflow-y: auto; padding: 8px; background: #1e293b; border-radius: 8px; justify-content: center; }
    .q-num-btn { width: 30px; height: 30px; border-radius: 5px; border: none; background: #334155; color: #fff; font-size: 10px; cursor: pointer; font-weight: bold; }
    .q-num-btn.active { border: 2px solid #38bdf8; background: #0284c7; }
    .q-num-btn.answered { background: #10b981; }

    .q-box { background: #1e293b; padding: 18px; border-radius: 10px; margin-bottom: 16px; border: 1px solid #334155; }
    .q-text { white-space: pre-line; line-height: 1.6; font-size: 15px; color: #f8fafc; }
    
    .option-card { background: #0f172a; border: 1px solid #334155; padding: 12px 16px; border-radius: 8px; margin-top: 10px; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: 0.2s; white-space: pre-line; line-height: 1.4; }
    .option-card:hover { border-color: #38bdf8; background: #1e293b; }
    .option-card.selected { border-color: #10b981; background: #064e3b; }
    .option-card.correct-ans { border-color: #10b981; background: #065f46; font-weight: bold; }
    .option-card.wrong-ans { border-color: #ef4444; background: #7f1d1d; }

    .explanation-box { background: #091326; border: 1px solid #38bdf8; border-radius: 8px; padding: 12px; margin-top: 14px; font-size: 13px; color: #7dd3fc; line-height: 1.5; }
    
    .nav-btns { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    .btn-action { background: #334155; color: #fff; border: none; padding: 10px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 13px; text-align: center; }
    .btn-action:hover { opacity: 0.9; }
    .btn-blue { background: #2563eb; }
    .btn-purple { background: #7c3aed; }
    .btn-danger { background: #ef4444; }
    .btn-green { background: #22c55e; }

    .result-box { text-align: center; padding: 25px; background: #1e293b; border-radius: 16px; margin-top: 10px; border: 1px solid rgba(0, 242, 254, 0.3); display: flex; flex-direction: column; align-items: center; }
    .score-circle { width: 130px; height: 130px; border-radius: 50%; background: conic-gradient(#10b981 0deg, #0f172a 0deg); display: flex; flex-direction: column; justify-content: center; align-items: center; margin: 0 auto 15px auto; border: 4px solid #38bdf8; box-shadow: 0 0 20px rgba(56, 189, 248, 0.4); }
    .score-num { font-size: 30px; color: #f8fafc; font-weight: bold; }
    
    .result-stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; width: 100%; max-width: 400px; }
    .stat-pill { background: #0f172a; border-radius: 12px; padding: 10px; border: 1px solid #334155; text-align: center; }
    .stat-pill.gold { border-color: #fbbf24; }
    .stat-pill.blue { border-color: #38bdf8; }
    .stat-pill.red { border-color: #ef4444; }

    .footer-badge { text-align: center; font-size: 11px; color: #38bdf8; margin-top: 15px; font-weight: bold; letter-spacing: 0.5px; }
  </style>
</head>
<body>

<div class="card">
  <script>
      if (localStorage.getItem('tiger_auth_passed') !== 'true') {
          alert("⚠ பாதுகாப்பு எச்சரிக்கை: நீங்கள் Tiger Warriors போர்ட்டலில் லாகின் செய்யவில்லை! முதலில் மெயின் போர்ட்டலில் லாகின் செய்யவும்.");
          window.location.replace("https://tigeracadamy.github.io/preperation-hub/index.html"); 
      }
  </script>

  <div id="testView">
    <div class="test-header">
      <div>
        <h3 style="color: #38bdf8; font-size: 15px;">🐅 TIGER WARRIORS - வேர்ச்சொல் (50 வினாக்கள்)</h3>
        <span style="font-size: 11px; color: #94a3b8;">TNPSC / 2 / 2A / 4 • TAMIL GRAMMAR</span>
      </div>
      <div style="display: flex; gap: 8px; align-items: center;">
        <div class="timer" id="timerBox">⏱️ 45:00</div>
        <button class="btn-action btn-purple" id="backToResultBtn" onclick="returnToResult()" style="display: none; padding: 6px 12px; font-size: 12px;">📊 ரிசல்ட் செல்</button>
        <button class="btn-action btn-danger" id="dashFromKeyBtn" onclick="returnToDashboard()" style="display: none; padding: 6px 12px; font-size: 12px;">🏠 முகப்பு</button>
      </div>
    </div>

    <div class="q-grid" id="questionGrid"></div>

    <div class="q-box">
      <div id="qTitle" class="q-text"></div>
      <div id="optionsBox"></div>
      <div id="expBox" class="explanation-box" style="display: none;"></div>
    </div>

    <div class="nav-btns">
      <button class="btn-action" id="prevBtn" onclick="navigateNumberQuery(-1)">⬅️ முந்தையது</button>
      <button class="btn-action" id="clearBtn" onclick="clearChoice()">🧹 விடையை நீக்கு</button>
      <button class="btn-action btn-blue" id="nextBtn" onclick="navigateNumberQuery(1)">அடுத்து ➡️</button>
      <button class="btn-action btn-danger" id="finalSubmitBtn" onclick="submitTest()">✅ தேர்வைச் சமர்ப்பிக்க (Submit)</button>
    </div>
  </div>

  <div id="resultView" style="display: none;">
    <h2 style="color: #38bdf8; text-align: center; margin-bottom: 10px;">🏆 தேர்வு முடிவுகள் (Test Results) 🎯</h2>
    <div class="result-box">
      <div class="score-circle" id="scoreCircle">
        <div class="score-num" id="scoreDisplay">0/50</div>
        <span id="percentageDisplay" style="font-size: 11px; color: #fbbf24;">0%</span>
      </div>

      <div class="result-stats-grid">
        <div class="stat-pill gold">
          <h3 id="correctCnt" style="color: #10b981; font-size: 18px;">0</h3>
          <span style="font-size: 11px; color: #cbd5e1;">சரியானவை ✅</span>
        </div>
        <div class="stat-pill red">
          <h3 id="wrongCnt" style="color: #ef4444; font-size: 18px;">0</h3>
          <span style="font-size: 11px; color: #cbd5e1;">தவறானவை ❌</span>
        </div>
        <div class="stat-pill blue">
          <h3 id="unansCnt" style="color: #f59e0b; font-size: 18px;">0</h3>
          <span style="font-size: 11px; color: #cbd5e1;">விடையில்லை ⚠️</span>
        </div>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px;">
      <button class="btn-action btn-blue" onclick="reviewAnswerKey()">🔍 விடை குறிப்பு (Answer Key)</button>
      <button class="btn-action btn-purple" onclick="returnToDashboard()">🏠 முகப்புப் பக்கம்</button>
      <button class="btn-action btn-green" onclick="retakeTest()">🔄 மீண்டும் தேர்வு</button>
      <button class="btn-action btn-danger" onclick="exitPortal()">🚪 வெளியேறு</button>
    </div>
    <div class="footer-badge" style="margin-top: 20px;">🐅 டைகர் வாரியர் போர்டல் - இயக்குநர்: Dr. K. மணிகாசி 🐅</div>
  </div>
</div>

<script>
  const questionsData = [
    { q: "1. 'நடந்தான்' என்பதன் வேர்ச்சொல் யாவை?", o: ["a) நடா", "b) நட", "c) நடந்த", "d) நடவு"], a: 1, exp: "விளக்கம்: ஒரு சொல்லின் ஏவல் வினையே அதன் வேர்ச்சொல் ஆகும். 'நடந்தான்' என்ற சொல்லின் வேர்ச்சொல் 'நட' ஆகும்." },
    { q: "2. 'படித்தான்' என்ற சொல்லின் வேர்ச்சொல்லைக் கண்டறிக:", o: ["a) படி", "b) படித்த", "c) பாட", "d) படிப்பு"], a: 0, exp: "விளக்கம்: 'படித்தான்' என்பது இறந்தகால வினைமுற்று. இதன் வேர்ச்சொல் 'படி' (ஏவல் வினை)." },
    { q: "3. 'சென்றான்' என்பதன் வேர்ச்சொல் என்ன?", o: ["a) செல்", "b) சென்று", "c) சென்", "d) செல்லு"], a: 0, exp: "விளக்கம்: 'சென்றான்' என்பதன் வேர்ச்சொல் 'செல்' ஆகும்." },
    { q: "4. 'உண்டான்' என்ற சொல்லின் வேர்ச்சொல் எது?", o: ["a) உண்", "b) உண்டு", "c) ஊண்", "d) உணவு"], a: 0, exp: "விளக்கம்: 'உண்டான்' என்பதன் வேர்ச்சொல் 'உண்' ஆகும்." },
    { q: "5. 'தந்தான்' என்பதன் வேர்ச்சொல் யாது?", o: ["a) தா", "b) தந்தி", "c) தர்", "d) தந்து"], a: 0, exp: "விளக்கம்: 'தந்தான்' என்ற சொல்லின் வேர்ச்சொல் 'தா' ஆகும்." },
    { q: "6. 'கேட்டான்' என்பதன் வேர்ச்சொல் என்ன?", o: ["a) கேள்", "b) கேட்டு", "c) கேளு", "d) கெள்"], a: 0, exp: "விளக்கம்: 'கேட்டான்' என்ற சொல்லின் வேர்ச்சொல் 'கேள்' ஆகும்." },
    { q: "7. 'பார்த்தான்' என்பதன் வேர்ச்சொல்லைத் தேர்ந்தெடுக்க:", o: ["a) பார்", "b) பார்த்து", "c) பார்மி", "d) பார்சு"], a: 0, exp: "விளக்கம்: 'பார்த்தான்' என்பதன் வேர்ச்சொல் 'பார்' ஆகும்." },
    { q: "8. 'அறிந்தான்' என்பதன் வேர்ச்சொல் யாது?", o: ["a) அறி", "b) அறிந்து", "c) அறிவு", "d) அறிந்த"], a: 0, exp: "விளக்கம்: 'அறிந்தான்' என்பதன் வேர்ச்சொல் 'அறி' ஆகும்." },
    { q: "9. 'நின்றான்' என்பதன் வேர்ச்சொல் என்ன?", o: ["a) நில்", "b) நின்று", "c) நினி", "d) நிலை"], a: 0, exp: "விளக்கம்: 'நின்றான்' என்ற சொல்லின் வேர்ச்சொல் 'நில்' ஆகும்." },
    { q: "10. 'வாழ்ந்தான்' என்பதன் வேர்ச்சொல் யாது?", o: ["a) வாழ்", "b) வாழ்ந்து", "c) வாழ்க்கை", "d) வாழ்வு"], a: 0, exp: "விளக்கம்: 'வாழ்ந்தான்' என்பதன் வேர்ச்சொல் 'வாழ்' ஆகும்." },
    { q: "11. 'செய்தான்' என்பதன் வேர்ச்சொல் என்ன?", o: ["a) செய்", "b) செய்து", "c) செயல்", "d) செய்கை"], a: 0, exp: "விளக்கம்: 'செய்தான்' என்பதன் வேர்ச்சொல் 'செய்' ஆகும்." },
    { q: "12. 'கூறினான்' என்பதன் வேர்ச்சொல் யாது?", o: ["a) கூறு", "b) கூறி", "c) கூர்", "d) கூற்று"], a: 0, exp: "விளக்கம்: 'கூறினான்' என்பதன் வேர்ச்சொல் 'கூறு' ஆகும்." },
    { q: "13. 'அடித்தான்' என்பதன் வேர்ச்சொல் என்ன?", o: ["a) அடி", "b) அடித்து", "c) அடிமை", "d) அடன்"], a: 0, exp: "விளக்கம்: 'அடித்தான்' என்பதன் வேர்ச்சொல் 'அடி' ஆகும்." },
    { q: "14. 'வந்தான்' என்பதன் வேர்ச்சொல் யாது?", o: ["a) வா", "b) வந்து", "c) வரு", "d) வரவு"], a: 0, exp: "விளக்கம்: 'வந்தான்' என்பதன் வேர்ச்சொல் 'வா' ஆகும்." },
    { q: "15. 'தந்தனன்' என்பதன் வேர்ச்சொல் என்ன?", o: ["a) தா", "b) தர்", "c) தந்தி", "d) தந்து"], a: 0, exp: "விளக்கம்: 'தந்தனன்' என்பதன் வேர்ச்சொல் 'தா' ஆகும்." },
    
    // பொருத்துக
    { q: "16. சொற்களையும் அவற்றின் வேர்ச்சொற்களையும் பொருத்துக:\n1. பார்த்தான் — அ. கேள்\n2. கேட்டான் — ஆ. பார்\n3. படித்தான் — இ. நட\n4. நடந்தான் — ஈ. படி", o: ["a) 1-ஆ, 2-அ, 3-ஈ, 4-இ", "b) 1-அ, 2-ஆ, 3-இ, 4-ஈ", "c) 1-இ, 2-ஈ, 3-அ, 4-ஆ", "d) 1-ஈ, 2-இ, 3-ஆ, 4-அ"], a: 0, exp: "விளக்கம்: பார்த்தான் (பார்), கேட்டான் (கேள்), படித்தான் (படி), நடந்தான் (நட)." },
    { q: "17. வினைகளையும் அவற்றுக்கான வேர்ச்சொற்களையும் பொருத்துக:\n1. ஈந்தான் — அ. கொள்\n2. கொண்டான் — ஆ. ஈ\n3. சென்றான் — இ. நில்\n4. நின்றான் — ஈ. செல்", o: ["a) 1-ஆ, 2-அ, 3-ஈ, 4-இ", "b) 1-அ, 2-ஆ, 3-இ, 4-ஈ", "c) 1-இ, 2-ஈ, 3-அ, 4-ஆ", "d) 1-ஈ, 2-இ, 3-ஆ, 4-அ"], a: 0, exp: "விளக்கம்: ஈந்தான் (தா), கொண்டான் (கொள்), சென்றான் (செல்), நின்றான் (நில்)." },
    { q: "18. சொற்களைப் பொருத்துக:\n1. உரைத்தான் — அ. உண்\n2. உண்டான் — ஆ. உரை\n3. இழந்தான் — இ. பார்\n4. பார்த்தான் — ஈ. இழ", o: ["a) 1-ஆ, 2-அ, 3-ஈ, 4-இ", "b) 1-அ, 2-ஆ, 3-இ, 4-ஈ", "c) 1-இ, 2-ஈ, 3-அ, 4-ஆ", "d) 1-ஈ, 2-இ, 3-ஆ, 4-அ"], a: 0, exp: "விளக்கம்: உரைத்தான் (கூறு), உண்டான் (உண்), இழந்தான் (இழ), பார்த்தான் (பார்)." },
    { q: "19. வேர்ச்சொற்களைச் சரியான வினையுடன் பொருத்துக:\n1. செய் — அ. வந்தான்\n2. வா — ஆ. செய்தான்\n3. உண் — இ. கேட்டான்\n4. கேள் — ஈ. உண்டான்", o: ["a) 1-ஆ, 2-அ, 3-ஈ, 4-இ", "b) 1-அ, 2-ஆ, 3-இ, 4-ஈ", "c) 1-இ, 2-ஈ, 3-அ, 4-ஆ", "d) 1-ஈ, 2-இ, 3-ஆ, 4-அ"], a: 0, exp: "விளக்கம்: செய் (செய்தான்), வா (வந்தான்), உண் (உண்டான்), கேள் (கேட்டான்)." },
    { q: "20. பொருத்துக:\n1. அறி — அ. வாழ்ந்தான்\n2. வாழ் — ஆ. அறிந்தான்\n3. பார் — இ. இடித்தான்\n4. இடி — ஈ. பார்த்தான்", o: ["a) 1-ஆ, 2-அ, 3-ஈ, 4-இ", "b) 1-அ, 2-ஆ, 3-இ, 4-ஈ", "c) 1-இ, 2-ஈ, 3-அ, 4-ஆ", "d) 1-ஈ, 2-இ, 3-ஆ, 4-அ"], a: 0, exp: "விளக்கம்: அறி (அறிந்தான்), வாழ் (வாழ்ந்தான்), பார் (பார்த்தான்), இடி (இடித்தான்)." },
    { q: "21. சரியான பொருத்துதலைத் தேர்ந்தெடுக்க:\n1. தா — அ. தந்தான்\n2. செல் — ஆ. சென்றான்\n3. நில் — இ. நின்றான்\n4. கேள் — ஈ. வினவினான்", o: ["a) 1-அ, 2-ஆ, 3-இ, 4-ஈ", "b) 1-ஆ, 2-அ, 3-ஈ, 4-இ", "c) 1-இ, 2-ஈ, 3-அ, 4-ஆ", "d) 1-ஈ, 2-இ, 3-ஆ, 4-அ"], a: 0, exp: "விளக்கம்: கொடுக்கப்பட்ட அனைத்து இணைகளும் நேராகச் சரியாகப் பொருத்தப்பட்டுள்ளன." },
    { q: "22. வினைகளை வேர்ச்சொல்லோடு பொருத்துக:\n1. இழிந்தான் — அ. விழு\n2. வீழ்ந்தான் — ஆ. ஈ\n3. ஈந்தான் — இ. இழி\n4. கண்டான் — ஈ. காண்", o: ["a) 1-இ, 2-அ, 3-ஆ, 4-ஈ", "b) 1-அ, 2-ஆ, 3-இ, 4-ஈ", "c) 1-இ, 2-ஈ, 3-அ, 4-ஆ", "d) 1-ஈ, 2-இ, 3-ஆ, 4-அ"], a: 0, exp: "விளக்கம்: இழிந்தான் (இழி), வீழ்ந்தான் (விழு), ஈந்தான் (ஈ/தா), கண்டான் (காண்)." },
    { q: "23. சொற்களுடன் வேர்ச்சொல்லைப் பொருத்துக:\n1. துய்த்தான் — அ. துய்\n2. பொய்த்தான் — ஆ. பொய்\n3. மெய்த்தான் — இ. மெய்\n4. பெய்தான் — ஈ. பெய்", o: ["a) 1-அ, 2-ஆ, 3-இ, 4-ஈ", "b) 1-ஆ, 2-அ, 3-ஈ, 4-இ", "c) 1-இ, 2-ஈ, 3-அ, 4-ஆ", "d) 1-ஈ, 2-இ, 3-ஆ, 4-அ"], a: 0, exp: "விளக்கம்: துய்த்தான் (துய்), பொய்த்தான் (பொய்), மெய்த்தான் (மெய்), பெய்தான் (பெய்)." },

    // சரியான இணை & தவறான இணை
    { q: "24. கொடுக்கப்பட்ட இணைகளில் சரியான இணையைத் தேர்ந்தெடுக்க:", o: ["a) படித்தான் - படி", "b) ஓடினான் - ஓடுமி", "c) கண்டான் - கண்ட", "d) சென்றான் - சென்று"], a: 0, exp: "விளக்கம்: 'படித்தான்' என்பதன் சரியான வேர்ச்சொல் 'படி' ஆகும்." },
    { q: "25. சரியான வேர்ச்சொல் இணையைத் தேர்ந்தெடுக்க:", o: ["a) வந்தான் - வரு", "b) தந்தான் - தா", "c) கேட்டான் - கேள்விய", "d) செய்தான் - செயல்"], a: 1, exp: "விளக்கம்: தந்தான் என்பதன் வேர்ச்சொல் 'தா' ஆகும்." },
    { q: "26. கீழ்க்கண்டவற்றுள் சரியான இணைக் கண்டறிக:", o: ["a) நின்றான் - நில்", "b) நடந்தான் - நடப்ப", "c) பார்த்தான் - பார்த்த", "d) உண்டான் - உணவு"], a: 0, exp: "விளக்கம்: 'நின்றான்' என்ற சொல்லின் ஏவல் வேர்ச்சொல் 'நில்' என்பது மட்டுமே சரியானது." },
    { q: "27. சரியான இணையைத் தெரிவு செய்க:", o: ["a) உரைத்தான் - உரை", "b) இழந்தான் - இழப்பு", "c) அறிந்தான் - அறிவு", "d) வாழ்ந்தான் - வாழ்வு"], a: 0, exp: "விளக்கம்: 'உரைத்தான்' என்பதன் வேர்ச்சொல் கூறு/உரை ஆகும்." },
    { q: "28. சரியான வேர்ச்சொல் இணைக் கண்டறிக:", o: ["a) பெற்றான் - பெறு", "b) விட்டான் - விடுதி", "c) தொட்டான் - தொடுப்பு", "d) சுட்டான் - சுடுதல்"], a: 0, exp: "விளக்கம்: பெற்றான் என்பதன் வேர்ச்சொல் 'பெறு' ஆகும்." },
    { q: "29. சரியான இணை எது?", o: ["a) அமர்ந்தான் - அமர்", "b) எழுந்தான் - எழுச்சி", "c) கிடந்தான் - கிடப்பு", "d) நடந்தான் - நடப்பு"], a: 0, exp: "விளக்கம்: அமர்ந்தான் என்பதன் வேர்ச்சொல் 'அமர்' ஆகும்." },
    { q: "30. சரியான இணையைத் தேர்ந்தெடுக்க:", o: ["a) கேட்டான் - கேள்", "b) பார்த்தான் - பார்வை", "c) உரைத்தான் - உரைப்பு", "d) படித்தான் - படிப்பு"], a: 0, exp: "விளக்கம்: வினையச் சொல்லுக்கான ஏவல் வேர்ச்சொல் 'கேள்' மட்டுமே சரி." },
    { q: "31. தவறான இணையைத் தேர்ந்தெடுக்க:", o: ["a) நடந்தான் - நட", "b) படித்தான் - படி", "c) வந்தான் - வரு", "d) சென்றான் - செல்"], a: 2, exp: "விளக்கம்: 'வந்தான்' என்பதன் சரியான வேர்ச்சொல் 'வா' ஆகும். 'வரு' என்பது தவறு." },
    { q: "32. கீழ்க்கண்டவற்றுள் தவறான இணைக் கண்டறிக:", o: ["a) தந்தான் - தா", "b) கண்டான் - காண்", "c) தின்றான் - தின்", "d) கேட்டான் - கேளு"], a: 3, exp: "விளக்கம்: 'கேட்டான்' என்பதன் சரியான வேர்ச்சொல் 'கேள்' ஆகும். 'கேளு' என்பது தவறு." },
    { q: "33. தவறான இணையைத் தெரிவு செய்க:", o: ["a) நின்றான் - நில்", "b) சென்றான் - செல்", "c) நின்றான் - நின்ற", "d) செய்தான் - செய்"], a: 2, exp: "விளக்கம்: 'நின்றான்' என்பதன் சரியான வேர்ச்சொல் 'நில்' ஆகும். 'நின்ற' என்பது தவறு." },
    { q: "34. தவறான இணைக் கண்டறிக:", o: ["a) தந்தான் - தர்", "b) உண்டான் - உண்", "c) இழந்தான் - இழ", "d) பெற்றான் - பெறு"], a: 0, exp: "விளக்கம்: 'தந்தான்' என்பதன் சரியான வேர்ச்சொல் 'தா' ஆகும்." },
    { q: "35. தவறான இணையைத் தேர்ந்தெடுக்க:", o: ["a) பார்த்தான் - பார்", "b) கேட்டான் - கேள்", "c) உரைத்தான் - உரை", "d) நின்றான் - நின்றமை"], a: 3, exp: "விளக்கம்: நின்றான் என்பதன் வேர்ச்சொல் 'நில்' ஆகும். 'நின்றமை' என்பது தொழிற்பெயர்." },
    { q: "36. தவறான இணையைத் தெரிவு செய்க:", o: ["a) அமர்ந்தான் - அமர்", "b) கிடந்தான் - கிட", "c) பிறந்தான் - பிற", "d) இறந்தான் - இறப்பு"], a: 3, exp: "விளக்கம்: இறந்தான் என்பதன் சரியான வேர்ச்சொல் 'இற' ஆகும்." },
    { q: "37. தவறான இணைக் கண்டறிக:", o: ["a) கொடுத்தான் - கொடு", "b) எடுத்தான் - எடு", "c) பிடித்தான் - பிடி", "d) வடித்தான் - வடிப்பு"], a: 3, exp: "விளக்கம்: வடித்தான் என்பதன் வேர்ச்சொல் 'வடி' ஆகும்." },

    // கூற்று மற்றும் காரணம்
    { q: "38. கூற்று (A): ஒரு சொல்லின் அடிச்சொல் அல்லது முதல் நிலை 'வேர்ச்சொல்' என அழைக்கப்படுகிறது.\nகாரணம் (R): வேர்ச்சொல் பெரும்பாலும் ஏவல் வினையாகவே அமையும்.", o: ["a) கூற்று (A) மற்றும் காரணம் (R) இரண்டும் சரி; காரணம் கூற்றுக்கான சரியான விளக்கமாகும்.", "b) கூற்று (A) மற்றும் காரணம் (R) இரண்டும் சரி; ஆனால் காரணம் கூற்றுக்கான சரியான விளக்கம் அல்ல.", "c) கூற்று (A) சரி; காரணம் (R) தவறு.", "d) கூற்று (A) தவறு; காரணம் (R) சரி."], a: 0, exp: "விளக்கம்: வேர்ச்சொல் என்பது பகுபதத்தின் அடிச்சொல் ஆகும். இது கட்டளைப் பொருளில் (ஏவல் வினை) வரும்." },
    { q: "39. கூற்று (A): 'வந்தான்' என்ற சொல்லின் வேர்ச்சொல் 'வரு' ஆகும்.\nகாரணம் (R): தமிழ் இலக்கணத்தில் வேர்ச்சொல் விகாரம் பெறாமல் அப்படியே நிற்கும்.", o: ["a) கூற்று மற்றும் காரணம் இரண்டும் சரி.", "b) கூற்று தவறு, காரணம் சரி.", "c) கூற்று மற்றும் காரணம் இரண்டும் தவறு.", "d) கூற்று சரி, காரணம் தவறு."], a: 2, exp: "விளக்கம்: 'வந்தான்' என்பதன் வேர்ச்சொல் 'வா' ஆகும். வேர்ச்சொற்கள் விகாரம் பெறும்." },
    { q: "40. கூற்று (A): ஏவல் வினைச்சொற்களே பெரும்பாலும் வேர்ச்சொற்களாக அமைகின்றன.\nகாரணம் (R): 'படி', 'நட', 'வா', 'செய்' என்பவை ஏவல் வினைகளாகவும் வேர்ச்சொற்களாகவும் உள்ளன.", o: ["a) கூற்று (A) மற்றும் காரணம் (R) இரண்டும் சரி; காரணம் கூற்றுக்கான சரியான விளக்கமாகும்.", "b) கூற்று சரி, காரணம் தவறு.", "c) கூற்று தவறு, காரணம் சரி.", "d) இரண்டும் தவறு."], a: 0, exp: "விளக்கம்: கூற்றும் காரணமும் சரியானவையே." },
    { q: "41. கூற்று (A): வேர்ச்சொற்களைக் கண்டறியும்போது அது பகுபதத்தின் பகாப்பதப் பகுதியாக இருத்தல் வேண்டும்.\nகாரணம் (R): பகுபதத்தின் பகுதி எப்போதுமே ஏவல் சொல்லாகவே நிற்கும்.", o: ["a) கூற்று (A) மற்றும் காரணம் (R) இரண்டும் சரி; காரணம் கூற்றுக்கான சரியான விளக்கமாகும்.", "b) இரண்டும் தவறு.", "c) கூற்று சரி, காரணம் தவறு.", "d) கூற்று தவறு, காரணம் சரி."], a: 0, exp: "விளக்கம்: கூற்று மற்றும் காரணம் இரண்டும் சரி." },
    { q: "42. கூற்று (A): 'தந்தான்' என்ற சொல்லின் வேர்ச்சொல் 'தந்' ஆகும்.\nகாரணம் (R): வேர்ச்சொல் எப்போது குறில் எழுத்தாக மட்டுமே இருக்க வேண்டும்.", o: ["a) கூற்று மற்றும் காரணம் இரண்டும் சரி.", "b) கூற்று மற்றும் காரணம் இரண்டும் தவறு.", "c) கூற்று சரி, காரணம் தவறு.", "d) கூற்று தவறு, காரணம் சரி."], a: 1, exp: "விளக்கம்: 'தந்தான்' என்பதன் வேர்ச்சொல் 'தா' (நெடில்) ஆகும்." },
    { q: "43. கூற்று (A): ஒரு வினைமுற்றுச் சொல்லை வேர்ச்சொல்லாக மாற்ற, அதனை ஏவல் வினையாக மாற்ற வேண்டும்.\nகாரணம் (R): 'படித்தான்' என்ற சொல்லை 'படி' என்று மாற்றினால் மட்டுமே அது வேர்ச்சொல்லாகும்.", o: ["a) கூற்று (A) மற்றும் காரணம் (R) இரண்டும் சரி; காரணம் கூற்றுக்கான சரியான விளக்கமாகும்.", "b) கூற்று சரி, காரணம் தவறு.", "c) கூற்று தவறு, காரணம் சரி.", "d) இரண்டும் தவறு."], a: 0, exp: "விளக்கம்: கூற்று மற்றும் காரணம் இரண்டும் சரி." },
    { q: "44. கூற்று (A): தமிழ் மொழியில் சில வேர்ச்சொற்கள் கூட்டுச் சொற்களாகவும் வருவதுண்டு.\nகாரணம் (R): வேர்ச்சொல் என்பது பகுபதத்தின் பகுதியாகவும், மேலும் பிரிக்க முடியாத தனிச் சொல்லாகவும் இருக்க வேண்டும்.", o: ["a) கூற்று சரி, காரணம் தவறு.", "b) கூற்று தவறு, காரணம் சரி.", "c) கூற்று மற்றும் காரணம் இரண்டும் சரி.", "d) கூற்று மற்றும் காரணம் இரண்டும் தவறு."], a: 1, exp: "விளக்கம்: வேர்ச்சொல் என்பது பிரிக்க முடியாத தனி மூலச்சொல் (பகாப்பதம்) ஆகும்." },

    // சரியான கூற்றைத் தேர்ந்தெடுத்தل
    { q: "45. வேர்ச்சொல் குறித்த கீழ்க்கண்ட கூற்றுகளில் சரியானதைத் தேர்ந்தெடுக்க:\n1. வேர்ச்சொல் என்பது பகுபதத்தின் பகுதியாகும்.\n2. வேர்ச்சொல் எப்போதும் ஏவல் வினையாக அமையும்.\n3. வேர்ச்சொல்லை மேலும் சிறிய பகுதிகளாகப் பிரிக்க இயலாது.", o: ["a) 1 மற்றும் 2 மட்டும் சரி", "b) 2 மற்றும் 3 மட்டும் சரி", "c) 1 மற்றும் 3 மட்டும் சரி", "d) அனைத்தும் சரி"], a: 3, exp: "விளக்கம்: வேர்ச்சொல் பற்றிய மேற்கண்ட மூன்று கூற்றுகளும் இலக்கண விதிப்படி முற்றிலும் சரியானவை." },
    { q: "46. வேர்ச்சொல் பற்றிய சரியான கூற்றைக் கண்டறிக:\n1. 'சென்றான்' என்பதன் வேர்ச்சொல் 'செல்'.\n2. 'வந்தான்' என்பதன் வேர்ச்சொல் 'வரு'.\n3. 'கண்டான்' என்பதன் வேர்ச்சொல் 'காண்'.", o: ["a) 1 மற்றும் 3 மட்டும் சரி", "b) 1 மற்றும் 2 மட்டும் சரி", "c) 2 மற்றும் 3 மட்டும் சரி", "d) அனைத்தும் சரி"], a: 0, exp: "விளக்கம்: 2-வது கூற்று தவறு ('வா' என்பதே சரி)." },
    { q: "47. சரியான கூற்றைத் தெரிவு செய்க:\n1. வேர்ச்சொற்கள் பகாப்பதங்களாகவே அமையும்.\n2. ஏவல் வினைச் சொற்கள் அனைத்தும் வேர்ச்சொற்களே.\n3. பகுபதத்தின் இறுதியில் வேர்ச்சொல் வரும்.", o: ["a) 1 மற்றும் 2 மட்டும் சரி", "b) 2 மற்றும் 3 மட்டும் சரி", "c) 1 மற்றும் 3 மட்டும் சரி", "d) அனைத்தும் சரி"], a: 0, exp: "விளக்கம்: பகுபதத்தின் இறுதியில் விகுதி வரும், பகுதிதான் முதலில் வரும்." },
    { q: "48. வேர்ச்சொல் தொடர்பான கீழ்க்கண்ட கூற்றுகளில் எது சரியானது?\n1. 'படித்தான்' - படி என்பது வேர்ச்சொல்.\n2. வேர்ச்சொற்கள் தமிழ் மொழியின் அடிவேர்கள் எனப்படும்.\n3. வேர்ச்சொல் காலத்தைக் காட்டும்.", o: ["a) 1 மற்றும் 2 மட்டும் சரி", "b) 2 மற்றும் 3 மட்டும் சரி", "c) 1 மற்றும் 3 மட்டும் சரி", "d) அனைத்தும் சரி"], a: 0, exp: "விளக்கம்: வேர்ச்சொல் காலம் காட்டாது." },
    { q: "49. சரியான கூற்றைக் கண்டறிக:\n1. 'கேட்டான்' என்பதன் வேர்ச்சொல் 'கேள்'.\n2. 'செய்தான்' என்பதன் வேர்ச்சொல் 'செய்'.\n3. 'நடந்தான்' என்பதன் வேர்ச்சொல் 'நட'.", o: ["a) 1 மற்றும் 2 மட்டும் சரி", "b) 2 மற்றும் 3 மட்டும் சரி", "c) 1 மற்றும் 3 மட்டும் சரி", "d) அனைத்தும் சரி"], a: 3, exp: "விளக்கம்: கொடுக்கப்பட்டுள்ள மூன்று சொற்களும் அவற்றுக்கான வேர்ச்சொற்களும் சரியானவையே." },
    { q: "50. வேர்ச்சொல் மற்றும் அதன் தன்மைகள் பற்றிய சரியான கூற்றுகள் யாவை?\n1. இது பகுபத உறுப்புகளுள் ஒன்றாகும் (பகுதி).\n2. இது கட்டளைச் சொல்லாக விளங்கும்.\n3. வேர்ச்சொல்லைக் கொண்டுதான் வினைகளை உருவாக்க முடியும்.", o: ["a) 1 மற்றும் 2 மட்டும்", "b) 2 மற்றும் 3 மட்டும்", "c) 1 மற்றும் 3 மட்டும்", "d) அனைத்தும் சரி"], a: 3, exp: "விளக்கம்: கொடுக்கப்பட்ட அனைத்துக் கூற்றுகளும் சரியானவையே." }
  ];

  let currentQuestion = 0;
  let userAnswers = new Array(questionsData.length).fill(null);
  let isReviewMode = false;
  let timerInterval;
  let timeLeft = 45 * 60;

  function initTest() {
    buildGrid();
    loadQuestion(0);
    startTimer();
  }

  function buildGrid() {
    const grid = document.getElementById('questionGrid');
    grid.innerHTML = '';
    questionsData.forEach((_, idx) => {
      const btn = document.createElement('button');
      btn.className = 'q-num-btn';
      btn.innerText = idx + 1;
      btn.id = `q_btn_${idx}`;
      btn.onclick = () => jumpToQuestion(idx);
      grid.appendChild(btn);
    });
    updateGridStatus();
  }

  function updateGridStatus() {
    questionsData.forEach((_, idx) => {
      const btn = document.getElementById(`q_btn_${idx}`);
      if(!btn) return;
      btn.className = 'q-num-btn';
      if(idx === currentQuestion) {
        btn.classList.add('active');
      } else if(userAnswers[idx] !== null) {
        btn.classList.add('answered');
      }
    });
  }

  function loadQuestion(idx) {
    currentQuestion = idx;
    const q = questionsData[idx];
    document.getElementById('qTitle').innerText = q.q;
    
    const optsBox = document.getElementById('optionsBox');
    optsBox.innerHTML = '';

    q.o.forEach((optText, oIdx) => {
      const card = document.createElement('div');
      card.className = 'option-card';
      
      if(userAnswers[idx] === oIdx) {
        card.classList.add('selected');
      }

      if(isReviewMode) {
        if(oIdx === q.a) {
          card.classList.add('correct-ans');
        } else if(userAnswers[idx] === oIdx && oIdx !== q.a) {
          card.classList.add('wrong-ans');
        }
      }

      card.innerHTML = `<span><b>${String.fromCharCode(65 + oIdx)}.</b> ${optText}</span>`;
      card.onclick = () => selectOption(oIdx);
      optsBox.appendChild(card);
    });

    const expBox = document.getElementById('expBox');
    if(isReviewMode) {
      expBox.style.display = 'block';
      expBox.innerText = q.exp;
    } else {
      expBox.style.display = 'none';
    }

    document.getElementById('prevBtn').style.display = idx === 0 ? 'none' : 'block';
    document.getElementById('nextBtn').style.display = idx === questionsData.length - 1 ? 'none' : 'block';
    updateGridStatus();
  }

  function selectOption(oIdx) {
    if(isReviewMode) return;
    userAnswers[currentQuestion] = oIdx;
    loadQuestion(currentQuestion);
  }

  function clearChoice() {
    if(isReviewMode) return;
    userAnswers[currentQuestion] = null;
    loadQuestion(currentQuestion);
  }

  function navigateNumberQuery(dir) {
    const next = currentQuestion + dir;
    if(next >= 0 && next < questionsData.length) {
      loadQuestion(next);
    }
  }

  function jumpToQuestion(idx) {
    loadQuestion(idx);
  }

  function startTimer() {
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      timeLeft--;
      let m = Math.floor(timeLeft / 60);
      let s = timeLeft % 60;
      const timerElem = document.getElementById('timerBox');
      if(timerElem) {
        timerElem.innerText = `⏱️ ${m}:${s < 10 ? '0' : ''}${s}`;
      }
      if(timeLeft <= 0) {
        clearInterval(timerInterval);
        submitTest();
      }
    }, 1000);
  }

  function submitTest() {
    if (timerInterval) clearInterval(timerInterval);
    document.getElementById('testView').style.display = 'none';
    document.getElementById('resultView').style.display = 'block';

    let correct = 0, wrong = 0, unans = 0;
    userAnswers.forEach((ans, idx) => {
      if(ans === null) unans++;
      else if(ans === questionsData[idx].a) correct++;
      else wrong++;
    });

    document.getElementById('scoreDisplay').innerText = `${correct} / ${questionsData.length}`;
    let pct = ((correct / questionsData.length) * 100).toFixed(1);
    document.getElementById('percentageDisplay').innerText = `சதவீதம்: ${pct}%`;
    document.getElementById('correctCnt').innerText = correct;
    document.getElementById('wrongCnt').innerText = wrong;
    document.getElementById('unansCnt').innerText = unans;
  }

  function reviewAnswerKey() {
    isReviewMode = true;
    document.getElementById('resultView').style.display = 'none';
    document.getElementById('testView').style.display = 'block';
    document.getElementById('finalSubmitBtn').style.display = 'none';
    document.getElementById('backToResultBtn').style.display = 'block';
    document.getElementById('dashFromKeyBtn').style.display = 'block';
    loadQuestion(0);
  }

  function returnToResult() {
    document.getElementById('testView').style.display = 'none';
    document.getElementById('resultView').style.display = 'block';
  }

  function returnToDashboard() {
    window.location.replace("https://tigeracadamy.github.io/preperation-hub/index.html"); 
  }

  function exitPortal() {
    window.location.replace("https://tigeracadamy.github.io/preperation-hub/index.html");
  }

  function retakeTest() {
    userAnswers = new Array(questionsData.length).fill(null);
    isReviewMode = false;
    timeLeft = 45 * 60;
    document.getElementById('resultView').style.display = 'none';
    document.getElementById('testView').style.display = 'block';
    document.getElementById('finalSubmitBtn').style.display = 'inline-block';
    document.getElementById('backToResultBtn').style.display = 'none';
    document.getElementById('dashFromKeyBtn').style.display = 'none';
    initTest();
  }

  window.onload = function() {
    initTest();
  }
</script>
