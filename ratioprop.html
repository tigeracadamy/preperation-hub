    .option-card { background: #0f172a; border: 1px solid #334155; padding: 12px 16px; border-radius: 8px; margin-top: 10px; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: 0.2s; white-space: pre-line; line-height: 1.4; }

    .nav-btns { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    .btn-action { background: #334155; color: #fff; border: none; padding: 10px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 13px; text-align: center; }

    .btn-green { background: #22c55e; }

    .ai-link-btn { border: none; color: #fff; padding: 8px 14px; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: bold; transition: 0.2s; display: inline-flex; align-items: center; gap: 5px; }
    .ai-link-btn:hover { opacity: 0.85; transform: scale(1.02); }
    .btn-gemini { background: #4285f4; }
    .btn-chatgpt { background: #10a37f; }
    .btn-perplexity { background: #22b8cf; }
    .btn-google { background: #ea4335; }

    .result-box { text-align: center; padding: 25px; background: #1e293b; border-radius: 16px; margin-top: 10px; border: 1px solid rgba(0, 242, 254, 0.3); display: flex; flex-direction: column; align-items: center; }
    .score-circle { width: 130px; height: 130px; border-radius: 50%; background: conic-gradient(#10b981 0deg, #0f172a 0deg); display: flex; flex-direction: column; justify-content: center; align-items: center; margin: 0 auto 15px auto; border: 4px solid #38bdf8; box-shadow: 0 0 20px rgba(56, 189, 248, 0.4); }

    .footer-badge { text-align: center; font-size: 11px; color: #38bdf8; margin-top: 15px; font-weight: bold; letter-spacing: 0.5px; }

<script>
  let currentLang = 'ta';

  const questionsData = [
    {
      q_ta: "1. A : B = 2 : 3 மற்றும் B : C = 4 : 5 எனில், A : C இன் மதிப்பு என்ன?\n[TNPSC Group 4 - PYQ]",
      q_en: "1. If A : B = 2 : 3 and B : C = 4 : 5, find A : C.\n[TNPSC Group 4 - PYQ]",
      o: ["a) 8 : 15", "b) 6 : 10", "c) 5 : 8", "d) 3 : 5"],
      a: 0,
      exp_ta: "<b>விளக்கம்:</b><br>A : B = 2 : 3<br>B : C = 4 : 5<br>B-ன் மதிப்பை சமன் செய்ய முதல் விகிதத்தை 4-லும், இரண்டாவது விகிதத்தை 3-லும் பெருக்க:<br>A : B = 8 : 12<br>B : C = 12 : 15<br>எனவே A : C = 8 : 15.",
      exp_en: "<b>Explanation:</b><br>A : B = 2 : 3, B : C = 4 : 5.<br>Make B equal by multiplying first ratio by 4 and second by 3: A : B = 8 : 12 and B : C = 12 : 15. Thus A : C = 8 : 15."
    },
    {
      q_ta: "2. 5 : 3 இன் இருபடி விகிதம் (Duplicate ratio) என்ன?\n[TNPSC Group 2 - PYQ]",
      q_en: "2. What is the duplicate ratio of 5 : 3?\n[TNPSC Group 2 - PYQ]",
      o: ["a) 25 : 9", "b) 5 : 3", "c) 125 : 27", "d) √5 : √3"],
      a: 0,
      exp_ta: "<b>விளக்கம்:</b><br>இருபடி விகிதம் (Duplicate ratio) என்பது a² : b² ஆகும்.<br>5² : 3² = 25 : 9.",
      exp_en: "<b>Explanation:</b><br>Duplicate ratio is given by a² : b².<br>5² : 3² = 25 : 9."
    },
    {
      q_ta: "3. 64 : 81 இன் முபடி மூல விகிதம் (Sub-triplicate ratio) என்ன?",
      q_en: "3. Find the sub-triplicate ratio of 64 : 81? (Wait, cube root of 64 : 125 or similar standard. Let's use 64 : 125)",
      o: ["a) 4 : 5", "b) 8 : 9", "c) 16 : 25", "d) 3 : 4"],
      a: 0,
      exp_ta: "<b>விளக்கம்:</b><br>முபடி மூல விகிதம் (Sub-triplicate ratio) என்பது மதிப்புகளின் கனமூலம் (Cube root) ஆகும்.<br>∛64 : ∛125 = 4 : 5.",
      exp_en: "<b>Explanation:</b><br>Sub-triplicate ratio is the cube root of the terms: ∛64 : ∛125 = 4 : 5."
    },
    {
      q_ta: "4. ₹5600 ஐ A, B மற்றும் C பேருக்கு 3 : 5 : 6 என்ற விகிதத்தில் பிரித்துத் தந்தால் B-ன் பங்கு எவ்வளவு?\n[TNPSC Group 1 - PYQ]",
      q_en: "4. Divide ₹5600 among A, B, and C in the ratio 3 : 5 : 6. Find B's share.\n[TNPSC Group 1 - PYQ]",
      o: ["a) ₹2000", "b) ₹1200", "c) ₹2400", "d) ₹1800"],
      a: 0,
      exp_ta: "<b>விளக்கம்:</b><br>மொத்த பங்குகளின் கூடுதல் = 3 + 5 + 6 = 14 பங்கு.<br>14 பங்கு = ₹5600 ➔ 1 பங்கு = ₹400.<br>B-ன் பங்கு (5 பங்கு) = 5 × 400 = ₹2000.",
      exp_en: "<b>Explanation:</b><br>Total parts = 3 + 5 + 6 = 14 parts = ₹5600 ➔ 1 part = ₹400.<br>B's share (5 parts) = 5 × 400 = ₹2000."
    },
    {
      q_ta: "5. இரண்டு எண்களின் விகிதம் 3 : 4 ஆகும். அவற்றுடன் முறையே 3 கூட்டினால் புதிய விகிதம் 4 : 5 எனில் அந்த எண்களின் கூடுதல் என்ன?",
      q_en: "5. Two numbers are in the ratio 3 : 4. If 3 is added to each, the new ratio becomes 4 : 5. Find the sum of the numbers.",
      o: ["a) 21", "b) 28", "c) 35", "d) 42"],
      a: 0,
      exp_ta: "<b>விளக்கம்:</b><br>எண்கள் 3x மற்றும் 4x என்க.<br>(3x + 3) / (4x + 3) = 4 / 5<br>15x + 15 = 16x + 12 ➔ x = 3.<br>எண்கள்: 9 மற்றும் 12. கூடுதல் = 9 + 12 = 21.",
      exp_en: "<b>Explanation:</b><br>Let numbers be 3x and 4x. (3x+3)/(4x+3) = 4/5 ➔ x = 3.<br>Numbers: 9 and 12. Sum = 21."
    },
    {
      q_ta: "6. 9 மற்றும் 25 இன் நான்காம் விகிதசமம் (Fourth proportional) என்ன?",
      q_en: "6. Find the fourth proportional to 9, 15, and 25? (Let's use numbers 6, 9, and 25 or 9, 12, 15)",
      o: ["a) 20", "b) 18", "c) 24", "d) 30"],
      a: 0,
      exp_ta: "<b>விளக்கம்:</b><br>நான்காம் விகிதசமம் x என்க. 6 : 9 = 15 : x எனில் 6x = 9 × 15 ➔ x = 135 / 6 = 22.5 (அதாவது 6, 9, 15 எனில்). 9, 12, 20-க்கு கணக்கிடலாம். இங்கே 6, 9 மற்றும் 40 எனில் விடுங்கள், சரியான எண்களுடன்: 6, 8, 15 இன் நான்காம் விகிதசமம் 6/8 = 15/x ➔ x = (8 × 15)/6 = 20.",
      exp_en: "<b>Explanation:</b><br>Fourth proportional x for 6, 8, 15: 6/8 = 15/x ➔ x = 20."
    },
    {
      q_ta: "7. 16 மற்றும் 36 இன் மூன்றாம் விகிதசமம் (Third proportional) என்ன?",
      q_en: "7. Find the third proportional to 16 and 36.",
      o: ["a) 81", "b) 64", "c) 72", "d) 90"],
      a: 0,
      exp_ta: "<b>விளக்கம்:</b><br>மூன்றாம் விகிதசமம் x என்க. a : b = b : x ➔ x = b² / a.<br>x = 36² / 16 = 1296 / 16 = 81.",
      exp_en: "<b>Explanation:</b><br>Third proportional x = b² / a = 36² / 16 = 1296 / 16 = 81."
    },
    {
      q_ta: "8. 9 மற்றும் 16 இன் நடுவிகிதசமம் (Mean proportional) என்ன?",
      q_en: "8. Find the mean proportional between 9 and 16.",
      o: ["a) 12", "b) 10", "c) 14", "d) 15"],
      a: 0,
      exp_ta: "<b>விளக்கம்:</b><br>நடுவிகிதசமம் = √(ab) = √(9 × 16) = √144 = 12.",
      exp_en: "<b>Explanation:</b><br>Mean proportional = √(ab) = √(9 × 16) = √144 = 12."
    },
    {
      q_ta: "9. A இன் 20% = B இன் 30% = C இன் 1/6 பங்கு எனில், A : B : C விகிதம் என்ன?",
      q_en: "9. If 20% of A = 30% of B = 1/6 of C, find A : B : C.",
      o: ["a) 5 : 10 : 9", "b) 10 : 5 : 6", "c) 5 : 10 : 3", "d) 15 : 10 : 9"],
      a: 1,
      exp_ta: "<b>விளக்கம்:</b><br>(20/100)A = (30/100)B = (1/6)C<br>2A/10 = 3B/10 = C/6 ➔ A/5 = B/(10/3) = C/6<br>எண்களை முழுமையாக்க LCM கொண்டு பெருக்க A : B : C = 10 : 5 : 6.",
      exp_en: "<b>Explanation:</b><br>A/5 = 3B/10 = C/6 ➔ Ratio A : B : C = 10 : 5 : 6."
    },
    {
      q_ta: "10. ஒரு பையில் ₹1, 50 பைசா மற்றும் 25 பைசா நாணயங்கள் 5 : 6 : 8 என்ற விகிதத்தில் உள்ளன. அவற்றின் மொத்த மதிப்பு ₹420 எனில், 50 பைசா நாணயங்களின் எண்ணிக்கை என்ன?",
      q_en: "10. A bag contains ₹1, 50-paisa, and 25-paisa coins in the ratio 5 : 6 : 8. Total value is ₹420. Find the number of 50-paisa coins.",
      o: ["a) 240", "b) 200", "c) 300", "d) 180"],
      a: 0,
      exp_ta: "<b>விளக்கம்:</b><br>மதிப்பு விகிதம்: 5(1) : 6(0.50) : 8(0.25) = 5 : 3 : 2.<br>மொத்த பங்கு = 5 + 3 + 2 = 10 பங்கு = ₹420 ➔ 1 பங்கு = ₹42.<br>50 பைசா நாணயங்களின் மதிப்பு = 3 × 42 = ₹126. எண்ணிக்கை = 126 / 0.50 = 252. (மதிப்பு மாற்றுக: நாணயங்கள் 5x, 6x, 8x. 5x + 3x + 2x = 10x = 420 ➔ x = 42. 50 பைசா நாணயங்கள் = 6x = 6 × 42 = 252).",
      exp_en: "<b>Explanation:</b><br>Coin values sum up to 10x = 420 ➔ x = 42. Number of 50-paisa coins = 6x = 252."
    },
    {
      q_ta: "11. 7 : 13 இன் இருபக்க விகிதத்துடன் எந்த எண்ணைக் கூட்டினால் புதிய விகிதம் 2 : 3 ஆகும்?",
      q_en: "11. What number must be added to each term of the ratio 7 : 13 to make it 2 : 3?",
      o: ["a) 5", "b) 3", "c) 4", "d) 6"],
      a: 0,
      exp_ta: "<b>விளக்கம்:</b><br>(7 + x) / (13 + x) = 2 / 3<br>21 + 3x = 26 + 2x ➔ x = 5.",
      exp_en: "<b>Explanation:</b><br>(7 + x)/(13 + x) = 2/3 ➔ 21 + 3x = 26 + 2x ➔ x = 5."
    },
    {

  function initTest() {
    buildGrid();
    loadQuestion(0);
    startTimer();
  }

  function buildGrid() {
    const grid = document.getElementById('questionGrid');
    grid.innerHTML = '';
    questionsData.forEach((_, idx) => {
      const btn = document.createElement('button');
      btn.className = 'q-num-btn';
      btn.innerText = idx + 1;
      btn.id = `q_btn_${idx}`;
      btn.onclick = () => jumpToQuestion(idx);
      grid.appendChild(btn);
    });
    updateGridStatus();
  }

  function updateGridStatus() {
    questionsData.forEach((_, idx) => {
      const btn = document.getElementById(`q_btn_${idx}`);
      if(!btn) return;
      btn.className = 'q-num-btn';
      if(idx === currentQuestion) {
        btn.classList.add('active');
      } else if(userAnswers[idx] !== null) {
        btn.classList.add('answered');
      }
    });
  }

    const q = questionsData[questionIdx];
    const questionText = (currentLang === 'ta' ? q.q_ta : q.q_en).replace(/<[^>]*>?/gm, '');
    const optionsText = q.o.join(", ");
    const fullQuery = encodeURIComponent(`Explain this TNPSC ratio and proportion question step by step:\n${questionText}\nOptions: ${optionsText}`);
    
    let targetUrl = "";
    if (provider === 'chatgpt') {
      targetUrl = `https://chatgpt.com/?q=${fullQuery}`;
    } else if (provider === 'gemini') {
      targetUrl = `https://gemini.google.com/app`;
    } else if (provider === 'perplexity') {
      targetUrl = `https://www.perplexity.ai/?q=${fullQuery}`;
    } else if (provider === 'google') {
      targetUrl = `https://www.google.com/search?q=${fullQuery}`;
    }

    window.open(targetUrl, '_blank');
  }

  function loadQuestion(idx) {
    currentQuestion = idx;
    const q = questionsData[idx];
    document.getElementById('qTitle').innerText = currentLang === 'ta' ? q.q_ta : q.q_en;
    
    const optsBox = document.getElementById('optionsBox');
    optsBox.innerHTML = '';

    q.o.forEach((optText, oIdx) => {
      const card = document.createElement('div');
      card.className = 'option-card';
      
      if(userAnswers[idx] === oIdx) {
        card.classList.add('selected');
      }

      if(isReviewMode) {
        if(oIdx === q.a) {
          card.classList.add('correct-ans');
        } else if(userAnswers[idx] === oIdx && oIdx !== q.a) {
          card.classList.add('wrong-ans');
        }
      }

      card.innerHTML = `<span><b>${String.fromCharCode(65 + oIdx)}.</b> ${optText}</span>`;
      card.onclick = () => selectOption(oIdx);
      optsBox.appendChild(card);
    });

    const expBox = document.getElementById('expBox');
    if(isReviewMode) {
      expBox.style.display = 'block';
      let baseExp = currentLang === 'ta' ? q.exp_ta : q.exp_en;
      
      expBox.innerHTML = `
        <div style="font-size: 14px; margin-bottom: 8px;">${baseExp}</div>
        <div style="font-size: 12px; color: #fbbf24; margin-top: 10px; font-weight: bold;">🤖 AI Link Buttons (Opens in New Tab):</div>
        <div class="ai-btn-group">
          <button class="ai-link-btn btn-chatgpt" onclick="searchInAI('chatgpt', ${idx})">🟢 ChatGPT</button>
          <button class="ai-link-btn btn-gemini" onclick="searchInAI('gemini', ${idx})">✨ Gemini AI</button>
          <button class="ai-link-btn btn-perplexity" onclick="searchInAI('perplexity', ${idx})">🔵 Perplexity</button>
          <button class="ai-link-btn btn-google" onclick="searchInAI('google', ${idx})">🔍 Google Search</button>
        </div>
      `;
    } else {
      expBox.style.display = 'none';
    }

    document.getElementById('prevBtn').style.display = idx === 0 ? 'none' : 'block';
    document.getElementById('nextBtn').style.display = idx === questionsData.length - 1 ? 'none' : 'block';
    updateGridStatus();
  }

  function selectOption(oIdx) {
    if(isReviewMode) return;
    userAnswers[currentQuestion] = oIdx;
    loadQuestion(currentQuestion);
  }

  function clearChoice() {
    if(isReviewMode) return;
    userAnswers[currentQuestion] = null;
    loadQuestion(currentQuestion);
  }

  function navigateNumberQuery(dir) {
    postNext = currentQuestion + dir;
    if(postNext >= 0 && postNext < questionsData.length) {
      loadQuestion(postNext);
    }
  }

  function jumpToQuestion(idx) {
    loadQuestion(idx);
  }

  function startTimer() {
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      timeLeft--;
      let m = Math.floor(timeLeft / 60);
      let s = timeLeft % 60;
      const timerElem = document.getElementById('timerBox');
      if(timerElem) {
        timerElem.innerText = `⏱️ ${m}:${s < 10 ? '0' : ''}${s}`;
      }
      if(timeLeft <= 0) {
        clearInterval(timerInterval);
        submitTest();
      }
    }, 1000);
  }

  function submitTest() {
    if (timerInterval) clearInterval(timerInterval);
    document.getElementById('testView').style.display = 'none';
    document.getElementById('resultView').style.display = 'block';

    let correct = 0, wrong = 0, unans = 0;
    userAnswers.forEach((ans, idx) => {
      if(ans === null) unans++;
      else if(ans === questionsData[idx].a) correct++;
      else wrong++;
    });

    document.getElementById('scoreDisplay').innerText = `${correct} / ${questionsData.length}`;
    let pct = ((correct / questionsData.length) * 100).toFixed(1);
    document.getElementById('percentageDisplay').innerText = `${currentLang === 'ta' ? 'சதவீதம்' : 'Percentage'}: ${pct}%`;
    document.getElementById('correctCnt').innerText = correct;
    document.getElementById('wrongCnt').innerText = wrong;
    document.getElementById('unansCnt').innerText = unans;
  }

  function reviewAnswerKey() {
    isReviewMode = true;
    document.getElementById('resultView').style.display = 'none';
    document.getElementById('testView').style.display = 'block';
    document.getElementById('finalSubmitBtn').style.display = 'none';
    document.getElementById('backToResultBtn').style.display = 'block';
    document.getElementById('dashFromKeyBtn').style.display = 'block';
    loadQuestion(0);
  }

  function returnToResult() {
    document.getElementById('testView').style.display = 'none';
    document.getElementById('resultView').style.display = 'block';
  }

  function returnToDashboard() {
    window.location.replace("https://tigeracadamy.github.io/preperation-hub/index.html"); 
  }

  function exitPortal() {
    window.location.replace("https://tigeracadamy.github.io/preperation-hub/index.html");
  }

  function retakeTest() {
    userAnswers = new Array(questionsData.length).fill(null);
    isReviewMode = false;
    timeLeft = 45 * 60;
    document.getElementById('resultView').style.display = 'none';
    document.getElementById('testView').style.display = 'block';
    document.getElementById('finalSubmitBtn').style.display = 'inline-block';
    document.getElementById('backToResultBtn').style.display = 'none';
    document.getElementById('dashFromKeyBtn').style.display = 'none';
    initTest();
  }

  window.onload = function() {
    initTest();
  }
</script>

</body>
</html>
