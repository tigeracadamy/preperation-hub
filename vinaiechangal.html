<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tiger Warriors - வினைமுற்று, எச்சங்கள், தொழிற்பெயர் 50 வினாக்கள்</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; font-weight: bold; }
    body { background: #080604; color: #f8fafc; padding: 12px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { width: 100%; max-width: 950px; background: #0f172a; border-radius: 14px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); border: 1px solid #334155; }
    
    .test-header { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; border: 1px solid #334155; }
    .timer { font-size: 15px; font-weight: bold; color: #fbbf24; background: #091326; padding: 6px 12px; border-radius: 6px; border: 1px solid #fbbf24; box-shadow: inset 0 0 5px rgba(251, 191, 36, 0.2); }
    
    .q-grid { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 16px; max-height: 140px; overflow-y: auto; padding: 8px; background: #1e293b; border-radius: 8px; justify-content: center; }
    .q-num-btn { width: 30px; height: 30px; border-radius: 5px; border: none; background: #334155; color: #fff; font-size: 10px; cursor: pointer; font-weight: bold; }
    .q-num-btn.active { border: 2px solid #38bdf8; background: #0284c7; }
    .q-num-btn.answered { background: #10b981; }

    .q-box { background: #1e293b; padding: 18px; border-radius: 10px; margin-bottom: 16px; border: 1px solid #334155; }
    .q-text { white-space: pre-line; line-height: 1.6; font-size: 15px; color: #f8fafc; }
    
    .option-card { background: #0f172a; border: 1px solid #334155; padding: 12px 16px; border-radius: 8px; margin-top: 10px; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: 0.2s; white-space: pre-line; line-height: 1.4; }
    .option-card:hover { border-color: #38bdf8; background: #1e293b; }
    .option-card.selected { border-color: #10b981; background: #064e3b; }
    .option-card.correct-ans { border-color: #10b981; background: #065f46; font-weight: bold; }
    .option-card.wrong-ans { border-color: #ef4444; background: #7f1d1d; }

    .explanation-box { background: #091326; border: 1px solid #38bdf8; border-radius: 8px; padding: 12px; margin-top: 14px; font-size: 13px; color: #7dd3fc; line-height: 1.5; }
    
    .nav-btns { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    .btn-action { background: #334155; color: #fff; border: none; padding: 10px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 13px; text-align: center; }
    .btn-action:hover { opacity: 0.9; }
    .btn-blue { background: #2563eb; }
    .btn-purple { background: #7c3aed; }
    .btn-danger { background: #ef4444; }
    .btn-green { background: #22c55e; }

    .result-box { text-align: center; padding: 25px; background: #1e293b; border-radius: 16px; margin-top: 10px; border: 1px solid rgba(0, 242, 254, 0.3); display: flex; flex-direction: column; align-items: center; }
    .score-circle { width: 130px; height: 130px; border-radius: 50%; background: conic-gradient(#10b981 0deg, #0f172a 0deg); display: flex; flex-direction: column; justify-content: center; align-items: center; margin: 0 auto 15px auto; border: 4px solid #38bdf8; box-shadow: 0 0 20px rgba(56, 189, 248, 0.4); }
    .score-num { font-size: 30px; color: #f8fafc; font-weight: bold; }
    
    .result-stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; width: 100%; max-width: 400px; }
    .stat-pill { background: #0f172a; border-radius: 12px; padding: 10px; border: 1px solid #334155; text-align: center; }
    .stat-pill.gold { border-color: #fbbf24; }
    .stat-pill.blue { border-color: #38bdf8; }
    .stat-pill.red { border-color: #ef4444; }

    .footer-badge { text-align: center; font-size: 11px; color: #38bdf8; margin-top: 15px; font-weight: bold; letter-spacing: 0.5px; }
  </style>
</head>
<body>

<div class="card">
  <script>
      if (localStorage.getItem('tiger_auth_passed') !== 'true') {
          alert("⚠ பாதுகாப்பு எச்சரிக்கை: நீங்கள் Tiger Warriors போர்ட்டலில் லாகின் செய்யவில்லை! முதலில் மெயின் போர்ட்டலில் லாகின் செய்யவும்.");
          window.location.replace("https://tigeracadamy.github.io/preperation-hub/index.html"); 
      }
  </script>

  <div id="testView">
    <div class="test-header">
      <div>
        <h3 style="color: #38bdf8; font-size: 15px;">🐅 TIGER WARRIORS - வினைமுற்று, எச்சங்கள், தொழிற்பெயர் (50 வினாக்கள்)</h3>
        <span style="font-size: 11px; color: #94a3b8;">TNPSC / 2 / 2A / 4 • TAMIL GRAMMAR</span>
      </div>
      <div style="display: flex; gap: 8px; align-items: center;">
        <div class="timer" id="timerBox">⏱️ 45:00</div>
        <button class="btn-action btn-purple" id="backToResultBtn" onclick="returnToResult()" style="display: none; padding: 6px 12px; font-size: 12px;">📊 ரிசல்ட் செல்</button>
        <button class="btn-action btn-danger" id="dashFromKeyBtn" onclick="returnToDashboard()" style="display: none; padding: 6px 12px; font-size: 12px;">🏠 முகப்பு</button>
      </div>
    </div>

    <div class="q-grid" id="questionGrid"></div>

    <div class="q-box">
      <div id="qTitle" class="q-text"></div>
      <div id="optionsBox"></div>
      <div id="expBox" class="explanation-box" style="display: none;"></div>
    </div>

    <div class="nav-btns">
      <button class="btn-action" id="prevBtn" onclick="navigateNumberQuery(-1)">⬅️ முந்தையது</button>
      <button class="btn-action" id="clearBtn" onclick="clearChoice()">🧹 விடையை நீக்கு</button>
      <button class="btn-action btn-blue" id="nextBtn" onclick="navigateNumberQuery(1)">அடுத்து ➡️</button>
      <button class="btn-action btn-danger" id="finalSubmitBtn" onclick="submitTest()">✅ தேர்வைச் சமர்ப்பிக்க (Submit)</button>
    </div>
  </div>

  <div id="resultView" style="display: none;">
    <h2 style="color: #38bdf8; text-align: center; margin-bottom: 10px;">🏆 தேர்வு முடிவுகள் (Test Results) 🎯</h2>
    <div class="result-box">
      <div class="score-circle" id="scoreCircle">
        <div class="score-num" id="scoreDisplay">0/50</div>
        <span id="percentageDisplay" style="font-size: 11px; color: #fbbf24;">0%</span>
      </div>

      <div class="result-stats-grid">
        <div class="stat-pill gold">
          <h3 id="correctCnt" style="color: #10b981; font-size: 18px;">0</h3>
          <span style="font-size: 11px; color: #cbd5e1;">சரியானவை ✅</span>
        </div>
        <div class="stat-pill red">
          <h3 id="wrongCnt" style="color: #ef4444; font-size: 18px;">0</h3>
          <span style="font-size: 11px; color: #cbd5e1;">தவறானவை ❌</span>
        </div>
        <div class="stat-pill blue">
          <h3 id="unansCnt" style="color: #f59e0b; font-size: 18px;">0</h3>
          <span style="font-size: 11px; color: #cbd5e1;">விடையில்லை ⚠️</span>
        </div>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px;">
      <button class="btn-action btn-blue" onclick="reviewAnswerKey()">🔍 விடை குறிப்பு (Answer Key)</button>
      <button class="btn-action btn-purple" onclick="returnToDashboard()">🏠 முகப்புப் பக்கம்</button>
      <button class="btn-action btn-green" onclick="retakeTest()">🔄 மீண்டும் தேர்வு</button>
      <button class="btn-action btn-danger" onclick="exitPortal()">🚪 வெளியேறு</button>
    </div>
    <div class="footer-badge" style="margin-top: 20px;">🐅 டைகர் வாரியர் போர்டல் - இயக்குநர்: Dr. K. மணிகாசி 🐅</div>
  </div>
</div>

<script>
  const questionsData = [
    // 1. நேரடி ஒற்றைக் கேள்விகள் (Direct Single Fact Questions) [1 - 5]
    { q: "1. பொருள் முற்றுப்பெற்று, திணை, பால், எண், இடம் ஆகியவற்றை வெளிப்படுத்தும் சொல் எது?", o: ["a) பெயரெச்சம்", "b) வினைமுற்று", "c) வினையெச்சம்", "d) தொழிற்பெயர்"], b: 1, exp: "விளக்கம்: பொருள் முற்றுப்பெற்று, திணை, பால், எண், இடம் காட்டும் சொல் 'வினைமுற்று' எனப்படும்." },
    { q: "2. 'நடந்த' என்னும் சொல் எவ்வகை இலக்கணத்தைக் குறிக்கும்?", o: ["a) தெரிநிலை வினைமுற்று", "b) பெயரெச்சம்", "c) வினையெச்சம்", "d) தொழிற்பெயர்"], b: 1, exp: "விளக்கம்: 'நடந்த' என்னும் சொல் எச்சப் பொருள்பட்டு, ஒரு பெயரைக்கொண்டு முடிவதால் பெயரெச்சம் ஆகும்." },
    { q: "3. காலம் காட்டும் எச்சப் சொல் வினையைக்கொண்டு முடிந்தால் அது எவ்வாறு அழைக்கப்படும்?", o: ["a) பெயரெச்சம்", "b) வினையெச்சம்", "c) வினைமுற்று", "d) தொழிற்பெயர்"], b: 1, exp: "விளக்கம்: காலங்காட்டி வினையைக் கொண்டு முடியும் எச்சம் வினையெச்சம் ஆகும்." },
    { q: "4. வினைமுற்றுப் பெயக்கொண்டு முடிவது எைக் குறிக்கும்?", o: ["a) வினையாலணையும் பெயர்", "b) தொழிற்பெயர்", "c) பெயரெச்சம்", "d) வினையெச்சம்"], a: 0, exp: "விளக்கம்: ஒரு வினைமுற்று பெயர்கொண்டு முடிவது வினையாலணையும் பெயர் எனப்படும்." },
    { q: "5. 'நடத்தல்' என்னும் சொல் எவ்வகை பெயர் ஆகும்?", o: ["a) வினையாலணையும் பெயர்", "b) தொழிற்பெயர்", "c) பெயரெச்சம்", "d) வினையெச்சம்"], b: 1, exp: "விளக்கம்: தொழிலை மட்டும் உணர்த்தி, காலம் காட்டாமல் வருவது தொழிற்பெயர் ஆகும்." },

    // 2. சரியான இணை / தவறான இணை கண்டறிதல் [6 - 10]
    { q: "6. கீழ்க்கண்டவற்றுள் சரியான இணையைத் தேர்ந்தெடுக்க:\n- வந்த பையன் : பெயரெச்சம்\n- வந்து நின்றான் : வினையெச்சம்\n- படித்தல் : தொழிற்பெயர்\n- எழுதியவன் : வினைமுற்று", o: ["a) அனைத்தும் சரி", "b) 1 மற்றும் 2 மட்டும் சரி", "c) 3 மற்றும் 4 மட்டும் சரி", "d) அனைத்தும் தவறு"], a: 0, exp: "விளக்கம்: கொடுக்கப்பட்ட அனைத்து இணைகளும் இலக்கண முறைப்படி சரியானவையே." },
    { q: "7. தவறான இணைக் கண்டறிக:\n- படித்தான் - தெறிநிலை வினைமுற்று\n- பாடினாள் - குறிப்பு வினைமுற்று\n- ஓடிய குதிரை - பெயரெச்சம்\n- மெல்ல நடந்தான் - வினையெச்சம்", o: ["b) பாடினாள் - குறிப்பு வினைமுற்று", "c) ஓடிய குதிரை - பெயரெச்சம்", "d) மெல்ல நடந்தான் - வினையெச்சம்", "a) படித்தான் - தெறிநிலை வினைமுற்று"], b: 1, exp: "விளக்கம்: 'பாடினாள்' என்பது தெறிநிலை வினைமுற்று ஆகும் (குறிப்பு வினைமுற்று அல்ல)." },
    { q: "8. சரியான இணையைத் தெரிவு செய்க:", o: ["a) உண்பது - தொழிற்பெயர்", "b) உண்டவர் - வினையாலணையும் பெயர்", "c) வந்த - பெயரெச்சம்", "d) மேற்கண்ட அனைத்தும் சரி"], d: 3, exp: "விளக்கம்: மேற்கண்ட அனைத்து இலக்கண இணைகளும் சரியாகப் பொருத்தப்பட்டுள்ளன." },
    { q: "9. தவறான இணை எது?", o: ["a) நட - நடத்தல் (தொழிற்பெயர்)", "b) பார் - பார்த்த (பெயரெச்சம்)", "c) சிரித்து - வினையெச்சம்", "d) வந்தான் - பெயரெச்சம்"], d: 3, exp: "விளக்கம்: 'வந்தான்' என்பது வினைமுற்று ஆகும், பெயரெச்சம் அல்ல." },
    { q: "10. சரியான குறில்/இலக்கண இணைக் கண்டறிக:", o: ["a) மா长 - தொழிற்பெயர்", "b) சென்ற - பெயரெச்சம்", "c) நடந்து - வினைமுற்று", "d) சென்றவர் - வினையெச்சம்"], b: 1, exp: "விளக்கம்: 'சென்ற' என்பது பெயரெச்சம் ஆகும்." },

    // 3. பொருத்துக (Match the Following) [11 - 15]
    { q: "11. சொற்களை அவற்றின் இலக்கணக் குறிப்புடன் பொருத்துக:\n1. படித்த — அ. வினையெச்சம்\n2. படித்து — ஆ. வினைமுற்று\n3. படித்தான் — இ. பெயரெச்சம்\n4. படித்தல் — ஈ. தொழிற்பெயர்", o: ["a) 1-இ, 2-அ, 3-ஆ, 4-ஈ", "b) 1-அ, 2-இ, 3-ஈ, 4-ஆ", "c) 1-ஈ, 2-அ, 3-இ, 4-ஆ", "d) 1-இ, 2-ஆ, 3-அ, 4-ஈ"], a: 0, exp: "விளக்கம்: படித்த(பெயரெச்சம்), படித்து(வினையெச்சம்), படித்தான்(வினைமுற்று), படித்தல்(தொழிற்பெயர்)." },
    { q: "12. பொருத்துக:\n1. வந்தவர் — அ. தொழிற்பெயர்\n2. வருகை — ஆ. வினையாலணையும் பெயர்\n3. ஓடிய — இ. பெயரெச்சம்\n4. மெல்லப் பேசினான் — ஈ. வினையெச்சம்", o: ["a) 1-ஆ, 2-அ, 3-இ, 4-ஈ", "b) 1-அ, 2-ஆ, 3-ஈ, 4-இ", "c) 1-இ, 2-ஈ, 3-அ, 4-ஆ", "d) 1-ஈ, 2-இ, 3-ஆ, 4-அ"], a: 0, exp: "விளக்கம்: வந்தவர்(வினியாலணையும் பெயர்), வருகை(தொழிற்பெயர்), ஓடிய(பெயரெச்சம்), மெல்லப் பேசினான்(வினையெச்சம்)." },
    { q: "13. பொருத்துக:\n1. தெறிநிலை வினைமுற்று — அ. பொன்னன்\n2. குறிப்பு வினைமுற்று — ஆ. சென்றான்\n3. ஏவல் வினைமுற்று — இ. செய்க\n4. வியங்கோள் வினைமுற்று — ஈ. உண்", o: ["a) 1-ஆ, 2-அ, 3-ஈ, 4-இ", "b) 1-அ, 2-ஆ, 3-இ, 4-ஈ", "c) 1-இ, 2-ஈ, 3-அ, 4-ஆ", "d) 1-ஈ, 2-இ, 3-ஆ, 4-அ"], a: 0, exp: "விளக்கம்: சென்றான்(தெறிநிலை), பொன்னன்(குறிப்பு), உண்(ஏவல்), செய்க(வியங்கோள்)." },
    { q: "14. பொருத்துக:\n1. செய்புரி தொழிற்பெயர் — அ. உரை\n2. முதனிலை தொழிற்பெயர் — ஆ. தடுத்தல்\n3. முதனிலை திரிந்த தொழிற்பெயர் — இ. சுடு\n4. விகுதிபெற்ற தொழிற்பெயர் — ஈ. சூடு", o: ["a) 1-ஆ, 2-இ, 3-ஈ, 4-அ", "b) 1-அ, 2-ஆ, 3-இ, 4-ஈ", "c) 1-இ, 2-ஈ, 3-அ, 4-ஆ", "d) 1-ஈ, 2-இ, 3-ஆ, 4-அ"], a: 0, exp: "விளக்கம்: விகுதிபெற்றது(தடுத்தல்), முதனிலை(சுடு), திரிந்தது(சூடு), செய்புரி/தொழிற்பெயர்(உரை)." },
    { q: "15. பொருத்துக:\n1. தெரிநிலை பெயரெச்சம் — அ. நல்ல பையன்\n2. குறிப்பு பெயரெச்சம் — ஆ. எழுதிய கடிதம்\n3. தெறிநிலை வினையெச்சம் — இ. வந்து நின்றான்\n4. குறிப்பு வினையெச்சம் — ஈ. மெல்ல நடந்தான்", o: ["a) 1-ஆ, 2-அ, 3-இ, 4-ஈ", "b) 1-அ, 2-ஆ, 3-ஈ, 4-இ", "c) 1-இ, 2-ஈ, 3-அ, 4-ஆ", "d) 1-ஈ, 2-இ, 3-ஆ, 4-அ"], a: 0, exp: "விளக்கம்: எழுதிய கடிதம்(தெறிநிலை பெயரெச்சம்), நல்ல பையன்(குறிப்பு பெயரெச்சம்), வந்து நின்றான்(தெறிநிலை வினையெச்சம்), மெல்ல நடந்தான்(குறிப்பு வினையெச்சம்)." },

    // 4. பல கூற்று அடிப்படையிலான கேள்விகள் (4 Statements Model) [16 - 22]
    { q: "16. வினைமுற்று குறித்த கீழ்க்கண்ட கூற்றுகளை ஆராய்க:\nI. வினைமுற்று ஆறு இடங்களிலும் வரும்.\nII. இது ஐம்பால்களையும் காட்டும்.\nIII. வினைமுற்று எச்சச் சொல்லாக நின்று பெயரைத் தழுவும்.\nIV. இது காலங்காட்டும்.\nஎவை சரியானவை?", o: ["a) I, II மற்றும் IV சரி", "b) I, II மற்றும் III சரி", "c) II, III மற்றும் IV சரி", "d) அனைத்தும் சரி"], a: 0, exp: "விளக்கம்: வினைமுற்று எச்சமாக வராது, முற்றுப் பெற்ற சொலாகும். எனவே III தவறு. I, II, IV சரி." },
    { q: "17. பெயரெச்சம் பற்றிய கூற்றுகள்:\nI. பெயரெச்சம் பெயரைக் கொண்டு முடியும்.\nII. இது காலம் காட்டும்.\nIII. இதில் எச்சச் சொல் வினையை விசேடித்து வரும்.\nIV. 'காவிய மான்' என்பது குறிப்புப் பெயரெச்சம் ஆகும்.\nஎவை சரி?", o: ["a) I மற்றும் II மட்டும்", "b) I, II மற்றும் IV மட்டும்", "c) அனைத்தும் சரி", "d) I மட்டும் சரி"], a: 1, exp: "விளக்கம்: பெயரெச்சம் வினையை விசேடிக்காது, பெயரை விசேடித்து நிற்கும். எனவே III தவறு." },
    { q: "18. வினையெச்சம் பற்றிய கூற்றுகள்:\nI. வினையெச்சம் ஒரு வினைமுற்றைக் கொண்டு முடியும்.\nII. இது காலத்தைக் காட்டாது.\nIII. 'வந்து போனான்' என்பதில் 'வந்து' என்பது வினையெச்சம்.\nIV. இது பெயரைக் கொண்டு முடியும்.\nஎவை தவறு?", o: ["a) I மற்றும் II", "b) II மற்றும் IV", "c) I மற்றும் IV", "d) III மற்றும் IV"], b: 1, exp: "விளக்கம்: வினையெச்சம் காலம் காட்டும்; மேலும் இது பெயரைக் கொண்டு முடியாது, வினையைக் கொண்டு முடியும். எனவே II மற்றும் IV தவறு." },
    { q: "19. தொழிற்பெயர் பற்றிய கூற்றுகள்:\nI. தொழிற்பெயர் காலம் காட்டாது.\nII. இது படர்க்கை இடத்திற்கு மட்டுமே உரியது.\nIII. இது விகுதி பெற்றும், விகுதி பெறாமலும் வரும்.\nIV. 'நடத்தல்' என்பது முதனிலை தொழிற்பெயர் ஆகும்.\nஎவை சரி?", o: ["a) I, II மற்றும் III", "b) I மற்றும் III மட்டும்", "c) II மற்றும் IV மட்டும்", "d) அனைத்தும் சரி"], a: 0, exp: "விளக்கம்: 'நடத்தல்' என்பது விகுதி பெற்ற தொழிற்பெயர் ('நட' என்பது முதனிலை தொழிற்பெயர்). எனவே IV தவறு." },
    { q: "20. வினையாலணையும் பெயர் பற்றிய கூற்றுகள்:\nI. வினையாலணையும் பெயர் ஒரு வினைமுற்றுப் பெயர்த் தன்மையடைந்து வருவது.\nII. இது காலம் காட்டும்.\nIII. இது படர்க்கை இடத்திற்கு மட்டுமே உரியது அல்ல; மூவிடங்களிலும் வரும்.\nIV. 'வந்தவர்' என்பது வினையாலணையும் பெயராகும்.\nஎவை சரி?", o: ["a) I மற்றும் II மட்டும்", "b) I, II மற்றும் III மட்டும்", "c) அனைத்தும் சரி", "d) III மற்றும் IV மட்டும்"], c: 2, exp: "விளக்கம்: வினையாலணையும் பெயர் மூவிடங்களிலும் வரும் (வந்தேன், வந்தாய், வந்தான்). கொடுக்கப்பட்ட அனைத்து கூற்றுகளும் சரி." },
    { q: "21. வியங்கோள் வினைமுற்று குறித்த கூற்றுகள்:\nI. வியங்கோள் வினைமுற்று விகுதிகள் -க, -இய, -இயிய ஆகும்.\nII. இது கட்டளைப் பொருளில் மட்டுமே வரும்.\nIII. இது இரு திணைகளையும், ஐம்பால்களையும் காட்டும்.\nIV. இது விகுதிகளை ஏற்று வராமல் தனித்து நிற்கும்.\nஎவை சரி?", o: ["a) I மற்றும் III மட்டும்", "b) II மற்றும் IV மட்டும்", "c) I, II மற்றும் III", "d) அனைத்தும் சரி"], a: 0, exp: "விளக்கம்: வியங்கோள் வினைமுற்று வாழ்த்துதல், வேண்டுதல் போன்ற பொருள்களில் வரும் (கட்டளை ஏவல் வினைக்கு உரியது). இது விகுதிகளை ஏற்றுத்தான் வரும். எனவே I மற்றும் III மட்டும் சரி." },
    { q: "22. எதிர்மறை பெயரெச்சம் குறித்த கூற்றுகள்:\nI. காலம் காட்டாத பெயரெச்சம் எதிர்மறை பெயரெச்சமாகும்.\nII. 'உண்ணாத உணவு' என்பதில் 'உண்ணாத' என்பது எதிர்மறை பெயரெச்சம்.\nIII. இது எதிர்மறைப் பொருளைத் தரும்.\nIV. இது வினைமுற்றைக் கொண்டு முடியும்.\nஎவை சரி?", o: ["a) I, II மற்றும் III", "b) II மற்றும் III மட்டும்", "c) I மற்றும் IV மட்டும்", "d) அனைத்தும் சரி"], a: 1, exp: "விளக்கம்: எதிர்மறை பெயரெச்சம் காலத்தைக் காட்டும் (இறந்தகாலம்/நிகழ்காலம் அல்லாமல் எதிர்மறைப் பொருள் தரும்). மேலும் இது பெயரைக் கொண்டு முடியும் ('உணவு' என்ற பெயர்). எனவே II மற்றும் III சரி." },

    // 5. கூற்று மற்றும் காரணம் (Assertion & Reason - A & R Model) [23 - 28]
    { q: "23. கூற்று (A): 'வந்த பையன்' என்பதில் 'வந்த' என்பது பெயரெச்சமாகும்.\nகாரணம் (R): இது எச்சச் சொல்லாக நின்று 'பையன்' என்னும் பெயரைத் தழுவி வந்துள்ளது.", o: ["a) (A) மற்றும் (R) இரண்டும் சரி; (R) என்பது (A)-க்கான சரியான விளக்கம்.", "b) (A) மற்றும் (R) இரண்டும் சரி; ஆனால் (R) சரியான விளக்கம் அல்ல.", "c) (A) சரி, (R) தவறு.", "d) (A) தவறு, (R) சரி."], a: 0, exp: "விளக்கம்: பெயரெச்சம் பெயரைக் கொண்டு முடியும் இலக்கண விதிப்படி கூற்றும் காரணமும் சரியானவையே." },
    { q: "24. கூற்று (A): தொழிற்பெயர்கள் எப்போதும் காலத்தைக் காட்டும்.\nகாரணம் (R): தொழிற்பெயர் என்பது வினையின் தன்மையை உணர்த்துமே தவிர காலத்தைக் காட்டாது.", o: ["a) (A) சரி, (R) தவறு", "b) (A) தவறு, (R) சரி", "c) இரண்டும் சரி", "d) இரண்டும் தவறு"], b: 1, exp: "விளக்கம்: தொழிற்பெயர் காலத்தைக் காட்டாது. எனவே கூற்று (A) தவறு, காரணம் (R) சரி." },
    { q: "25. கூற்று (A): 'வந்தவர் இவரே' என்பதில் 'வந்தவர்' என்பது வினையாலணையும் பெயராகும்.\nகாரணம் (R): ஒரு வினைமுற்றுப் பெயர்த் தன்மையடைந்து வினையைச் செய்தாரைக் குறிப்பது வினையாலணையும் பெயர் எனப்படும்.", o: ["a) (A) மற்றும் (R) இரண்டும் சரி; (R) என்பது (A)-க்கான சரியான விளக்கம்.", "b) இரண்டும் சரி, விளக்கமல்ல", "c) (A) சரி, (R) தவறு", "d) இரண்டும் தவறு"], a: 0, exp: "விளக்கம்: வினையாலணையும் பெயர் குறித்த சரியான கூற்றும் காரணமும் இதுவாகும்." },
    { q: "26. கூற்று (A): ஏவல் வினைமுற்று ஒருமையை மட்டும் காட்டும்.\nகாரணம் (R): ஏவல் வினைமுற்று முன்னிலையில் உள்ள ஒருவரை மட்டுமே சுட்டும்.", o: ["a) (A) சரி, (R) தவறு", "b) (A) தவறு, (R) சரி", "c) இரண்டும் சரி", "d) இரண்டும் தவறு"], b: 1, exp: "விளக்கம்: ஏவல் வினைமுற்று ஒருமை (படி) மற்றும் பன்மை (படிமின்/படியுங்கள்) ஆகிய இரண்டையும் காட்டும். எனவே கூற்று (A) தவறு, காரணம் (R) சரி." },
    { q: "27. கூற்று (A): 'நடந்து வந்தான்' என்பதில் 'நடந்து' என்பது வினையெச்சமாகும்.\nகாரணம் (R): இது எச்சச் சொல்லாக நின்று 'வந்தான்' என்னும் வினைமுற்றைத் தழுவி வந்துள்ளது.", o: ["a) (A) மற்றும் (R) இரண்டும் சரி; (R) என்பது (A)-க்கான சரியான விளக்கம்.", "b) இரண்டும் தவறு", "c) (A) சரி, (R) தவறு", "d) (A) தவறு, (R) சரி"], a: 0, exp: "விளக்கம்: வினையெச்சம் வினைமுற்றைத் தழுவும் விதிப்படி கூற்றும் காரணமும் சரி." },
    { q: "28. கூற்று (A): முதனிலை திரிந்த தொழிற்பெயருக்கு எடுத்துக்காட்டு 'கெடு' என்பது.\nகாரணம் (R): முதனிலை நீண்டு அல்லது திரிந்து வருவது முதனிலை திரிந்த தொழிற்பெயர் எனப்படும் (எ.கா: கெடு - கேடு).", o: ["a) (A) சரி, (R) தவறு", "b) (A) மற்றும் (R) இரண்டும் சரி; (R) சரியான விளக்கம்.", "c) இரண்டும் தவறு", "d) (A) தவறு, (R) சரி"], b: 1, exp: "விளக்கம்: 'கெடு' என்பது முதனிலை தொழிற்பெயர், அதன் திரிந்த வடிவம் 'கேடு' ஆகும். எனவே கூற்றும் காரணமும் சரி." },

    // 6. கால வரிசைப்படுத்துதல் / அமைப்பு முறை (Chronological / Structural Model) [29 - 33]
    { q: "29. சொல் அமைப்பின் அடிப்படையில் கால அல்லது நிகழ்வு முறையைப் பொறுத்து சரியான வரிசையைத் தேர்ந்தெடு:\n1. வேர்ச்சொல் (முதன்மை நிலை)\n2. வினையெச்சம் / பெயரெச்சம்\n3. வினைமுற்று / தொழிற்பெயர்", o: ["a) 1, 2, 3", "b) 3, 2, 1", "c) 2, 1, 3", "d) 1, 3, 2"], a: 0, exp: "விளக்கம்: வேர்ச்சொல் முதலில் நின்று, பின்னர் எச்சங்களாக மாறி, இறுதியில் வினைமுற்றாகவோ தொழிற்பெயராகவோ உருபெறும்." },
    { q: "30. விகுதிபெற்ற தொழிற்பெயர்களின் அமைப்பு முறைப்படி சரியானதைத் தேர்க:", o: ["a) வேர்ச்சொல் + விகுதி (எ.கா: நட + தல் = நடத்தல்)", "b) விகுதி + வேர்ச்சொல்", "c) இடைநிலை + பகுதி", "d) சந்தி + விகுதி"], a: 0, exp: "விளக்கம்: தொழிற்பெயர் என்பது வேர்ச்சொளுடன் (பகுதி) தொழிற்பெயர் விகுதி சேர்வதால் உருவாகும்." },
    { q: "31. செயப்பாட்டு வினைத் தொடரில் எச்சங்கள் எவ்வாறு அமைகின்றன?", o: ["a) பெயரெச்சம் மற்றும் வினையெச்சம் படுபடுதல் விகுதியுடன் வரும்", "b) எச்சங்கள் வராது", "c) வினைமுற்று மட்டும் வரும்", "d) பெயரெச்சம் மட்டும் வரும்"], a: 0, exp: "விளக்கம்: செயப்பாட்டு வினையில் 'படு' என்னும் துணைவினை சேர்ந்து எச்சங்கள் உருவாகும்." },
    { q: "32. தமிழ் இலக்கணத்தில் எச்சங்களின் வகைகளின் சரியான வரிசை:", o: ["a) பெயரெச்சம், வினையெச்சம்", "b) தெரிநிலை, குறிப்பு மட்டும்", "c) ஏவல், வியங்கோள்", "d) இறந்த, நிகழ்கால எச்சங்கள்"], a: 0, exp: "விளக்கம்: எச்சங்கள் பொதுவாக பெயரெச்சம் மற்றும் வினையெச்சம் என இருவகைப்படும்." },
    { q: "33. தொழிற்பெயர் வகைகளின் படிநிலையைக் குறிக்கும் சரியான தொடர்:", o: ["a) விகுதிபெற்ற தொழிற்பெயர் -> முதனிலை தொழிற்பெயர் -> முதனிலை திரிந்த தொழிற்பெயர்", "b) முதனிலை -> விகுதிபெற்றது -> திரிந்தது", "c) திரிந்தது -> முதனிலை -> விகுதி", "d) ஏதேனும் ஒன்று"], a: 0, exp: "விளக்கம்: தொழிற்பெயர் இலக்கணத்தின் பொதுவான வகைப்பாடு இதுவே ஆகும்." },

    // 7. பொருந்தாததைக் கண்டறிதல் / ஒற்றை விலக்கல் (Odd One Out Model) [34 - 38]
    { q: "34. கொடுக்கப்பட்டவற்றுள் பொருந்தாத ஒன்றைத் தேர்ந்தெடுக்க:", o: ["a) படித்தான்", "b) ஓடினாள்", "c) வந்த", "d) சிரித்தான்"], c: 2, exp: "விளக்கம்: 'வந்த' என்பது பெயரெச்சம் (எச்சம்). மற்ற மூன்றும் வினைமுற்று சொற்களாகும்." },
    { q: "35. பொருந்தாத சொைக் கண்டறிக:", o: ["a) நடந்து", "b) ஓடி", "c) படித்து", "d) எழுதியவன்"], d: 3, exp: "விளக்கம்: 'எழுதியவன்' என்பது வினையாலணையும் பெயர். மற்ற மூன்றும் வினையெச்சங்கள் ஆகும்." },
    { q: "36. பொருந்தாததை நீக்குக:", o: ["a) நடத்தல்", "b) உண்ணல்", "c) தின்பது", "d) ஓட்டம்"], d: 3, exp: "விளக்கம்: 'ஓட்டம்' என்பது முதனிலை திரிந்த தொழிற்பெயர் அல்லது விகுதிபெறாதது; மற்றவை -ல் விகுதி பெற்ற தொழிற்பெயர்கள் (-தல்/-ல்)." },
    { q: "37. வகைக்குப் பொருந்தாத ஒன்றைத் தேர்ந்தெடுக்க:", o: ["a) சென்றான்", "b) நல்லவன்", "c) வாழ்க", "d) படி"], b: 1, exp: "விளக்கம்: 'நல்லவன்' என்பது குறிப்பு வினைமுற்று அல்லது பெயரடைத் தன்மையுடையது; மற்றவை வினைமுற்று வடிவங்கள் (தெரிநிலை, வியங்கோள், ஏவல்)." },
    { q: "38. பொருந்தாத இலக்கணச் சொல்லைத் தேர்ந்தெடுக்க:", o: ["a) எழுதிய", "b) ஓடிய", "c) சிரித்த", "d) சிரித்து"], d: 3, exp: "விளக்கம்: 'சிரித்து' என்பது வினையெச்சம்; மற்ற மூன்றும் பெயரெச்சங்கள் ஆகும்." },

    // 8. கோடிட்ட இடங்களை நிரப்புதல் / வாக்கிய நிறைவு (Fill in the Blanks) [39 - 43]
    { q: "39. காலம் காட்டும் எச்சம் பெயரைக் கொண்டு முடிந்தால் அது __________ எனப்படும்.", o: ["a) வினையெச்சம்", "b) பெயரெச்சம்", "c) வினைமுற்று", "d) தொழிற்பெயர்"], b: 1, exp: "விளக்கம்: காலம் காட்டி பெயரைத் தழுவும் எச்சம் பெயரெச்சம் ஆகும்." },
    { q: "40. 'கக்கெனச் சிரித்தான்' என்பதில் இடம்பெற்றுள்ள 'கக்கென' என்பது __________ ஆகும்.", o: ["a) குறிப்பு வினையெச்சம்", "b) பண்பு வினையெச்சம்", "c) குறிப்புப் பெயரெச்சம்", "d) தெரிநிலை வினையெச்சம்"], b: 1, exp: "விளக்கம்: குறிப்புப் பண்பை உணர்த்தி வரும் வினையெச்சம் இதுவாகும் (இங்கு குறிப்பு/பண்பு வினையெச்சம்)." },
    { q: "41. தொழிலை மட்டும் உணர்த்தி, காலம் மற்றும் இடத்தைக் காட்டாத சொல் __________ ஆகும்.", o: ["a) வினைமுற்று", "b) தொழிற்பெயர்", "c) வினையாலணையும் பெயர்", "d) பெயரெச்சம்"], b: 1, exp: "விளக்கம்: இது தொழிற்பெயரின் வரையறையாகும்." },
    { q: "42. 'உண்டவன் வந்தான்' என்பதில் 'உண்டவன்' என்பது __________ ஆகும்.", o: ["a) தொழிற்பெயர்", "b) வினையாலணையும் பெயர்", "c) பெயரெச்சம்", "d) வினைமுற்று"], b: 1, exp: "விளக்கம்: வினையைச் செய்தவனைக் குறிக்கும் வினையாலணையும் பெயர் ஆகும்." },
    { q: "43. வியங்கோள் வினைமுற்று விகுதிகளில் மிகவும் பொதுவானது __________ ஆகும்.", o: ["a) -க", "b) -து", "c) -அன்", "d) -மார்"], a: 0, exp: "விளக்கம்: வியங்கோள் வினைமுற்று விகுதிகளில் '-க' விகுதி பரவலாகப் பயன்படுத்தப்படுகிறது." },

    // 9. அடுக்குத் தொடர் குறியீட்டு வினாக்கள் (Combination Code Model) [44 - 47]
    { q: "44. கீழ்க்கண்ட சொற்களில் எச்சச் சொற்கள் எவை?\n1. வந்த\n2. வந்து\n3. படித்தான்\n4. நடந்து\nகுறியீடுகளைத் தேர்ந்தெடுக்க:", o: ["a) 1, 2 மற்றும் 4 மட்டும்", "b) 1 மற்றும் 3 மட்டும்", "c) 2, 3 மற்றும் 4 மட்டும்", "d) அனைத்தும்"], a: 0, exp: "விளக்கம்: வந்த(பெயரெச்சம்), வந்து, நடந்து(வினையெச்சங்கள்). படித்தான் வினைமுற்று. எனவே 1, 2, 4 சரி." },
    { q: "45. தொழிற்பெயர் விகுதிகள் எவை?\n1. -தல்\n2. -அல்\n3. -ம்கை\n4. -து\nகூட்டுக் குறியீடு:", o: ["a) 1 மற்றும் 2 மட்டும்", "b) 1, 2 மற்றும் 3", "c) அனைத்தும்", "d) 4 மட்டும்"], a: 0, exp: "விளக்கம்: -தல், -அல் என்பவை முதன்மையான தொழிற்பெயர் விகுதிகள் ஆகும்." },
    { q: "46. வினையாலணையும் பெயர் எவற்றைக் காட்டும்?\n1. காலம்\n2. திணை, பால்\n3. எண், இடம்\n4. தொழிற்பெயர் விகுதி மட்டும்\nகூட்டுக் குறியீடு:", o: ["a) 1, 2 மற்றும் 3 மட்டும் சரி", "b) 2 மற்றும் 4 மட்டும்", "c) அனைத்தும் சரி", "d) 4 மட்டும்"], a: 0, exp: "விளக்கம்: வினையாலணையும் பெயர் காலம், திணை, பால், எண், இடம் ஆகிய ஐந்தையும் காட்டும்." },
    { q: "47. குறிப்பு வினைமுற்று எவற்றின் அடிப்படையில் தோன்றும்?\n1. பொருள்\n2. இடம்\n3. காலம்\n4. சினை, குணம், தொழில்\nகூட்டுக் குறியீடு:", o: ["a) 1, 2 மற்றும் 4 சரி", "b) அனைத்தும் சரி", "c) 3 மற்றும் 4 மட்டும்", "d) 1 மட்டும்"], b: 1, exp: "விளக்கம்: குறிப்பு வினைமுற்று பொருள், இடம், காலம், சினை, குணம், தொழில் என்னும் ஆறு அடிப்படையிலும் தோன்றும்." },

    // 10. கூட்டுக் கூற்று & ஒப்பிட்டாய்வு கேள்விகள் (Analytical Model) [48 - 50]
    { q: "48. பத்தியை ஆராய்ந்து விடையளி:\n'கண்ணன் நேற்று எழுதிய கடிதத்தை இன்று படித்தான்; படித்து முடித்துவிட்டு அவன் வெளியே சென்றான்.'\nஇத்தொடரில் வந்துள்ள 'எழுதிய' மற்றும் 'படித்து' ஆகியவற்றின் இலக்கணக் குறிப்பு முறையே:", o: ["a) பெயரெச்சம், வினையெச்சம்", "b) வினையெச்சம், பெயரெச்சம்", "c) வினைமுற்று, தொழிற்பெயர்", "d) தொழிற்பெயர், வினையெச்சம்"], a: 0, exp: "விளக்கம்: எழுதிய (பெயரெச்சம்), படித்து (வினையெச்சம்) ஆகும்." },
    { q: "49. ஒப்பிட்டாய்வுக் கேள்வி:\n'உண்பான்' (வினைமுற்று) மற்றும் 'உண்பவன்' (வினையாலணையும் பெயர்) ஆகியவற்றுக்கு இடையேயான முக்கிய வேறுபாடு என்ன?", o: ["a) உண்ணும் தன்மையைச் செய்பவனாகப் பெயர்த் தன்மை பெறுவது வினையாலணையும் பெயர், காலம் காட்டி முடிவது வினைமுற்று.", "b) இரண்டும் ஒன்றுதான்", "c) வினையாலணையும் பெயர் காலம் காட்டாது", "d) வினைமுற்று பெயரைக் கொண்டு முடியும்"], a: 0, exp: "விளக்கம்: 'உண்பான்' என்பது வினைமுற்று; 'உண்பவன்' என்பது வினையைக் செய்தவனைக் குறிக்கும் பெயர்த் தன்மை பெற்ற வினையாலணையும் பெயர் ஆகும்." },
    { q: "50. இலக்கண ஒப்பீட்டுக் கேள்வி:\n'ஓடுதல்' மற்றும் 'ஓடியவன்' ஆகிய சொற்களின் தன்மைகளை ஆராய்க.\n- ஓடுதல்: தொழிலை மட்டும் காட்டும்.\n- ஓடியவன்: ஓடும் தொழிலைச் செய்த ஒருவனைக் குறிக்கும்.\nஇக்கூற்றுகளில் சரியானது எது?", o: ["a) இரண்டும் சரி", "b) இரண்டும் தவறு", "c) ஓடுதல் மட்டும் சரி", "d) ஓடியவன் மட்டும் சரி"], a: 0, exp: "விளக்கம்: 'ஓடுதல்' என்பது தொழிற்பெயர் (தொழிலை மட்டும் காட்டும்); 'ஓடியவன்' என்பது வினையாலணையும் பெயர் (வினையைச் செய்தவரைக் குறிக்கும்). இரண்டும் சரியானவையே." }
  ];

  let currentQuestion = 0;
  let userAnswers = new Array(questionsData.length).fill(null);
  let isReviewMode = false;
  let timerInterval;
  let timeLeft = 45 * 60;

  function initTest() {
    buildGrid();
    loadQuestion(0);
    startTimer();
  }

  function buildGrid() {
    const grid = document.getElementById('questionGrid');
    grid.innerHTML = '';
    questionsData.forEach((_, idx) => {
      const btn = document.createElement('button');
      btn.className = 'q-num-btn';
      btn.innerText = idx + 1;
      btn.id = `q_btn_${idx}`;
      btn.onclick = () => jumpToQuestion(idx);
      grid.appendChild(btn);
    });
    updateGridStatus();
  }

  function updateGridStatus() {
    questionsData.forEach((_, idx) => {
      const btn = document.getElementById(`q_btn_${idx}`);
      if(!btn) return;
      btn.className = 'q-num-btn';
      if(idx === currentQuestion) {
        btn.classList.add('active');
      } else if(userAnswers[idx] !== null) {
        btn.classList.add('answered');
      }
    });
  }

  function loadQuestion(idx) {
    currentQuestion = idx;
    const q = questionsData[idx];
    document.getElementById('qTitle').innerText = q.q;
    
    const optsBox = document.getElementById('optionsBox');
    optsBox.innerHTML = '';

    q.o.forEach((optText, oIdx) => {
      const card = document.createElement('div');
      card.className = 'option-card';
      
      if(userAnswers[idx] === oIdx) {
        card.classList.add('selected');
      }

      if(isReviewMode) {
        if(oIdx === q.a) {
          card.classList.add('correct-ans');
        } else if(userAnswers[idx] === oIdx && oIdx !== q.a) {
          card.classList.add('wrong-ans');
        }
      }

      card.innerHTML = `<span><b>${String.fromCharCode(65 + oIdx)}.</b> ${optText}</span>`;
      card.onclick = () => selectOption(oIdx);
      optsBox.appendChild(card);
    });

    const expBox = document.getElementById('expBox');
    if(isReviewMode) {
      expBox.style.display = 'block';
      expBox.innerText = q.exp;
    } else {
      expBox.style.display = 'none';
    }

    document.getElementById('prevBtn').style.display = idx === 0 ? 'none' : 'block';
    document.getElementById('nextBtn').style.display = idx === questionsData.length - 1 ? 'none' : 'block';
    updateGridStatus();
  }

  function selectOption(oIdx) {
    if(isReviewMode) return;
    userAnswers[currentQuestion] = oIdx;
    loadQuestion(currentQuestion);
  }

  function clearChoice() {
    if(isReviewMode) return;
    userAnswers[currentQuestion] = null;
    loadQuestion(currentQuestion);
  }

  function navigateNumberQuery(dir) {
    const next = currentQuestion + dir;
    if(next >= 0 && next < questionsData.length) {
      loadQuestion(next);
    }
  }

  function jumpToQuestion(idx) {
    loadQuestion(idx);
  }

  function startTimer() {
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      timeLeft--;
      let m = Math.floor(timeLeft / 60);
      let s = timeLeft % 60;
      const timerElem = document.getElementById('timerBox');
      if(timerElem) {
        timerElem.innerText = `⏱️ ${m}:${s < 10 ? '0' : ''}${s}`;
      }
      if(timeLeft <= 0) {
        clearInterval(timerInterval);
        submitTest();
      }
    }, 1000);
  }

  function submitTest() {
    if (timerInterval) clearInterval(timerInterval);
    document.getElementById('testView').style.display = 'none';
    document.getElementById('resultView').style.display = 'block';

    let correct = 0, wrong = 0, unans = 0;
    userAnswers.forEach((ans, idx) => {
      if(ans === null) unans++;
      else if(ans === questionsData[idx].a) correct++;
      else wrong++;
    });

    document.getElementById('scoreDisplay').innerText = `${correct} / ${questionsData.length}`;
    let pct = ((correct / questionsData.length) * 100).toFixed(1);
    document.getElementById('percentageDisplay').innerText = `சதவீதம்: ${pct}%`;
    document.getElementById('correctCnt').innerText = correct;
    document.getElementById('wrongCnt').innerText = wrong;
    document.getElementById('unansCnt').innerText = unans;
  }

  function reviewAnswerKey() {
    isReviewMode = true;
    document.getElementById('resultView').style.display = 'none';
    document.getElementById('testView').style.display = 'block';
    document.getElementById('finalSubmitBtn').style.display = 'none';
    document.getElementById('backToResultBtn').style.display = 'block';
    document.getElementById('dashFromKeyBtn').style.display = 'block';
    loadQuestion(0);
  }

  function returnToResult() {
    document.getElementById('testView').style.display = 'none';
    document.getElementById('resultView').style.display = 'block';
  }

  function returnToDashboard() {
    window.location.replace("https://tigeracadamy.github.io/preperation-hub/index.html"); 
  }

  function exitPortal() {
    window.location.replace("https://tigeracadamy.github.io/preperation-hub/index.html");
  }

  function retakeTest() {
    userAnswers = new Array(questionsData.length).fill(null);
    isReviewMode = false;
    timeLeft = 45 * 60;
    document.getElementById('resultView').style.display = 'none';
    document.getElementById('testView').style.display = 'block';
    document.getElementById('finalSubmitBtn').style.display = 'inline-block';
    document.getElementById('backToResultBtn').style.display = 'none';
    document.getElementById('dashFromKeyBtn').style.display = 'none';
    initTest();
  }

  window.onload = function() {
    initTest();
  }
</script>
