<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tiger Warriors - திசைகள் (Direction Sense) 30 வினாக்கள்</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; font-weight: bold; }
    body { background: #080604; color: #f8fafc; padding: 12px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { width: 100%; max-width: 950px; background: #0f172a; border-radius: 14px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); border: 1px solid #334155; }
    
    .test-header { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; border: 1px solid #334155; }
    .timer { font-size: 15px; font-weight: bold; color: #fbbf24; background: #091326; padding: 6px 12px; border-radius: 6px; border: 1px solid #fbbf24; box-shadow: inset 0 0 5px rgba(251, 191, 36, 0.2); }
    .lang-btn { background: #0284c7; color: #fff; border: 1px solid #38bdf8; padding: 6px 14px; border-radius: 6px; font-size: 13px; cursor: pointer; transition: 0.2s; }
    .lang-btn:hover { background: #0369a1; }

    .q-grid { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 16px; max-height: 140px; overflow-y: auto; padding: 8px; background: #1e293b; border-radius: 8px; justify-content: center; }
    .q-num-btn { width: 30px; height: 30px; border-radius: 5px; border: none; background: #334155; color: #fff; font-size: 10px; cursor: pointer; font-weight: bold; }
    .q-num-btn.active { border: 2px solid #38bdf8; background: #0284c7; }
    .q-num-btn.answered { background: #10b981; }

    .q-box { background: #1e293b; padding: 18px; border-radius: 10px; margin-bottom: 16px; border: 1px solid #334155; }
    .q-text { white-space: pre-line; line-height: 1.6; font-size: 15px; color: #f8fafc; }
    
    .option-card { background: #0f172a; border: 1px solid #334155; padding: 12px 16px; border-radius: 8px; margin-top: 10px; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: 0.2s; white-space: pre-line; line-height: 1.4; }
    .option-card:hover { border-color: #38bdf8; background: #1e293b; }
    .option-card.selected { border-color: #10b981; background: #064e3b; }
    .option-card.correct-ans { border-color: #10b981; background: #065f46; font-weight: bold; }
    .option-card.wrong-ans { border-color: #ef4444; background: #7f1d1d; }

    .explanation-box { background: #091326; border: 1px solid #38bdf8; border-radius: 8px; padding: 12px; margin-top: 14px; font-size: 13px; color: #7dd3fc; line-height: 1.5; }
    
    .nav-btns { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    .btn-action { background: #334155; color: #fff; border: none; padding: 10px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 13px; text-align: center; }
    .btn-action:hover { opacity: 0.9; }
    .btn-blue { background: #2563eb; }
    .btn-purple { background: #7c3aed; }
    .btn-danger { background: #ef4444; }
    .btn-green { background: #22c55e; }

    .ai-btn-group { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; border-top: 1px dashed #38bdf8; padding-top: 12px; }
    .ai-link-btn { border: none; color: #fff; padding: 8px 14px; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: bold; transition: 0.2s; display: inline-flex; align-items: center; gap: 5px; }
    .ai-link-btn:hover { opacity: 0.85; transform: scale(1.02); }
    .btn-gemini { background: #4285f4; }
    .btn-chatgpt { background: #10a37f; }
    .btn-perplexity { background: #22b8cf; }
    .btn-google { background: #ea4335; }

    .result-box { text-align: center; padding: 25px; background: #1e293b; border-radius: 16px; margin-top: 10px; border: 1px solid rgba(0, 242, 254, 0.3); display: flex; flex-direction: column; align-items: center; }
    .score-circle { width: 130px; height: 130px; border-radius: 50%; background: conic-gradient(#10b981 0deg, #0f172a 0deg); display: flex; flex-direction: column; justify-content: center; align-items: center; margin: 0 auto 15px auto; border: 4px solid #38bdf8; box-shadow: 0 0 20px rgba(56, 189, 248, 0.4); }
    .score-num { font-size: 30px; color: #f8fafc; font-weight: bold; }
    
    .result-stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; width: 100%; max-width: 400px; }
    .stat-pill { background: #0f172a; border-radius: 12px; padding: 10px; border: 1px solid #334155; text-align: center; }
    .stat-pill.gold { border-color: #fbbf24; }
    .stat-pill.blue { border-color: #38bdf8; }
    .stat-pill.red { border-color: #ef4444; }

    .footer-badge { text-align: center; font-size: 11px; color: #38bdf8; margin-top: 15px; font-weight: bold; letter-spacing: 0.5px; }
  </style>
</head>

<div class="card">

  <div id="testView">

    </div>
  </div>

  <div id="resultView" style="display: none;">
    <h2 style="color: #38bdf8; text-align: center; margin-bottom: 10px;" id="resHeader">🏆 தேர்வு முடிவுகள் (Test Results) 🎯</h2>
    <div class="result-box">
      <div class="score-circle" id="scoreCircle">
        <div class="score-num" id="scoreDisplay">0/30</div>
        <span id="percentageDisplay" style="font-size: 11px; color: #fbbf24;">0%</span>
      </div>

      <div class="result-stats-grid">

        </div>
        <div class="stat-pill red">
          <h3 id="wrongCnt" style="color: #ef4444; font-size: 18px;">0</h3>
          <span style="font-size: 11px; color: #cbd5e1;" id="lblWrong">தவறானது ❌</span>
        </div>
        <div class="stat-pill blue">
          <h3 id="unansCnt" style="color: #f59e0b; font-size: 18px;">0</h3>
          <span style="font-size: 11px; color: #cbd5e1;" id="lblUnans">விடையில்லை ⚠️</span>
        </div>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px;">
      <button class="btn-action btn-blue" onclick="reviewAnswerKey()" id="btnKey">🔍 விடை குறிப்பு & விளக்கம்</button>
      <button class="btn-action btn-purple" onclick="returnToDashboard()" id="btnDash">🏠 முகப்புப் பக்கம்</button>
      <button class="btn-action btn-green" onclick="retakeTest()" id="btnRetake">🔄 மீண்டும் தேர்வு</button>
      <button class="btn-action btn-danger" onclick="exitPortal()" id="btnExit">🚪 வெளியேறு</button>
    </div>
    <div class="footer-badge" style="margin-top: 20px;">🐅 டைகர் வாரியர் போர்டல் - இயக்குநர்: Dr. K. மணிகாசி 🐅</div>
  </div>
</div>

<script>
  let currentLang = 'ta';

  const questionsData = [
    {
      q_ta: "1. 🧭 ஒருவர் வடக்கில் 10 கி.மீ நடந்து, பின்னர் வலதுபுறம் திரும்பி 15 கி.மீ நடக்கிறார். மீண்டும் வலதுபுறம் திரும்பி 10 கி.மீ நடக்கிறார். இப்போது அவர் தொடக்க இடத்திலிருந்து எந்தத் திசையில் உள்ளார்?\n[TNPSC Group 4 - PYQ]",
      q_en: "1. 🧭 A man walks 10 km towards North, then turns right and walks 15 km. He turns right again and walks 10 km. Now in which direction is he from the starting point?\n[TNPSC Group 4 - PYQ]",
      o: ["a) கிழக்கு (East)", "b) மேற்கு (West)", "c) வடக்கு (North)", "d) தெற்கு (South)"],
      a: 0,
      exp_ta: "<b>விளக்கம்:</b><br>⬆️ வடக்கில் 10 கி.மீ சென்று ➡️ வலதுபுறம் (கிழக்கு) 15 கி.மீ செல்கிறார். பின்னர் ⬇️ வலதுபுறம் (தெற்கு) 10 கி.மீ வந்து தொடக்கக் கோட்டிற்கே நேராக கிழக்கே நிற்கிறார். எனவே கிழக்கு 🧭.",
      exp_en: "<b>Explanation:</b><br>He ends up 15 km to the East of his starting point 🧭."
    },
    {
      q_ta: "2. 🌅 சூரிய உதயத்தின் போது (Sunrise) ரவி மற்றும் குமார் ஒருவரையொருவர் பார்த்துக் பேசிக் கொண்டிருக்கிறார்கள். குமாரின் நிழல் ரவியின் வலது பக்கத்தில் விழுந்தால், ரவி எந்தத் திசையை நோக்கி நின்றுகொண்டிருக்கிறார்?\n[TNPSC Group 2 - PYQ]",
      q_en: "2. 🌅 During sunrise, Ravi and Kumar are talking face to face. If Kumar's shadow falls to the right of Ravi, which direction is Ravi facing?\n[TNPSC Group 2 - PYQ]",
      o: ["a) தெற்கு (South)", "b) வடக்கு (North)", "c) கிழக்கு (East)", "d) மேற்கு (West)"],
      a: 0,
      exp_ta: "<b>விளக்கம்:</b><br>சூரிய உதயம் கிழக்கில் இருக்கும் ☀️, எனவே நிழல் மேற்கில் விழும். ரவியின் வலது கை மேற்குப் பக்கம் இருந்தால், அவர் ⬇️ தெற்கை நோக்கி நிற்கிறார்.",
      exp_en: "<b>Explanation:</b><br>Since shadow falls to the West during sunrise and it is to Ravi's right, Ravi is facing South ⬇️."
    },
    {
      q_ta: "3. 🏃‍♂️ ஒரு நபர் தெற்கே 5 கி.மீ நடந்து, இடதுபுறம் திரும்பி 3 கி.மீ நடந்து, மீண்டும் இடதுபுறம் திரும்பி 5 கி.மீ நடக்கிறார். தொடக்க இடத்திலிருந்து அவர் எவ்வளவு தூரத்தில் உள்ளார்?\n[TNPSC Group 1 - PYQ]",
      q_en: "3. 🏃‍♂️ A person walks 5 km South, turns left and walks 3 km, then turns left again and walks 5 km. How far is he from the starting point?\n[TNPSC Group 1 - PYQ]",
      o: ["a) 3 கி.மீ (3 km)", "b) 5 கி.மீ (5 km)", "c) 8 கி.மீ (8 km)", "d) 2 கி.மீ (2 km)"],
      a: 0,
      exp_ta: "<b>விளக்கம்:</b><br>⬇️ 5 கி.மீ தெற்கு, ⬅️ இடதுபுறம் 3 கி.மீ கிழக்கு, ⬆️ 5 கி.மீ வடக்கு. செவ்வகப் பாதையின்படி தொடக்கப் புள்ளியிலிருந்து கிழக்கு நோக்கி 3 கி.மீ தொலைவில் உள்ளார் 📏.",

    },
    {
      q_ta: "4. 🚲 ஒருவர் தனது வீட்டில் இருந்து புறப்பட்டு மேற்கில் 4 கி.மீ சென்று, இடதுபுறம் திரும்பி 3 கி.மீ செல்கிறார். எனில், அவர் வீட்டை அடைய குறைந்தபட்ச தூரம் என்ன?\n[TNPSC Group 2A - PYQ]",

      exp_en: "<b>Explanation:</b><br>Using Pythagoras theorem: $\\sqrt{4^2 + 3^2} = 5$ km 📐."
    },
    {
      q_ta: "5. 🧭 கடிகார முள் 3 மணி காட்டும்போது நிமிட முள் மேற்கில் இருந்தால், மணி முள் எந்தத் திசையைக் காட்டும்?\n[TNPSC CCSE - PYQ]",
      q_en: "5. 🧭 If the minute hand points West at 3 o'clock, which direction does the hour hand point?\n[TNPSC CCSE - PYQ]",

      a: 0,
      exp_ta: "<b>விளக்கம்:</b><br>3 மணியளவில் மணி முள் 3-லும், நிமிட முள் 12-லும் இருக்கும். நிமிட முள் மேற்கில் இருந்தால், மணி முள் ⬆️ வடக்கைக் காட்டும்.",
      exp_en: "<b>Explanation:</b><br>Hour hand points North when minute hand points West at 3 o'clock ⬆️."
    },
    {
      q_ta: "6. 🚶‍♂️ ஒரு நபர் வடமேற்கில் 4 கி.மீ நடந்து, பின்னர் வடகிழக்கில் 4 கி.மீ நடக்கிறார். இப்போது அவர் தொடக்கப் புள்ளியிலிருந்து எந்தத் திசையில் உள்ளார்?\n[TNPSC Group 4 - PYQ]",

  function initTest() {
    buildGrid();
    loadQuestion(0);
    startTimer();
  }

  function buildGrid() {
    const grid = document.getElementById('questionGrid');
    grid.innerHTML = '';
    questionsData.forEach((_, idx) => {
      const btn = document.createElement('button');
      btn.className = 'q-num-btn';
      btn.innerText = idx + 1;
      btn.id = `q_btn_${idx}`;
      btn.onclick = () => jumpToQuestion(idx);
      grid.appendChild(btn);
    });
    updateGridStatus();
  }

  function updateGridStatus() {
    questionsData.forEach((_, idx) => {
      const btn = document.getElementById(`q_btn_${idx}`);
      if(!btn) return;
      btn.className = 'q-num-btn';
      if(idx === currentQuestion) {
        btn.classList.add('active');
      } else if(userAnswers[idx] !== null) {
        btn.classList.add('answered');
      }
    });
  }

  function searchInAI(provider, questionIdx) {
    const q = questionsData[questionIdx];
    const questionText = (currentLang === 'ta' ? q.q_ta : q.q_en).replace(/<[^>]*>?/gm, '');
    const optionsText = q.o.join(", ");
    const fullQuery = encodeURIComponent(`Explain this TNPSC Direction Sense reasoning question step by step:\n${questionText}\nOptions: ${optionsText}`);
    
    let targetUrl = "";
    if (provider === 'chatgpt') {
      targetUrl = `https://chatgpt.com/?q=${fullQuery}`;
    } else if (provider === 'gemini') {
      targetUrl = `https://gemini.google.com/app`;
    } else if (provider === 'perplexity') {
      targetUrl = `https://www.perplexity.ai/?q=${fullQuery}`;
    } else if (provider === 'google') {
      targetUrl = `https://www.google.com/search?q=${fullQuery}`;
    }

    window.open(targetUrl, '_blank');
  }

  function loadQuestion(idx) {
    currentQuestion = idx;
    const q = questionsData[idx];
    document.getElementById('qTitle').innerText = currentLang === 'ta' ? q.q_ta : q.q_en;
    
    const optsBox = document.getElementById('optionsBox');
    optsBox.innerHTML = '';

    q.o.forEach((optText, oIdx) => {
      const card = document.createElement('div');
      card.className = 'option-card';
      
      if(userAnswers[idx] === oIdx) {
        card.classList.add('selected');
      }

      if(isReviewMode) {
        if(oIdx === q.a) {
          card.classList.add('correct-ans');
        } else if(userAnswers[idx] === oIdx && oIdx !== q.a) {
          card.classList.add('wrong-ans');
        }
      }

      card.innerHTML = `<span><b>${String.fromCharCode(65 + oIdx)}.</b> ${optText}</span>`;
      card.onclick = () => selectOption(oIdx);
      optsBox.appendChild(card);
    });

    const expBox = document.getElementById('expBox');
    if(isReviewMode) {
      expBox.style.display = 'block';
      let baseExp = currentLang === 'ta' ? q.exp_ta : q.exp_en;
      
      expBox.innerHTML = `
        <div style="font-size: 14px; margin-bottom: 8px;">${baseExp}</div>
        <div style="font-size: 12px; color: #fbbf24; margin-top: 10px; font-weight: bold;">🤖 AI Link Buttons (Opens in New Tab):</div>
        <div class="ai-btn-group">
          <button class="ai-link-btn btn-chatgpt" onclick="searchInAI('chatgpt', ${idx})">🟢 ChatGPT</button>
          <button class="ai-link-btn btn-gemini" onclick="searchInAI('gemini', ${idx})">✨ Gemini AI</button>
          <button class="ai-link-btn btn-perplexity" onclick="searchInAI('perplexity', ${idx})">🔵 Perplexity</button>
          <button class="ai-link-btn btn-google" onclick="searchInAI('google', ${idx})">🔍 Google Search</button>
        </div>
      `;
    } else {
      expBox.style.display = 'none';
    }

    document.getElementById('prevBtn').style.display = idx === 0 ? 'none' : 'block';
    document.getElementById('nextBtn').style.display = idx === questionsData.length - 1 ? 'none' : 'block';
    updateGridStatus();
  }

  function selectOption(oIdx) {
    if(isReviewMode) return;
    userAnswers[currentQuestion] = oIdx;
    loadQuestion(currentQuestion);
  }

  function clearChoice() {
    if(isReviewMode) return;
    userAnswers[currentQuestion] = null;
    loadQuestion(currentQuestion);
  }

  function navigateNumberQuery(dir) {
    const postNext = currentQuestion + dir;
    if(postNext >= 0 && postNext < questionsData.length) {
      loadQuestion(postNext);
    }
  }

  function jumpToQuestion(idx) {
    loadQuestion(idx);
  }

  function startTimer() {
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      timeLeft--;
      let m = Math.floor(timeLeft / 60);
      let s = timeLeft % 60;
      const timerElem = document.getElementById('timerBox');
      if(timerElem) {
        timerElem.innerText = `⏱️ ${m}:${s < 10 ? '0' : ''}${s}`;
      }
      if(timeLeft <= 0) {
        clearInterval(timerInterval);
        submitTest();
      }
    }, 1000);
  }

  function submitTest() {
    if (timerInterval) clearInterval(timerInterval);
    document.getElementById('testView').style.display = 'none';
    document.getElementById('resultView').style.display = 'block';

    let correct = 0, wrong = 0, unans = 0;
    userAnswers.forEach((ans, idx) => {
      if(ans === null) unans++;
      else if(ans === questionsData[idx].a) correct++;
      else wrong++;
    });

    document.getElementById('scoreDisplay').innerText = `${correct} / ${questionsData.length}`;
    let pct = ((correct / questionsData.length) * 100).toFixed(1);
    document.getElementById('percentageDisplay').innerText = `${currentLang === 'ta' ? 'சதவீதம்' : 'Percentage'}: ${pct}%`;
    document.getElementById('correctCnt').innerText = correct;
    document.getElementById('wrongCnt').innerText = wrong;
    document.getElementById('unansCnt').innerText = unans;
  }

  function reviewAnswerKey() {
    isReviewMode = true;
    document.getElementById('resultView').style.display = 'none';
    document.getElementById('testView').style.display = 'block';
    document.getElementById('finalSubmitBtn').style.display = 'none';
    document.getElementById('backToResultBtn').style.display = 'block';
    document.getElementById('dashFromKeyBtn').style.display = 'block';
    loadQuestion(0);
  }

  function returnToResult() {
    document.getElementById('testView').style.display = 'none';
    document.getElementById('resultView').style.display = 'block';
  }

  function returnToDashboard() {
    window.location.replace("https://tigeracadamy.github.io/preperation-hub/index.html"); 
  }

  function exitPortal() {
    window.location.replace("https://tigeracadamy.github.io/preperation-hub/index.html");
  }

  function retakeTest() {
    userAnswers = new Array(questionsData.length).fill(null);
    isReviewMode = false;
    timeLeft = 45 * 60;
    document.getElementById('resultView').style.display = 'none';
    document.getElementById('testView').style.display = 'block';
    document.getElementById('finalSubmitBtn').style.display = 'inline-block';
    document.getElementById('backToResultBtn').style.display = 'none';
    document.getElementById('dashFromKeyBtn').style.display = 'none';
    initTest();
  }

  window.onload = function() {
    initTest();
  }
</script>

</body>
</html>
