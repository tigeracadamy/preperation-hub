<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tiger Warriors - சந்திப்பிழை & ஒற்றுப்பிழை 50 வினாக்கள்</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; font-weight: bold; }
    body { background: #080604; color: #f8fafc; padding: 12px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { width: 100%; max-width: 950px; background: #0f172a; border-radius: 14px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); border: 1px solid #334155; }
    
    .test-header { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; border: 1px solid #334155; }
    .timer { font-size: 15px; font-weight: bold; color: #fbbf24; background: #091326; padding: 6px 12px; border-radius: 6px; border: 1px solid #fbbf24; box-shadow: inset 0 0 5px rgba(251, 191, 36, 0.2); }
    
    .q-grid { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 16px; max-height: 140px; overflow-y: auto; padding: 8px; background: #1e293b; border-radius: 8px; justify-content: center; }
    .q-num-btn { width: 30px; height: 30px; border-radius: 5px; border: none; background: #334155; color: #fff; font-size: 10px; cursor: pointer; font-weight: bold; }
    .q-num-btn.active { border: 2px solid #38bdf8; background: #0284c7; }
    .q-num-btn.answered { background: #10b981; }

    .q-box { background: #1e293b; padding: 18px; border-radius: 10px; margin-bottom: 16px; border: 1px solid #334155; }
    .q-text { white-space: pre-line; line-height: 1.6; font-size: 15px; color: #f8fafc; }
    
    .option-card { background: #0f172a; border: 1px solid #334155; padding: 12px 16px; border-radius: 8px; margin-top: 10px; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: 0.2s; white-space: pre-line; line-height: 1.4; }
    .option-card:hover { border-color: #38bdf8; background: #1e293b; }
    .option-card.selected { border-color: #10b981; background: #064e3b; }
    .option-card.correct-ans { border-color: #10b981; background: #065f46; font-weight: bold; }
    .option-card.wrong-ans { border-color: #ef4444; background: #7f1d1d; }

    .explanation-box { background: #091326; border: 1px solid #38bdf8; border-radius: 8px; padding: 12px; margin-top: 14px; font-size: 13px; color: #7dd3fc; line-height: 1.5; }
    
    .nav-btns { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    .btn-action { background: #334155; color: #fff; border: none; padding: 10px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 13px; text-align: center; }
    .btn-action:hover { opacity: 0.9; }
    .btn-blue { background: #2563eb; }
    .btn-purple { background: #7c3aed; }
    .btn-danger { background: #ef4444; }
    .btn-green { background: #22c55e; }

    .result-box { text-align: center; padding: 25px; background: #1e293b; border-radius: 16px; margin-top: 10px; border: 1px solid rgba(0, 242, 254, 0.3); display: flex; flex-direction: column; align-items: center; }
    .score-circle { width: 130px; height: 130px; border-radius: 50%; background: conic-gradient(#10b981 0deg, #0f172a 0deg); display: flex; flex-direction: column; justify-content: center; align-items: center; margin: 0 auto 15px auto; border: 4px solid #38bdf8; box-shadow: 0 0 20px rgba(56, 189, 248, 0.4); }
    .score-num { font-size: 30px; color: #f8fafc; font-weight: bold; }
    
    .result-stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; width: 100%; max-width: 400px; }
    .stat-pill { background: #0f172a; border-radius: 12px; padding: 10px; border: 1px solid #334155; text-align: center; }
    .stat-pill.gold { border-color: #fbbf24; }
    .stat-pill.blue { border-color: #38bdf8; }
    .stat-pill.red { border-color: #ef4444; }

    .footer-badge { text-align: center; font-size: 11px; color: #38bdf8; margin-top: 15px; font-weight: bold; letter-spacing: 0.5px; }
  </style>
</head>
<body>

<div class="card">
  <script>
      if (localStorage.getItem('tiger_auth_passed') !== 'true') {
          alert("⚠ பாதுகாப்பு எச்சரிக்கை: நீங்கள் Tiger Warriors போர்ட்டலில் லாகின் செய்யவில்லை! முதலில் மெயின் போர்ட்டலில் லாகின் செய்யவும்.");
          window.location.replace("https://tigeracadamy.github.io/preperation-hub/index.html"); 
      }
  </script>

  <div id="testView">
    <div class="test-header">
      <div>
        <h3 style="color: #38bdf8; font-size: 15px;">🐅 TIGER WARRIORS - சந்திப்பிழை & ஒற்றுப்பிழை (50 வினாக்கள்)</h3>
        <span style="font-size: 11px; color: #94a3b8;">TNPSC / 2 / 2A / 4 • GENERAL TAMIL</span>
      </div>
      <div style="display: flex; gap: 8px; align-items: center;">
        <div class="timer" id="timerBox">⏱️ 45:00</div>
        <button class="btn-action btn-purple" id="backToResultBtn" onclick="returnToResult()" style="display: none; padding: 6px 12px; font-size: 12px;">📊 ரிசல்ட் செல்</button>
        <button class="btn-action btn-danger" id="dashFromKeyBtn" onclick="returnToDashboard()" style="display: none; padding: 6px 12px; font-size: 12px;">🏠 முகப்பு</button>
      </div>
    </div>

    <div class="q-grid" id="questionGrid"></div>

    <div class="q-box">
      <div id="qTitle" class="q-text"></div>
      <div id="optionsBox"></div>
      <div id="expBox" class="explanation-box" style="display: none;"></div>
    </div>

    <div class="nav-btns">
      <button class="btn-action" id="prevBtn" onclick="navigateNumberQuery(-1)">⬅️ முந்தையது</button>
      <button class="btn-action" id="clearBtn" onclick="clearChoice()">🧹 விடையை நீக்கு</button>
      <button class="btn-action btn-blue" id="nextBtn" onclick="navigateNumberQuery(1)">அடுத்து ➡️</button>
      <button class="btn-action btn-danger" id="finalSubmitBtn" onclick="submitTest()">✅ தேர்வைச் சமர்ப்பிக்க (Submit)</button>
    </div>
  </div>

  <div id="resultView" style="display: none;">
    <h2 style="color: #38bdf8; text-align: center; margin-bottom: 10px;">🏆 தேர்வு முடிவுகள் (Test Results) 🎯</h2>
    <div class="result-box">
      <div class="score-circle" id="scoreCircle">
        <div class="score-num" id="scoreDisplay">0/50</div>
        <span id="percentageDisplay" style="font-size: 11px; color: #fbbf24;">0%</span>
      </div>

      <div class="result-stats-grid">
        <div class="stat-pill gold">
          <h3 id="correctCnt" style="color: #10b981; font-size: 18px;">0</h3>
          <span style="font-size: 11px; color: #cbd5e1;">சரியானவை ✅</span>
        </div>
        <div class="stat-pill red">
          <h3 id="wrongCnt" style="color: #ef4444; font-size: 18px;">0</h3>
          <span style="font-size: 11px; color: #cbd5e1;">தவறானவை ❌</span>
        </div>
        <div class="stat-pill blue">
          <h3 id="unansCnt" style="color: #f59e0b; font-size: 18px;">0</h3>
          <span style="font-size: 11px; color: #cbd5e1;">விடையில்லாய் ⚠️</span>
        </div>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px;">
      <button class="btn-action btn-blue" onclick="reviewAnswerKey()">🔍 விடை குறிப்பு (Answer Key)</button>
      <button class="btn-action btn-purple" onclick="returnToDashboard()">🏠 முகப்புப் பக்கம்</button>
      <button class="btn-action btn-green" onclick="retakeTest()">🔄 மீண்டும் தேர்வு</button>
      <button class="btn-action btn-danger" onclick="exitPortal()">🚪 வெளியேறு</button>
    </div>
    <div class="footer-badge" style="margin-top: 20px;">🐅 டைகர் வாரியர் போர்டல் - இயக்குநர்: Dr. K. மணிகாசி 🐅</div>
  </div>
</div>

<script>
  const questionsData = [
    // Model 1: Direct Single Fact Questions
    { q: "1. நிலைமொழியின் ஈற்றில் 'உ'கரம் வந்து, வருமொழியில் 'க, ச, த, ப' வந்தால் அங்கே என்ன நடக்கும்?", o: ["வல்லினம் மிகும்", "வல்லினம் மிகாது", "மயங்கொழி ஏற்படும்", "இடைஇனம் தோன்றும்"], a: 0, exp: "விளக்கம்: உகரம் ஈற்றுச் சொற்களின் முன் வல்லினம் மிகும் (எ.கா: பேச்சுப் போட்டி)." },
    { q: "2. திசைப்பெயர்களின் முன் வல்லினம் __________.", o: ["மிகும்", "மிகாது", "கட்டாயம் வரும்", "இயல்பாகும்"], a: 0, exp: "விளக்கம்: கிழக்கு, மேற்கு, வடக்கு, தெற்கு ஆகிய திசைப்பெயர்களின் முன் வல்லினம் மிகும் (எ.கா: கிழக்குத் திசை)." },
    { q: "3. அகர ஈற்று வினையெச்சங்களின் முன் வல்லினம் __________.", o: ["மிகும்", "மிகாது", "மயங்கும்", "தோன்றும்"], a: 1, exp: "விளக்கம்: அகர ஈற்று வினையெச்சங்களின் முன் வல்லினம் மிகாது (எ.கா: ஓடத் தொடங்கினான் - இங்கு அகர ஈற்று வினையெச்ச விதி விலக்கு உண்டு, எனினும் பொதுவாக வினையெச்சத்தில் மிகா)." },
    { q: "4. ஈறுகெட்ட எதிர்மறை பெயரெச்சத்தின் முன் வல்லினம் __________.", o: ["மிகும்", "மிகாது", "இயல்பாகும்", "மாறாது"], a: 0, exp: "விளக்கம்: ஈறுகெட்ட எதிர்மறை பெயரெச்சத்தின் முன் வல்லினம் மிகும் (எ.கா: செய்யா வேலை -> செய்யாச் செயல்)." },
    { q: "5. இரண்டாம் வேற்றுமை விரியின் முன் வல்லினம் __________.", o: ["மிகும்", "மிகாது", "மயங்கும்", "தோன்றும்"], a: 0, exp: "விளக்கம்: ஐ என்னும் இரண்டாம் வேற்றுமை உருபு வெளிப்பட்டு நிற்கும் விரியில் வல்லினம் மிகும் (எ.கா: க ண்டான்)." },

    // Model 2: Correct / Incorrect Sentences (Spotting Errors)
    { q: "6. கீழ்க்கண்டவற்றுள் சரியான வாக்கியத்தைத் தேர்ந்தெடுக்க:", o: ["பூக்கைத் பறிக்காதே", "பூவைப் பறிக்காதே", "பூ பறிக்காதே", "பூவை பறிக்காதே"], a: 1, exp: "விளக்கம்: இரண்டாம் வேற்றுமை விரியில் வல்லினம் மிகும். எனவே 'பூவைப் பறிக்காதே' என்பது சரி." },
    { q: "7. பிழையான தொடரைக் கண்டறிக:", o: ["தெற்குத் திசை", "வடக்குச் சுவர்", "கிழக்கு கடற்கரை", "மேற்குத் தொடர்ச்சி மலை"], a: 2, exp: "விளக்கம்: 'கிழக்குக் கடற்கரை' என க் இடம்பெற வேண்டும். அங்கு விடுபட்டுள்ளதால் அதுவே பிழையான தொடர்." },
    { q: "8. சரியான ஒற்றுப்பிழை நீக்கிய தொடர் எது?", o: ["தமிழ்த்தாய்", "தமிழ் தாய்", "தமிழ்தாய்", "தமிற் தாய்"], a: 0, exp: "விளக்கம்: நிலைமொழி 'தமிழ்' (ட்) மற்றும் வருமொழி 'தாய்' சேரும்போது 'தமிழ்த்தாய்' என வல்லினம் மிகும்." },
    { q: "9. பிழையான சொல்லைத் தேர்ந்தெடுக்க:\n- பால்குடி\n- பூக்கொத்து\n- கல் தூண்\n- பனைமரக் காடு", o: ["கல் தூண்", "பால்குடி", "பூக்கொத்து", "பனைமரக் காடு"], a: 0, exp: "விளக்கம்: 'கல்தூண்' என்பதில் 'ற்' அல்லது 'த்' ஒற்று வர வேண்டும் (கல்தூண் /கற்றுண்). 'கல் தூண்' தனித்தனியே வராது." },
    { q: "10. சந்திப்பிழையற்ற தொடர் எது?", o: ["வலைத்தளம்", "வலை தளம்", "வலைதளம்", "வலை தளம"], a: 0, exp: "விளக்கம்: 'வலை' + 'தளம்' = 'வலைத்தளம்' என வல்லினம் மிகும்." },

    // Model 3: Match the Following (Rules Matching)
    { q: "11. பொருத்துக:\n1. திசைப்பெயர்கள் — அ. வல்லினம் மிகும்\n2. அகர ஈற்று வினையெச்சம் — ஆ. வல்லினம் மிகாது\n3. இரண்டாம் வேற்றுமை விரி — இ. வல்லினம் மிகும்\n4. நான்காம் வேற்றுமை விரி — ஈ. வல்லினம் மிகும்", o: ["1-அ, 2-ஆ, 3-இ, 4-ஈ", "1-ஆ, 2-அ, 3-ஈ, 4-இ", "1-இ, 2-ஈ, 3-அ, 4-ஆ", "1-ஈ, 2-இ, 3-ஆ, 4-அ"], a: 0, exp: "விளக்கம்: திசைப்பெயர்கள், இரண்டாம்/நான்காம் வேற்றுமை விரிகளில் வல்லினம் மிகும்; வினையெச்சத்தில் மிகாது." },
    { q: "12. பொருத்துக:\n1. பூ + கொத்து — அ. பூங்கொத்து\n2. மரம் + வேர் — ஆ. மரவேர்\n3. தமிழ் + தாய் — இ. தமிழ்த்தாய்\n4. நிலம் + கடல் — ஈ. நிலக்கடல்", o: ["1-அ, 2-ஆ, 3-இ, 4-ஈ", "1-ஆ, 2-அ, 3-ஈ, 4-இ", "1-இ, 2-ஈ, 3-அ, 4-ஆ", "1-ஈ, 2-இ, 3-ஆ, 4-அ"], a: 0, exp: "விளக்கம்: புணர்ச்சி விதிகள் சரியாகப் பொருத்தப்பட்டுள்ளன." },
    { q: "13. பொருத்துக:\n1. அந்த, இந்த — அ. வல்லினம் மிகும்\n2. அப்படித்தான் — ஆ. ஒற்று மிகும்\n3. வினைத்தொகை — இ. வல்லினம் மிகாது\n4. உம்மைத்தொகை — ஈ. வல்லினம் மிகாது", o: ["1-அ, 2-ஆ, 3-இ, 4-ஈ", "1-ஆ, 2-அ, 3-ஈ, 4-இ", "1-இ, 2-ஈ, 3-அ, 4-ஆ", "1-ஈ, 2-இ, 3-ஆ, 4-அ"], a: 0, exp: "விளக்கம்: சுட்டுத் தொடர்களில் (அந்த, இந்த) வல்லினம் மிகும்; வினைத்தொகை, உம்மைத்தொகையில் மிகாது." },
    { q: "14. பொருத்துக:\n1. தனிக்குறில் ஒற்று — அ. இரட்டிக்கும்\n2. விகாரப் புணர்ச்சி — இனம் திரிதல், கெடுதல், தோன்றுதல்\n3. இயல்புப் புணர்ச்சி — இ. மாற்றம் இன்றிப் புணர்தல்\n4. சந்திப்பிழை — ஈ. எழுத்துப் பிழை", o: ["1-அ, 2-ஆ, 3-இ, 4-ஈ", "1-ஆ, 2-அ, 3-ஈ, 4-இ", "1-இ, 2-ஈ, 3-அ, 4-ஆ", "1-ஈ, 2-இ, 3-ஆ, 4-அ"], a: 0, exp: "விளக்கம்: தமிழ் இலக்கணப் புணர்ச்சி விதிகள் மற்றும் சந்திப்பிழை விளக்கங்கள்." },
    { q: "15. பொருத்துக:\n1. கிழக்குத் திசை — அ. திசைப்பெயர் விதி\n2. கையாற் செய்தான் — ஆ. மூன்றாம் வேற்றுமை\n3. ஊருக்குச் சென்றான் — இ. நான்காம் வேற்றுமை விரி\n4. பாவைக் கூட்டினான் — ஈ. இரண்டாம் வேற்றுமை விரி", o: ["1-அ, 2-ஆ, 3-இ, 4-ஈ", "1-ஆ, 2-அ, 3-ஈ, 4-இ", "1-இ, 2-ஈ, 3-அ, 4-ஆ", "1-ஈ, 2-இ, 3-ஆ, 4-அ"], a: 0, exp: "விளக்கம்: வேற்றுமை உருபு விரிகள் மற்றும் திசைப்பெயர் புணர்ச்சி விதிகள்." },

    // Model 4: Multiple Statement / 4 Statements Model
    { q: "16. வல்லினம் மிகும் இடங்கள் குறித்த கூற்றுகள்:\nI. சுட்டு, வினாத் தொடர்களில் வல்லினம் மிகும்.\nII. இரண்டாம் வேற்றுமை விரியில் வல்லினம் மிகும்.\nIII. அகர ஈற்று வினையெச்சத்தில் வல்லினம் மிகும்.\nIV. திசைப்பெயர்களின் முன் வல்லினம் மிகும்.\nஎவை சரியானவை?", o: ["I, II மற்றும் IV சரி", "I, II மற்றும் III சரி", "II, III மற்றும் IV சரி", "அனைத்தும் சரி"], a: 0, exp: "விளக்கம்: அகர ஈற்று வினையெச்சத்தில் வல்லினம் மிகாது. எனவே III தவறு; I, II, IV சரி." },
    { q: "17. வல்லினம் மிகா இடங்கள்:\nI. வினைத்தொகையில் வல்லினம் மிகாது.\nII. உம்மைத்தொகையில் வல்லினம் மிகாது.\nIII. அஃறிணைப் பெயர்களின் முன் வல்லினம் மிகும்.\nIV. விளித்தொடரில் வல்லினம் மிகாது.\nஎவை சரி?", o: ["I, II மற்றும் IV மட்டும்", "அனைத்தும் சரி", "I மற்றும் III மட்டும்", "II மட்டும் சரி"], a: 0, exp: "விளக்கம்: அஃறிணைப் பெயர்களின் முன் வல்லினம் மிகாது (எ.கா: குரங்கு தின்றது - குரங்கு கண்டது என மிகாது). எனவே III தவறு." },
    { q: "18. ஒற்றுப்பிழை நீக்குதல் விதிகள்:\nI. தனிக்குறில் எழுத்தை அடுத்து வரும் ஒற்று இரட்டிக்கும்.\nII. புணர்ச்சியின் போது விகாரங்கள் மூன்று வகைப்படும்.\nIII. வல்லின எழுத்துகள் க, ச, ட, த, ப, ற ஆகும்.\nIV. மெல்லின எழுத்துகள் எப்போதும் வல்லினத்திற்கு முன் மிகும்.\nஎவை தவறு?", o: ["IV மட்டும்", "I மற்றும் II", "III மட்டும்", "எதுவுமில்லை"], a: 0, exp: "விளக்கம்: மெல்லினத்திற்கு முன் வல்லினம் மிகாது, இயல்பாகும் (சில இடங்களில் மிகலாம்). எனவே IV தவறு." },
    { q: "19. சந்திப்பிழை திருத்துதல் பற்றிய கூற்றுகள்:\nI. மொழிக்கு மொழி புணர்ச்சி விதிகள் மாறுபடும்.\nII. தமிழில் வல்லின ஒற்று மிகுமிடங்களை அறிவது சந்திப்பிழையைத் தவிர்க்கும்.\nIII. 'பூக்கடை' என்பது சரியானது.\nIV. 'தண்ணீர் குடித்தான்' என்பதில் ஒற்றுப்பிழை இல்லை.\nஎவை சரி?", o: ["II மற்றும் III மட்டும்", "அனைத்தும் சரி", "I மற்றும் IV மட்டும்", "I, II மற்றும் III சரி"], a: 3, exp: "விளக்கம்: 'தண்ணீர் குடித்தான்' என்பதில் 'தண்ணீர்க் குடித்தான்' என க் வர வேண்டும். எனவே IV தவறு." },
    { q: "20. புணர்ச்சி விதிகள்:\nI. இயல்புப் புணர்ச்சியில் மாற்றங்கள் நிகழாது.\nII. விகாரப் புணர்ச்சியில் மூன்று மாற்றங்கள் உண்டு.\nIII. 'செந்தமிழ்' என்பது கெடுதல் விகாரமாகும்.\nIV. 'பொற்சிலை' என்பது தோன்றல் விகாரமாகும்.\nஎவை சரி?", o: ["I, II மற்றும் III", "அனைத்தும் சரி", "II மற்றும் IV மட்டும்", "I மற்றும் III மட்டும்"], a: 0, exp: "விளக்கம்: பொற்சிலை என்பது திரிதல் விகாரம் (பொன் + சிலை = பொற்சிலை). எனவே IV தவறு." },

    // Model 5: Assertion & Reason (A & R Model)
    { q: "21. கூற்று (A): 'வலைத்தளம்' என்னும் சொல்லில் 'த்' என்னும் ஒற்று மிகுந்து வந்துள்ளது.\nகாரணம் (R): நிலைமொழி ஈற்றில் உயிரெழுத்து வந்து வருமொழியில் 'த'கரம் முதலாய் வந்தால் அங்கே வல்லினம் மிகும்.", o: ["(A) மற்றும் (R) இரண்டும் சரி; (R) என்பது (A)-க்கான சரியான விளக்கம்.", "(A) மற்றும் (R) இரண்டும் சரி; விளக்கமல்ல.", "(A) சரி, (R) தவறு.", "(A) தவறு, (R) சரி."], a: 0, exp: "விளக்கம்: நிலைமொழி உயிர் ஈற்றுடன் வருமொழி வல்லினம் சேரும்போது புணர்ச்சி விதிப்படி ஒற்று மிகும்." },
    { q: "22. கூற்று (A): வினைத்தொகையில் வல்லினம் எப்போதுமே மிகும்.\nகாரணம் (R): காலம் காட்டும் இடைநிலை தொக்கி நிற்பதால் அங்கே ஒற்று மிக வேண்டிய அவசியமுள்ளது.", o: ["(A) தவறு, (R) தவறு", "(A) சரி, (R) தவறு", "(A) தவறு, (R) சரி", "இரண்டும் சரி"], a: 0, exp: "விளக்கம்: வினைத்தொகையில் எப்போதுமே வல்லினம் மிகாது. எனவே கூற்றும் காரணமும் தவறு." },
    { q: "23. கூற்று (A): 'தமிழ்த்தாய்' என்பதில் 'த்' என்னும் ஒற்று மிகுந்துள்ளது.\nகாரணம் (R): நிலைமொழி 'தமிழ்' (ட்) என்பதோடு 'தாய்' சேரும் போது தனித்தமிழ் விதிப்படி ஒற்று மிகுகிறது.", o: ["(A) மற்றும் (R) இரண்டும் சரி; (R) சரியான விளக்கம்.", "இரண்டும் தவறு", "(A) சரி, (R) தவறு", "(A) தவறு, (R) சரி"], a: 0, exp: "விளக்கம்: தமிழ்த்தாய் என்னும் சொல்லின் புணர்ச்சி விதிச் சரியானதே." },
    { q: "24. கூற்று (A): 'அங்கு சென்றான்' என்பதில் ஒற்று மிகாது.\nகாரணம் (R): சுட்டு, வினா எழுத்துகளைத் தவிர மற்ற இடங்களிலும் சில வேளைகளில் சுட்டுப்பெயர்களில் ஒற்று மிகாது.", o: ["(A) மற்றும் (R) இரண்டும் சரி; (R) சரியான விளக்கம்.", "(A) தவறு, (R) சரி", "இரண்டும் சரி", "இரண்டும் தவறு"], a: 0, exp: "விளக்கம்: அங்கு, இங்கு போன்ற சொற்களுக்குப் பின் வல்லினம் மிகும் (அங்குச் சென்றான்). எனினும் விதிவிலக்குகள் உண்டு." },
    { q: "25. கூற்று (A): சந்திப்பிழைகளைத் தவிர்ப்பது தமிழ்மொழியின் தூய்மையைப் பேணும்.\nகாரணம் (R): ஒற்றுப்பிழைகள் வாக்கியத்தின் பொருளை மாற்றிவிடக் கூடும்.", o: ["(A) மற்றும் (R) இரண்டும் சரி; (R) சரியான விளக்கம்.", "இரண்டும் சரி, விளக்கமல்ல", "(A) சரி, (R) தவறு", "இரண்டும் தவறு"], a: 0, exp: "விளக்கம்: சந்திப்பிழையின் முக்கியத்துவத்திற்கான சரியான விளக்கம்." },

    // Model 6: Chronological / Rule Application Order Model
    { q: "26. சந்திப்பிழை திருத்தும் சரியான படிநிலை முறை:\n1. சொற்களைப் பிரித்துப் பார்த்தல்\n2. புணர்ச்சி விதியைக் கண்டறிதல்\n3. ஒற்று மிகும் / மிகா இடங்களை உறுதி செய்தல்", o: ["1, 2, 3", "3, 2, 1", "2, 1, 3", "1, 3, 2"], a: 0, exp: "விளக்கம்: சந்திப்பிழையைக் கண்டறிந்து திருத்தும் சரியான படிநிலை முறை." },
    { q: "27. புணர்ச்சி மாற்றங்களின் வரிசை:\n1. இயல்புப் புணர்ச்சி\n2. விகாரப் புணர்ச்சி (கெடுதல், திரிதல், தோன்றுதல்)\n3. இறுதி வடிவம் பெறுதல்", o: ["1, 2, 3", "3, 2, 1", "2, 1, 3", "1, 3, 2"], a: 0, exp: "விளக்கம்: தமிழ் புணர்ச்சி இலக்கணத்தின்படி மாற்றங்கள் நிகழும் வரிசை." },
    { q: "28. வேற்றுமை உருபுகள் சந்தி பெறும் வரிசை:\n1. இரண்டாம் வேற்றுமை (ஐ)\n2. நான்காம் வேற்றுமை (கு)\n3. ஐந்தாம்/ஆறாம் வேற்றுமை", o: ["1, 2, 3", "3, 2, 1", "2, 1, 3", "1, 3, 2"], a: 0, exp: "விளக்கம்: வேற்றுமை விரிகளில் வல்லினம் மிகும் வரிசை." },
    { q: "29. சொற்கள் சேரும் முறை:\n1. நிலைமொழி\n2. வருமொழி\n3. புணர்ச்சி", o: ["1, 2, 3", "3, 2, 1", "2, 1, 3", "1, 3, 2"], a: 0, exp: "விளக்கம்: சொற்கள் இணைந்து புணரும் அடிப்படை முறை." },
    { q: "30. ஒற்றுப்பிழை கண்டறியும் முறைகள்:\n1. வாக்கியத்தைப் படித்தல்\n2. பிழையான எழுத்தைக் குறித்தல்\n3. சரியான விதியைச் প্রয়োগித்தல்", o: ["1, 2, 3", "3, 2, 1", "2, 1, 3", "1, 3, 2"], a: 0, exp: "விளக்கம்: ஒற்றுப்பிழை திருத்தும் முறை." },

    // Model 7: Odd One Out Model
    { q: "31. வல்லினம் மிகும் இடங்களுக்குள் பொருந்தாத ஒன்றைத் தேர்ந்தெடுக்க:\n- இரண்டாம் வேற்றுமை விரி\n- வினைத்தொகை\n- திசைப்பெயர்கள்\n- ஈறுகெட்ட எதிர்மறை பெயரெச்சம்", o: ["வினைத்தொகை", "திசைப்பெயர்கள்", "இரண்டாம் வேற்றுமை விரி", "ஈறுகெட்ட எதிர்மறை பெயரெச்சம்"], a: 0, exp: "விளக்கம்: வினைத்தொகையில் வல்லினம் மிகாது; மற்றவற்றில் மிகும்." },
    { q: "32. ஒற்று மிகா இடங்களுக்குள் பொருந்தாத சொல்லைத் தேர்ந்தெடுக்க:\n- பூக்கொத்து\n- தாய்தந்தை\n- பவளக்கொடி\n- கரும்பலகை", o: ["பூக்கொத்து", "தாய்தந்தை", "பவளக்கொடி", "கரும்பலகை"], a: 1, exp: "விளக்கம்: 'தாய்தந்தை' என்பது உம்மைத்தொகை (இங்கு ஒற்று மிகாது). மற்றவற்றில் ஒற்று மிகும்." },
    { q: "33. பொருந்தாததை நீக்குக:\n- கல் தூண்\n- செந்தமிழ்\n- பொற்சிலை\n- மரவேர்", o: ["கல் தூண்", "செந்தமிழ்", "பொற்சிலை", "மரவேர்"], a: 0, exp: "விளக்கம்: 'கல் தூண்' என்பது பிழையான தொடர் (கல்தூண் என எழுத வேண்டும்)." },
    { q: "34. வகைக்குப் பொருந்தாத ஒன்றைத் தேர்ந்தெடுக்க:\n- இலைத்தறி\n- நிலக்கடல்\n- பூந்தொட்டி\n- பால்குடி", o: ["பால்குடி", "இலைத்தறி", "நிலக்கடல்", "பூந்தொட்டி"], a: 0, exp: "விளக்கம்: பால்குடி என்பது இயல்புப் புணர்ச்சி/வேற்றுமை; மற்றவை விகாரப் புணர்ச்சிகள்." },
    { q: "35. சந்திப்பிழையற்ற சரியான தொடரைக் கண்டறிக:\n- நேற்று மழை பெய்தது\n- பூவை பறித்தாள்\n- தமிழுக்கு தொண்டு செய்\n- தண்ணீர் குடித்தான்", o: ["நேற்று மழை பெய்தது", "பூவை பறித்தாள்", "தமிழுக்கு தொண்டு செய்", "தண்ணீர் குடித்தான்"], a: 1, exp: "விளக்கம்: இரண்டாம் வேற்றுமை விரியான 'பூவைப் பறித்தாள்' என்பதே சந்திப்பிழையற்றது." },

    // Model 9: Matching Codes / Combination Code Model

    // Model 10: Comparative Statement / Analytical Model
    { q: "46. பத்தியை ஆராய்ந்து விடையளி:\n'வடக்குச் சுவரில் ஒட்டியிருந்த சுவரொட்டியைப் பார்த்தான்.'\nஇத்தொடரில் வந்துள்ள ஒற்றுப்பிழை மற்றும் சந்திப்பிழைகளின் நிலை என்ன?", o: ["அனைத்துச் சொற்களும் சந்திப்பிழையின்றிச் சரியாகப் புணர்ந்துள்ளன.", "வடக்கு சுவரில் என இருக்க வேண்டும்", "ஒற்றுப்பிழைகள் உள்ளன", "தவறான வாக்கியம்"], a: 0, exp: "விளக்கம்: வடக்குச் சுவரில், சுவரொட்டியைப் பார்த்தான் என்பவை விதிகளைப் பின்பற்றிச் சரியாக எழுதப்பட்டுள்ளன." },
    { q: "47. ஒப்பிட்டாய்வுக் கேள்வி:\n'பூக்கொத்து' மற்றும் 'பூங்கொத்து' ஆகிய சொற்களுக்கிடையேயான இலக்கண வேறுபாடு:", o: ["பூங்கொத்து என்பது விகாரப் புணர்ச்சி விதிப்படி சரியான சந்திச் சொல்லாகும்.", "இரண்டும் தவறு", "பூக்கொத்து என்பது சரி", "இரண்டும் ஒன்றுதான்"], a: 0, exp: "விளக்கம்: பூ + கொத்து என்பதில் 'ங்' தோன்றிப் புணர்வது சரியான சந்தி விதியாகும்." },
    { q: "48. பத்தியை ஆராய்ந்து விடையளி:\n'கண்ணன் பாடம் படித்தான்' மற்றும் 'கண்ணன் பாடத்தைப் படித்தான்' ஆகிய இரு வாக்கியங்களின் ஒப்பீடு:", o: ["இரண்டாம் வாக்கியத்தில் இரண்டாம் வேற்றுமை விரி வந்துள்ளதால் 'ப்' மிகுந்துள்ளது.", "முதல் வாக்கியத்தில் ஒற்று மிக வேண்டும்", "இரண்டும் பிழை", "வேறுபாடு இல்லை"], a: 0, exp: "விளக்கம்: பாடத்தை + படித்தான் என்பதில் இரண்டாம் வேற்றுமை விரியால் ஒற்று மிகும்." },
    { q: "49. இலக்கண ஒப்பீடு:\n'தண்ணீர்க் குடித்தான்' மற்றும் 'தண்ணீர் குடித்தான்' - இவற்றில் எது சரியானது?", o: ["தண்ணீர்க் குடித்தான் (அஃறிணைப் பெயர்/இரண்டாம் வேற்றுமைப் புணர்ச்சி விதிப்படி ஒற்று மிகலாம்)", "தண்ணீர் குடித்தான் மட்டுமே சரி", "இரண்டும் தவறு", "வேறுபாடு இல்லை"], a: 0, exp: "விளக்கம்: நிலைமொழி ஈற்றுடன் வருமொழி சேரும்போது ஒற்று மிகும் இடம் இதுவாகும்." },
    { q: "50. இறுதி ஆய்வு வினா:\nசந்திப்பிழைகளைத் தவிர்ப்பதன் மூலமாக ஒரு கட்டுரை அல்லது கடிதம் பெறும் பலன் என்ன?", o: ["பொருள் தெளிவும், வாசிப்புத் தகுதியும் மேம்படும்.", "எழுத்துக்கள் குறையும்", "நீளம் அதிகரிக்கும்", "பயன் இல்லை"], a: 0, exp: "விளக்கம்: சந்திப்பிழைகளைத் தவிர்ப்பது எழுத்தின் தெளிவையும் பொருளின் செம்மையையும் உறுதி செய்யும்." }
  ];

  let currentQuestion = 0;
  let userAnswers = new Array(questionsData.length).fill(null);
  let isReviewMode = false;
  let timerInterval;
  let timeLeft = 45 * 60;

  function initTest() {
    buildGrid();
    loadQuestion(0);
    startTimer();
  }

  function buildGrid() {
    const grid = document.getElementById('questionGrid');
    grid.innerHTML = '';
    questionsData.forEach((_, idx) => {
      const btn = document.createElement('button');
      btn.className = 'q-num-btn';
      btn.innerText = idx + 1;
      btn.id = `q_btn_${idx}`;
      btn.onclick = () => jumpToQuestion(idx);
      grid.appendChild(btn);
    });
    updateGridStatus();
  }

  function updateGridStatus() {
    questionsData.forEach((_, idx) => {
      const btn = document.getElementById(`q_btn_${idx}`);
      if(!btn) return;
      btn.className = 'q-num-btn';
      if(idx === currentQuestion) {
        btn.classList.add('active');
      } else if(userAnswers[idx] !== null) {
        btn.classList.add('answered');
      }
    });
  }

  function loadQuestion(idx) {
    currentQuestion = idx;
    const q = questionsData[idx];
    document.getElementById('qTitle').innerText = q.q;
    
    const optsBox = document.getElementById('optionsBox');
    optsBox.innerHTML = '';

    q.o.forEach((optText, oIdx) => {
      const card = document.createElement('div');
      card.className = 'option-card';
      
      if(userAnswers[idx] === oIdx) {
        card.classList.add('selected');
      }

      if(isReviewMode) {
        if(oIdx === q.a) {
          card.classList.add('correct-ans');
        } else if(userAnswers[idx] === oIdx && oIdx !== q.a) {
          card.classList.add('wrong-ans');
        }
      }

      card.innerHTML = `<span><b>${String.fromCharCode(65 + oIdx)}.</b> ${optText}</span>`;
      card.onclick = () => selectOption(oIdx);
      optsBox.appendChild(card);
    });

    const expBox = document.getElementById('expBox');
    if(isReviewMode) {
      expBox.style.display = 'block';
      expBox.innerText = q.exp;
    } else {
      expBox.style.display = 'none';
    }

    document.getElementById('prevBtn').style.display = idx === 0 ? 'none' : 'block';
    document.getElementById('nextBtn').style.display = idx === questionsData.length - 1 ? 'none' : 'block';
    updateGridStatus();
  }

  function selectOption(oIdx) {
    if(isReviewMode) return;
    userAnswers[currentQuestion] = oIdx;
    loadQuestion(currentQuestion);
  }

  function clearChoice() {
    if(isReviewMode) return;
    userAnswers[currentQuestion] = null;
    loadQuestion(currentQuestion);
  }

  function navigateNumberQuery(dir) {
    const next = currentQuestion + dir;
    if(next >= 0 && next < questionsData.length) {
      loadQuestion(next);
    }
  }

  function jumpToQuestion(idx) {
    loadQuestion(idx);
  }

  function startTimer() {
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      timeLeft--;
      let m = Math.floor(timeLeft / 60);
      let s = timeLeft % 60;
      const timerElem = document.getElementById('timerBox');
      if(timerElem) {
        timerElem.innerText = `⏱️ ${m}:${s < 10 ? '0' : ''}${s}`;
      }
      if(timeLeft <= 0) {
        clearInterval(timerInterval);
        submitTest();
      }
    }, 1000);
  }

  function submitTest() {
    if (timerInterval) clearInterval(timerInterval);
    document.getElementById('testView').style.display = 'none';
    document.getElementById('resultView').style.display = 'block';

    let correct = 0, wrong = 0, unans = 0;
    userAnswers.forEach((ans, idx) => {
      if(ans === null) unans++;
      else if(ans === questionsData[idx].a) correct++;
      else wrong++;
    });

    document.getElementById('scoreDisplay').innerText = `${correct} / ${questionsData.length}`;
    let pct = ((correct / questionsData.length) * 100).toFixed(1);
    document.getElementById('percentageDisplay').innerText = `சதவீதம்: ${pct}%`;
    document.getElementById('correctCnt').innerText = correct;
    document.getElementById('wrongCnt').innerText = wrong;
    document.getElementById('unansCnt').innerText = unans;
  }

  function reviewAnswerKey() {
    isReviewMode = true;
    document.getElementById('resultView').style.display = 'none';
    document.getElementById('testView').style.display = 'block';
    document.getElementById('finalSubmitBtn').style.display = 'none';
    document.getElementById('backToResultBtn').style.display = 'block';
    document.getElementById('dashFromKeyBtn').style.display = 'block';
    loadQuestion(0);
  }

  function returnToResult() {
    document.getElementById('testView').style.display = 'none';
    document.getElementById('resultView').style.display = 'block';
  }

  function returnToDashboard() {
    window.location.replace("https://tigeracadamy.github.io/preperation-hub/index.html"); 
  }

  function exitPortal() {
    window.location.replace("https://tigeracadamy.github.io/preperation-hub/index.html");
  }

  function retakeTest() {
    userAnswers = new Array(questionsData.length).fill(null);
    isReviewMode = false;
    timeLeft = 45 * 60;
    document.getElementById('resultView').style.display = 'none';
    document.getElementById('testView').style.display = 'block';
    document.getElementById('finalSubmitBtn').style.display = 'inline-block';
    document.getElementById('backToResultBtn').style.display = 'none';
    document.getElementById('dashFromKeyBtn').style.display = 'none';
    initTest();
  }

  window.onload = function() {
    initTest();
  }
</script>

</body>
</html>
