<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tiger Warriors - ஒருமை - பன்மை பிழை நீக்குதல் 50 வினாக்கள்</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; font-weight: bold; }
    body { background: #080604; color: #f8fafc; padding: 12px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { width: 100%; max-width: 950px; background: #0f172a; border-radius: 14px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); border: 1px solid #334155; }
    
    .test-header { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; border: 1px solid #334155; }
    .timer { font-size: 15px; font-weight: bold; color: #fbbf24; background: #091326; padding: 6px 12px; border-radius: 6px; border: 1px solid #fbbf24; box-shadow: inset 0 0 5px rgba(251, 191, 36, 0.2); }
    
    .q-grid { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 16px; max-height: 140px; overflow-y: auto; padding: 8px; background: #1e293b; border-radius: 8px; justify-content: center; }
    .q-num-btn { width: 30px; height: 30px; border-radius: 5px; border: none; background: #334155; color: #fff; font-size: 10px; cursor: pointer; font-weight: bold; }
    .q-num-btn.active { border: 2px solid #38bdf8; background: #0284c7; }
    .q-num-btn.answered { background: #10b981; }

    .q-box { background: #1e293b; padding: 18px; border-radius: 10px; margin-bottom: 16px; border: 1px solid #334155; }
    .q-text { white-space: pre-line; line-height: 1.6; font-size: 15px; color: #f8fafc; }
    
    .option-card { background: #0f172a; border: 1px solid #334155; padding: 12px 16px; border-radius: 8px; margin-top: 10px; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: 0.2s; white-space: pre-line; line-height: 1.4; }
    .option-card:hover { border-color: #38bdf8; background: #1e293b; }
    .option-card.selected { border-color: #10b981; background: #064e3b; }
    .option-card.correct-ans { border-color: #10b981; background: #065f46; font-weight: bold; }
    .option-card.wrong-ans { border-color: #ef4444; background: #7f1d1d; }

    .explanation-box { background: #091326; border: 1px solid #38bdf8; border-radius: 8px; padding: 12px; margin-top: 14px; font-size: 13px; color: #7dd3fc; line-height: 1.5; }
    
    .nav-btns { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    .btn-action { background: #334155; color: #fff; border: none; padding: 10px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 13px; text-align: center; }
    .btn-action:hover { opacity: 0.9; }
    .btn-blue { background: #2563eb; }
    .btn-purple { background: #7c3aed; }
    .btn-danger { background: #ef4444; }
    .btn-green { background: #22c55e; }

    .result-box { text-align: center; padding: 25px; background: #1e293b; border-radius: 16px; margin-top: 10px; border: 1px solid rgba(0, 242, 254, 0.3); display: flex; flex-direction: column; align-items: center; }
    .score-circle { width: 130px; height: 130px; border-radius: 50%; background: conic-gradient(#10b981 0deg, #0f172a 0deg); display: flex; flex-direction: column; justify-content: center; align-items: center; margin: 0 auto 15px auto; border: 4px solid #38bdf8; box-shadow: 0 0 20px rgba(56, 189, 248, 0.4); }
    .score-num { font-size: 30px; color: #f8fafc; font-weight: bold; }
    
    .result-stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; width: 100%; max-width: 400px; }
    .stat-pill { background: #0f172a; border-radius: 12px; padding: 10px; border: 1px solid #334155; text-align: center; }
    .stat-pill.gold { border-color: #fbbf24; }
    .stat-pill.blue { border-color: #38bdf8; }
    .stat-pill.red { border-color: #ef4444; }

    .footer-badge { text-align: center; font-size: 11px; color: #38bdf8; margin-top: 15px; font-weight: bold; letter-spacing: 0.5px; }
  </style>
</head>
<body>

<div class="card">
  <script>
      if (localStorage.getItem('tiger_auth_passed') !== 'true') {
          alert("⚠ பாதுகாப்பு எச்சரிக்கை: நீங்கள் Tiger Warriors போர்ட்டலில் லாகின் செய்யவில்லை! முதலில் மெயின் போர்ட்டலில் லாகின் செய்யவும்.");
          window.location.replace("https://tigeracadamy.github.io/preperation-hub/index.html"); 
      }
  </script>

  <div id="testView">
    <div class="test-header">
      <div>
        <h3 style="color: #38bdf8; font-size: 15px;">🐅 TIGER WARRIORS - ஒருமை - பன்மை பிழை நீக்குதல் (50 வினாக்கள்)</h3>
        <span style="font-size: 11px; color: #94a3b8;">TNPSC / 2 / 2A / 4 • GENERAL TAMIL</span>
      </div>
      <div style="display: flex; gap: 8px; align-items: center;">
        <div class="timer" id="timerBox">⏱️ 45:00</div>
        <button class="btn-action btn-purple" id="backToResultBtn" onclick="returnToResult()" style="display: none; padding: 6px 12px; font-size: 12px;">📊 ரிசல்ட் செல்</button>
        <button class="btn-action btn-danger" id="dashFromKeyBtn" onclick="returnToDashboard()" style="display: none; padding: 6px 12px; font-size: 12px;">🏠 முகப்பு</button>
      </div>
    </div>

    <div class="q-grid" id="questionGrid"></div>

    <div class="q-box">
      <div id="qTitle" class="q-text"></div>
      <div id="optionsBox"></div>
      <div id="expBox" class="explanation-box" style="display: none;"></div>
    </div>

    <div class="nav-btns">
      <button class="btn-action" id="prevBtn" onclick="navigateNumberQuery(-1)">⬅️ முந்தையது</button>
      <button class="btn-action" id="clearBtn" onclick="clearChoice()">🧹 விடையை நீக்கு</button>
      <button class="btn-action btn-blue" id="nextBtn" onclick="navigateNumberQuery(1)">அடுத்து ➡️</button>
      <button class="btn-action btn-danger" id="finalSubmitBtn" onclick="submitTest()">✅ தேர்வைச் சமர்ப்பிக்க (Submit)</button>
    </div>
  </div>

  <div id="resultView" style="display: none;">
    <h2 style="color: #38bdf8; text-align: center; margin-bottom: 10px;">🏆 தேர்வு முடிவுகள் (Test Results) 🎯</h2>
    <div class="result-box">
      <div class="score-circle" id="scoreCircle">
        <div class="score-num" id="scoreDisplay">0/50</div>
        <span id="percentageDisplay" style="font-size: 11px; color: #fbbf24;">0%</span>
      </div>

      <div class="result-stats-grid">
        <div class="stat-pill gold">
          <h3 id="correctCnt" style="color: #10b981; font-size: 18px;">0</h3>
          <span style="font-size: 11px; color: #cbd5e1;">சரியானவை ✅</span>
        </div>
        <div class="stat-pill red">
          <h3 id="wrongCnt" style="color: #ef4444; font-size: 18px;">0</h3>
          <span style="font-size: 11px; color: #cbd5e1;">தவறானவை ❌</span>
        </div>
        <div class="stat-pill blue">
          <h3 id="unansCnt" style="color: #f59e0b; font-size: 18px;">0</h3>
          <span style="font-size: 11px; color: #cbd5e1;">விடையில்லை ⚠️</span>
        </div>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px;">
      <button class="btn-action btn-blue" onclick="reviewAnswerKey()">🔍 விடை குறிப்பு (Answer Key)</button>
      <button class="btn-action btn-purple" onclick="returnToDashboard()">🏠 முகப்புப் பக்கம்</button>
      <button class="btn-action btn-green" onclick="retakeTest()">🔄 மீண்டும் தேர்வு</button>
      <button class="btn-action btn-danger" onclick="exitPortal()">🚪 வெளியேறு</button>
    </div>
    <div class="footer-badge" style="margin-top: 20px;">🐅 டைகர் வாரியர் போர்டல் - இயக்குநர்: Dr. K. மணிகாசி 🐅</div>
  </div>
</div>

<script>
  const questionsData = [
    // Model 1: Direct Single Fact Questions (1-5)
    { q: "1. அஃறிணை எழுவாய் ஒருமையாக இருப்பின் அதன் பயனிலை எவ்வாறு முடியும்?", o: ["து என முடியும்", "அ என முடியும்", "அனர் என முடியும்", "மார் என முடியும்"], a: 0, exp: "விளக்கம்: அஃறிணை எழுவாய் ஒருமையாக இருந்தால் பயனிலை 'து' என முடியும் (எ.கா: பறவை பறந்தது)." },
    { q: "2. அஃறிணை எழுவாய் பன்மையாக இருப்பின் அதன் பயனிலை எவ்வாறு முடியும்?", o: ["து என முடியும்", "அ அல்லது அன என முடியும்", "ஆன் என முடியும்", "மார் என முடியும்"], a: 1, exp: "விளக்கம்: அஃறிணை பன்மை எழுவாய்க்குப் பயனிலை 'அ' அல்லது 'அன' என முடியும் (எ.கா: பறவைகள் பறந்தன)." },
    { q: "3. 'பறவை வானில் பறந்தன' என்னும் தொடரில் உள்ள பிழை என்ன?", o: ["ஒருமை பன்மைப் பிழை", "வல்லினப் பிழை", "திணைப் பிழை", "பால் பிழை"], a: 0, exp: "விளக்கம்: 'பறவை' என்பது ஒருமை, ஆனால் 'பறந்தன' என்பது பன்மைப் பயனிலை. 'பறவை பறந்தது' அல்லது 'பறவைகள் பறந்தன' என இருக்க வேண்டும்." },
    { q: "4. 'ஒவ்வொரு மாணவனும் வந்தான்' - இத்தொடரின் இலக்கண அமைப்பு முறையானது:", o: ["சரியானது", "பிழையானது", "பன்மை விகுதி கெட்டது", "காலப் பிழையானது"], a: 0, exp: "விளக்கம்: ஒவ்வொரு என்னும் சொல் வரும்போது எழுவாய் ஒருமையாகவே வரும் (ஒவ்வொரு மாணவனும் வந்தான் என்பதே சரி)." },
    { q: "5. 'ஒவ்வொரு ஊர்களிலும் கோவில் உண்டு' - இத்தொடரின் சரியான வடிவம் என்ன?", o: ["ஒவ்வொரு ஊரிலும் கோவில் உண்டு", "எல்லா ஊர்களிலும் கோவில்கள் உண்டு", "அ மற்றும் ஆ இரண்டும் சரி", "தொடர் சரியே"], a: 2, exp: "விளக்கம்: 'ஒவ்வொரு' என்ற சொல்லின் பின் பன்மை விகுதி (கள்) வருவது பிழை. 'ஒவ்வொரு ஊரிலும்' அல்லது 'எல்லா ஊர்களிலும்' என வர வேண்டும்." },

    // Model 2: Correct / Incorrect Sentences (6-10)
    { q: "6. கீழ்க்கண்டவற்றுள் ஒருமை பன்மைப் பிழையற்ற சரியான தொடர் எது?", o: ["மாடுகள் புல் மேய்ந்தன", "மாடுகள் புல் மேய்ந்தது", "மாடு புல் மேய்ந்தன", "மாடு புல் மேய்ந்தனர்"], a: 0, exp: "விளக்கம்: பன்மை எழுவாய்க்குப் பன்மைப் பயனிலை வர வேண்டும் (மாடுகள் மேய்ந்தன)." },
    { q: "7. பிழையான ஒருமை-பன்மைத் தொடரைக் கண்டறிக:", o: ["மாணவர்கள் பாடம் படித்தனர்", "மாணவர்கள் பாடம் படித்தான்", "மாணவன் பாடம் படித்தான்", "மடமகன் படித்தான்"], a: 1, exp: "விளக்கம்: 'மாணவர்கள்' என்பது பன்மை, 'படித்தான்' என்பது ஒருமை பயனிலை. இது பிழையான தொடராகும்." },
    { q: "8. சரியான ஒற்று / பன்மைப் பொருத்தமான தொடரைத் தேர்ந்தெடுக்க:", o: ["இது பழங்கள் அல்ல", "இவை பழங்கள் அல்ல", "அது பழங்கள் அல்ல", "இது பழங்கள் அன்று"], a: 1, exp: "விளக்கம்: 'இவை' என்பது பன்மைச் சுட்டு, எனவே 'இவை பழங்கள் அல்ல' என்பதே சரியாகும்." },
    { q: "9. பிழையான இணையைத் தேர்ந்தெடுக்க:\n- குழந்தை பால் குடித்தது (சரி)\n- குழந்தை பால் குடித்தனர் (பிழை)\n- சிங்கம் கர்ச்சித்தன (பிழை)\n- சிங்கம் கர்ச்சித்தது (சரி)", o: ["சிங்கம் கர்ச்சித்தன", "குழந்தை பால் குடித்தனர்", "அ மற்றும் ஆ இரண்டும் பிழையான தொடர்களே", "அனைத்தும் சரியானவையே"], a: 2, exp: "விளக்கம்: குழந்தை மற்றும் சிங்கம் என்பன ஒருமை, ஆனால் குடித்தனர், கர்ச்சித்தன என்பன பன்மைப் பயனிலைகள். எனவே இரண்டும் பிழையான தொடர்களே." },
    { q: "10. பிழையற்ற சரியான தொடர் எது?", o: ["நூலகத்தில் பல புத்தகங்கள் உள்ளன", "நூலகத்தில் பல புத்தகங்கள் உள்ளது", "நூலகத்தில் பல புத்தகம் உள்ளது", "நூலகத்தில் பல புத்தகம் உள்ளன"], a: 0, exp: "விளக்கம்: புத்தகங்கள் (பன்மை) என்பதால் 'உள்ளன' (பன்மைப் பயனிலை) வர வேண்டும்." },

    // Model 3: Match the Following (11-15)
    { q: "11. பொருத்துக (ஒருமை - பன்மை):\n1. பறவை பறந்தது — அ. மரங்கள் வளர்ந்தன\n2. மரம் வளர்ந்தது — ஆ. பறவைகள் பறந்தன\n3. மாடு மேய்ந்தது — இ. மாடுகள் மேய்ந்தன\n4. குதிரை ஓடியது — ஈ. குதிரைகள் ஓடின", o: ["1-ஆ, 2-அ, 3-இ, 4-ஈ", "1-அ, 2-ஆ, 3-இ, 4-ஈ", "1-இ, 2-ஈ, 3-அ, 4-ஆ", "1-ஈ, 2-இ, 3-ஆ, 4-அ"], a: 0, exp: "விளக்கம்: ஒருமைத் தொடர்களுக்குரிய சரியான பன்மைத் தொடர்களின் பொருத்தங்கள் இவை." },
    { q: "12. பொருத்துக (பிழையான தொடர் - சரியான தொடர்):\n1. இவை பூக்கள் அன்று — அ. இவை பூக்கள் அல்ல\n2. படை வீரர்கள் முன்னேறியது — ஆ. படை வீரர்கள் முன்னேறினர்\n3. தேன்மொழி கோலம் போட்டார்கள் — இ. தேன்மொழி கோலம் போட்டாள்\n4. ஆசிரியர் பாடம் நடத்தினான் — ஈ. ஆசிரியர் பாடம் நடத்தினார்", o: ["1-அ, 2-ஆ, 3-இ, 4-ஈ", "1-ஆ, 2-அ, 3-ஈ, 4-இ", "1-இ, 2-ஈ, 3-அ, 4-ஆ", "1-ஈ, 2-இ, 3-ஆ, 4-அ"], a: 0, exp: "விளக்கம்: ஒருமை-பன்மை மற்றும் மரியாதை நிமித்தமான பிழைகளைத் திருத்தும் பொருத்தங்கள்." },
    { q: "13. பொருத்துக:\n1. சிறுவன் சிரித்தான் — அ. சிறுவர்கள் சிரித்தனர்\n2. பெண் பாடினாள் — ஆ. பெண்கள் பாடினர்\n3. தலைவர் பேசினார் — இ. தலைவர்கள் பேசினர்\n4. சிங்கம் கர்ச்சித்தது — ஈ. சிங்கங்கள் கர்ச்சித்தன", o: ["1-அ, 2-ஆ, 3-இ, 4-ஈ", "1-ஆ, 2-அ, 3-ஈ, 4-இ", "1-இ, 2-ஈ, 3-அ, 4-ஆ", "1-ஈ, 2-இ, 3-ஆ, 4-அ"], a: 0, exp: "விளக்கம்: உயர்திணை மற்றும் அஃறிணைச் சொற்களின் பன்மை மாற்றப் பொருத்தங்கள்." },
    { q: "14. பொருத்துக (சுட்டுப் பெயர்கள்):\n1. அது மரம் — அ. அவை மரங்கள்\n2. இது பை — ஆ. இவை பைகள்\n3. அஃது இலை — இ. அவை இலைகள்\n4. இஃது ஊசி — ஈ. இவை ஊசிகள்", o: ["1-அ, 2-ஆ, 3-இ, 4-ஈ", "1-ஆ, 2-அ, 3-ஈ, 4-இ", "1-இ, 2-ஈ, 3-அ, 4-ஆ", "1-ஈ, 2-இ, 3-ஆ, 4-அ"], a: 0, exp: "விளக்கம்: சுட்டுப் பெயர்களின் ஒருமை-பன்மை வடிவப் பொருத்தங்கள்." },
    { q: "15. பொருத்துக:\n1. நிலம் / நாடு முன்னேறியது — அ. நாடுகள் முன்னேறின\n2. செய்தி வந்தது — ஆ. செய்திகள் வந்தன\n3. கடிதம் கிடைத்தது — இ. கடிதங்கள் கிடைத்தன\n4. உண்மை தெரிந்தது — ஈ. உண்மைகள் தெரிந்தன", o: ["1-அ, 2-ஆ, 3-இ, 4-ஈ", "1-ஆ, 2-அ, 3-ஈ, 4-இ", "1-இ, 2-ஈ, 3-அ, 4-ஆ", "1-ஈ, 2-இ, 3-ஆ, 4-அ"], a: 0, exp: "விளக்கம்: அஃறிணைப் பெயர்ச் சொற்களின் பன்மை மாற்றப் பொருத்தங்கள்." },

    // Model 4: Multiple Statement / 4 Statements Model (16-20)
    { q: "16. ஒருமை பன்மை விதிகள் குறித்த கூற்றுகள்:\nI. ஒருமை எழுவாய்க்கு ஒருமைப் பயனிலையும், பன்மை எழுவாய்க்குப் பன்மைப் பயனிலையும் வர வேண்டும்.\nII. உயர்திணை ஒருமைப் பெயருக்கு உயர்திணைப் பன்மைப் பயனிலையும் வருவதுண்டு (மரியாதை கருதி).\nIII. அஃறிணை பன்மை எழுவாய்க்கு 'து' விகுதி பயனிலையாக வரும்.\nIV. 'ஒவ்வொரு' என்னும் சொல்லின் பின்வரும் பெயர்ச்சொல் ஒருமையாகவே இருக்கும்.\nஎவை சரியானவை?", o: ["I, II மற்றும் IV சரி", "I, II மற்றும் III சரி", "II, III மற்றும் IV சரி", "அனைத்தும் சரி"], a: 0, exp: "விளக்கம்: அஃறிணை பன்மை எழுவாய்க்கு 'அ' அல்லது 'அன' என முடியுமே தவிர 'து' என முடியாது. எனவே III தவறு." },
    { q: "17. பிழையான தொடர்களைக் கண்டறிதல்:\nI. செடிகள் பூத்துக் குலுங்கியது\nII. பசுக்கள் பால் தந்தன\nIII. காகங்கள் கரைந்தது\nIV. மலைகள் உயரமாக இருந்தன\nஎவை பிழையான தொடர்கள்?", o: ["I மற்றும் III", "II மற்றும் IV", "I, III மற்றும் IV", "அனைத்தும் பிழை"], a: 0, exp: "விளக்கம்: 'செடிகள்' மற்றும் 'காகங்கள்' என்பன பன்மை, ஆனால் பயனிலைகள் ஒருமையில் (குலுங்கியது, கரைந்தது) வந்துள்ளன. எனவே I மற்றும் III பிழையானவை." },
    { q: "18. சுட்டு மற்றும் வினாப் பெயர்கள்:\nI. எது கிடைத்தது? - எவை ஓடின?\nII. இவை பழங்கள் அல்ல\nIII. அது என் புத்தகம் அன்று\nIV. இவை காய்ந்த சருகுகள் அன்று\nஎவை சரியானவை?", o: ["I, II மற்றும் III சரி", "அனைத்தும் சரி", "II மற்றும் IV மட்டும்", "I மட்டும் சரி"], a: 0, exp: "விளக்கம்: 'சருகுகள்' என்பது பன்மை, எனவே 'அன்று' (ஒருமை) வராமல் 'அல்ல' (பன்மை) வர வேண்டும் (இவை காய்ந்த சருகுகள் அல்ல). எனவே IV தவறு." },
    { q: "19. மரியாதை பன்மைப் பெயர்கள்:\nI. பெரியவர் தாம் சொன்னதைச் செய்தார் (சரி).\nII. ஆசிரியர் பாடம் நடத்தினார் (சரி).\nIII. தம்பி தான் செய்த தவற்றை உணர்ந்தார்கள் (பிழை - உணர்ந்தான் என வர வேண்டும்).\nIV. அப்பா வந்தார் (சரி).\nஎவை சரியானவை?", o: ["I, II மற்றும் IV சரி", "அனைத்தும் சரி", "III மற்றும் IV மட்டும்", "I மட்டும் சரி"], a: 0, exp: "விளக்கம்: தம்பி என்பது ஒருமை, எனவே 'உணர்ந்தான்' என்றே வர வேண்டும்." },
    { q: "20. அஃறிணை பன்மைப் பிழைகள்:\nI. குதிரைகள் வேகமாக ஓடின\nII. ஆறுகள் பெருக்கெடுத்து ஓடியது\nIII. எறும்புகள் வரிசையாகச் சென்றன\nIV. சிங்கம் கர்ச்சித்தன\nஎவை சரியான தொடர்கள்?", o: ["I மற்றும் III", "II மற்றும் IV", "I, II மற்றும் III", "அனைத்தும் சரி"], a: 0, exp: "விளக்கம்: ஆறுகள் (ஓடின), சிங்கம் (கர்ச்சித்தது) என வர வேண்டும். எனவே II மற்றும் IV பிழையானவை, I மற்றும் III சரியானவை." },

    // Model 5: Assertion & Reason (A & R Model) (21-25)
    { q: "21. கூற்று (A): 'மாடுகள் புல் மேய்ந்தது' என்பது ஒருமை பன்மைப் பிழையுள்ள தொடராகும்.\nகாரணம் (R): பன்மை எழுவாய்க்குப் பன்மைப் பயனிலை ('மேய்ந்தன') மட்டுமே வர வேண்டும்.", o: ["(A) மற்றும் (R) இரண்டும் சரி; (R) என்பது (A)-க்கான சரியான விளக்கம்.", "(A) மற்றும் (R) இரண்டும் சரி; விளக்கமல்ல.", "(A) சரி, (R) தவறு.", "(A) தவறு, (R) சரி."], a: 0, exp: "விளக்கம்: எழுவாய்க்கும் பயனிலைக்கும் உள்ள எண் பொருத்தம் பற்றிய சரியான விளக்கம் இதுவாகும்." },
    { q: "22. கூற்று (A): 'ஒவ்வொரு மாணவர்களும் வந்தார்கள்' என்பது சரியான தொடராகும்.\nகாரணம் (R): 'ஒவ்வொரு' என்ற சொல் பன்மைப் பொருளைத் தருவதால் வினைமுற்றும் பன்மையில் வந்துள்ளது.", o: ["(A) தவறு, (R) தவறு", "(A) சரி, (R) தவறு", "(A) தவறு, (R) சரி", "இரண்டும் சரி"], a: 0, exp: "விளக்கம்: 'ஒவ்வொரு' என்ற சொல்லின் பின் ஒருமைப் பெயரே வர வேண்டும் ('ஒவ்வொரு மாணவனும் வந்தான்' என்பதே சரி). எனவே கூற்றும் காரணமும் தவறு." },
    { q: "23. கூற்று (A): 'இது பழங்கள் அல்ல' என்னும் தொடரில் எண் பிழை ஏற்பட்டுள்ளது.\nகாரணம் (R): 'இது' என்பது ஒருமைச் சுட்டு, ஆனால் 'பழங்கள்' என்பது பன்மைப் பெயர். எனவே 'இவை பழங்கள் அல்ல' என வர வேண்டும்.", o: ["(A) மற்றும் (R) இரண்டும் சரி; (R) சரியான விளக்கம்.", "இரண்டும் தவறு", "(A) சரி, (R) தவறு", "(A) தவறு, (R) சரி"], a: 0, exp: "விளக்கம்: சுட்டுப்பெயரும் பெயர்ச்சொல்லும் எண்ணில் ஒத்துவர வேண்டும்." },
    { q: "24. கூற்று (A): அஃறிணை ஒருமை எழுவாய்க்குப் பயனிலை 'து' விகுதியில் முடியும்.\nகாரணம் (R): 'மயில் தோகை விரித்து ஆடியது' என்பதில் 'ஆடியது' என்பது ஒருமைப் பயனிலையாகும்.", o: ["(A) மற்றும் (R) இரண்டும் சரி; (R) சரியான விளக்கம்.", "(A) தவறு, (R) சரி", "இரண்டும் சரி", "இரண்டும் தவறு"], a: 0, exp: "விளக்கம்: அஃறிணை ஒருமை விதிகளுக்கான சரியான விளக்கம்." },
    { q: "25. கூற்று (A): பெரியவர்கள் த propios மரியாதை நிமித்தம் பன்மை வினைமுற்றைப் பெறுவர்.\nகாரணம் (R): 'தலைவர்கள் பேசினார்' என்பது பிழையான தொடராகும்.", o: ["(A) மற்றும் (R) இரண்டும் சரி; (R) சரியான விளக்கம்.", "இரண்டும் சரி, விளக்கமல்ல", "(A) சரி, (R) தவறு", "இரண்டும் தவறு"], a: 0, exp: "விளக்கம்: தலைவர்கள் (பன்மை) என்பதால் 'பேசினார்' என்பது பிழை, 'பேசினர்' என வர வேண்டும்." },

    // Model 6: Chronological / Analytical Order Model (26-30)
    { q: "26. ஒருமை-பன்மை பிழை திருத்தும் சரியான படிநிலை முறை:\n1. வாக்கியத்தின் எழுவாயை (ஒருமையா/பன்மனையா என) கண்டறிதல்\n2. அதற்குரிய பயனிலையின் விகுதியைச் சரிபார்த்தல்\n3. எண் பொருத்தம் (Singular/Plural Agreement) அமைத்துத் திருத்துதல்", o: ["1, 2, 3", "3, 2, 1", "2, 1, 3", "1, 3, 2"], a: 0, exp: "விளக்கம்: இலக்கண முறைப்படி பிழை திருத்தும் சரியான வரிசை முறை." },
    { q: "27. அஃறிணை ஒருமைச் சொற்களின் பன்மை மாற்ற வரிசை:\n1. பறவை பறந்தது -> பறவைகள் பறந்தன\n2. மரம் வளர்ந்தது -> மரங்கள் வளர்ந்தன\n3. மாடு மேய்ந்தது -> மாடுகள் மேய்ந்தன", o: ["1, 2, 3", "3, 2, 1", "2, 1, 3", "1, 3, 2"], a: 0, exp: "விளக்கம்: ஆறாம் வகுப்புப் புத்தகப் பயிற்சிப் படிநிலைகள்." },
    { q: "28. சுட்டுப்பெயர் மாற்றங்களின் வரிசை:\n1. அது மரம் -> அவை மரங்கள்\n2. இது பை -> இவை பைகள்\n3. இஃது ஊசி -> இவை ஊசிகள்", o: ["1, 2, 3", "3, 2, 1", "2, 1, 3", "1, 3, 2"], a: 0, exp: "விளக்கம்: சுட்டுப்பெயர்களின் சரியான பன்மை மாற்ற வரிசை." },
    { q: "29. உயர்திணை ஒருமை-பன்மை மாற்ற வரிசை:\n1. சிறுவன் சிரித்தான் -> சிறுவர்கள் சிரித்தனர்\n2. பெண் பாடினாள் -> பெண்கள் பாடினர்\n3. மாணவன் எழுதினான் -> மாணவர்கள் எழுதினர்", o: ["1, 2, 3", "3, 2, 1", "2, 1, 3", "1, 3, 2"], a: 0, exp: "விளக்கம்: உயர்திணைச் சொற்களின் சரியான பன்மை வடிவ வரிசை." },
    { q: "30. இயற்கை மற்றும் சுற்றுச்சூழல் சார்ந்த தொடர்களின் வரிசை:\n1. மழை பொழிந்தது -> மழைகள் பொழிந்தன\n2. பயிர் செழித்தது -> பயிர்கள் செழித்தன\n3. river / ஆறு ஓடியது -> ஆறுகள் ஓடின", o: ["1, 2, 3", "3, 2, 1", "2, 1, 3", "1, 3, 2"], a: 0, exp: "விளக்கம்: இயற்கைச் சொற்களின் ஒருமை-பன்மை வரிசை." },

    // Model 7: Odd One Out Model (31-35)
    { q: "31. பொருந்தாத ஒருமை-பன்மை இணையைத் தேர்ந்தெடுக்க:\n- பறவை - பறவைகள்\n- கல் - கற்கள்\n- மரம் - மரங்கள்\n- பையன் - பையன்கள்மார்", o: ["பையன் - பையன்கள்மார்", "மரம் - மரங்கள்", "கல் - கற்கள்", "பறவை - பறவைகள்"], a: 0, exp: "விளக்கம்: 'கள்' அல்லது 'மார்' தனித்தனியாக வரும்; 'பையன்கள்மார்' என்பது விகுதி இரட்டிப்பான பிழையான வடிவம்." },
    { q: "32. கீழ்க்கண்டவற்றுள் சரியான தொடர் அமைப்பிலிருந்து மாறுபட்ட (பிழையான) ஒன்றைத் தேர்ந்தெடு:\n- மாடுகள் புல் மேய்ந்தன\n- குதிரைகள் வேகமாக ஓடின\n- எறும்புகள் வரிசையாகச் சென்றன\n- சிங்கம் கர்ச்சித்தன", o: ["சிங்கம் கர்ச்சித்தன", "எறும்புகள் வரிசையாகச் சென்றன", "குதிரைகள் வேகமாக ஓடின", "மாடுகள் புல் மேய்ந்தன"], a: 0, exp: "விளக்கம்: 'சிங்கம்' என்பது ஒருமை, எனவே 'கர்ச்சித்தது' என்றே வர வேண்டும்." },
    { q: "33. பொருந்தாத சுட்டுப்பெயர் பொருத்தத்தை நீக்குக:\n- அது - அவை\n- இது - இவை\n- இஃது - இவை\n- எது - எவன்", o: ["எது - எவன்", "இஃது - இவை", "இது - இவை", "அது - அவை"], a: 0, exp: "விளக்கம்: எது என்பதன் பன்மை 'எவை' ஆகும் ('எவன்' என்பது வினாப்பெயர்)." },
    { q: "34. வகைக்குப் பொருந்தாத பிழையான தொடரைத் தேர்ந்தெடுக்க:\n- நூலகத்தில் பல புத்தகங்கள் உள்ளன\n- மலைகள் உயரமாக இருந்தன\n- தேன்மொழி கோலம் போட்டாள்\n- தம்பி தான் செய்த தவற்றை உணர்ந்தார்கள்", o: ["தம்பி தான் செய்த தவற்றை உணர்ந்தார்கள்", "தேன்மொழி கோலம் போட்டாள்", "மலைகள் உயரமாக இருந்தன", "நூலகத்தில் பல புத்தகங்கள் உள்ளன"], a: 0, exp: "விளக்கம்: 'தம்பி' என்பது ஒருமை, எனவே 'உணர்ந்தான்' என வர வேண்டும்." },
    { q: "35. பொருந்தாத எதிர்மறைச் சொல்லைத் தேர்ந்தெடுக்க:\n- இது பழங்கள் அல்ல\n- இவை காய்ந்த இலைகள் அல்ல\n- கல்விச் செல்வம் அழிவற்றது அன்று\n- இவை என் குறிகோள் அல்ல", o: ["இவை என் குறிகோள் அல்ல", "கல்விச் செல்வம் அழிவற்றது அன்று", "இவை காய்ந்த இலைகள் அல்ல", "இது பழங்கள் அல்ல"], a: 0, exp: "விளக்கம்: 'குறிகோள்' என்பது ஒருமை, எனவே 'இது என் குறிக்கோள் அன்று' என வர வேண்டும்." },

    // Model 8: Fill in the Blanks / Sentence Completion (36-40)
    { q: "36. 'ஆறுகள் பெருக்கெடுத்து __________' - கோடிட்ட இடத்தை நிரப்புக:", o: ["ஓடின", "ஓடியது", "ஓடினான்", "ஓடினர்"], a: 0, exp: "விளக்கம்: 'ஆறுகள்' என்பது பன்மை என்பதால் 'ஓடின' என முடியும்." },
    { q: "37. 'ஒவ்வொரு குடிமகனும் நாட்டை __________' - பொருத்தமான சொல்:", o: ["நேசித்தான்", "நேசித்தனர்", "நேசித்தாார்கள்", "நேசிக்கின்றனர்"], a: 0, exp: "விளக்கம்: ஒவ்வொரு என்னும் சொல் வரும்போது ஒருமை வினைமுற்று (நேசித்தான்) பெறும்." },
    { q: "38. 'மயில்கள் தோகை விரித்து __________' - பொருத்தமான சொல்:", o: ["ஆடின", "ஆடியது", "ஆடினான்", "ஆடினர்"], a: 0, exp: "விளக்கம்: மயில்கள் (பன்மை) என்பதால் 'ஆடின' என வர வேண்டும்." },
    { q: "39. 'அவன் ஓர் __________' - பொருத்தமான சொல்:", o: ["அறிவாளி", "அறிவாளிகள்", "மாணவர்கள்", "வீரர்கள்"], a: 0, exp: "விளக்கம்: 'அவன்' என்பது ஒருமை என்பதால் ஒருமைப் பெயர்ச் சொல் (அறிவாளி) பெற வேண்டும்." },
    { q: "40. 'செய்தி __________' - பொருத்தமான சொல்:", o: ["வந்தது", "வந்தன", "வந்தனர்", "வந்தான்"], a: 0, exp: "விளக்கம்: செய்தி என்பது ஒருமை, எனவே 'வந்தது' என முடியும்." },

    // Model 9: Matching Codes / Combination Code Model (41-45)
    { q: "41. பிழையற்ற சரியான தொடர்களைக் கொண்ட தொகுதியைத் தேர்ந்தெடுக்க:\n1. மாடுகள் புல் மேய்ந்தன\n2. மாணவர்கள் பாடம் படித்தனர்\n3. நூலகத்தில் பல புத்தகங்கள் உள்ளன\nகுறியீடு:", o: ["1, 2 மற்றும் 3 சரி", "1 மற்றும் 2 மட்டும்", "2 மற்றும் 3 மட்டும்", "1 மட்டும்"], a: 0, exp: "விளக்கம்: கொடுக்கப்பட்ட அனைத்துத் தொடர்களும் எண் பொருத்தம் கொண்டு சரியாக உள்ளன." },
    { q: "42. பிழையான தொடர்களைக் கண்டறியும் குறியீடு:\n1. பறவை வானில் பறந்தன\n2. குழந்தை பால் குடித்தனர்\n3. சிங்கம் கர்ச்சித்தன\nகுறியீடு:", o: ["அனைத்தும் பிழையே", "1 மற்றும் 2 மட்டும்", "2 மற்றும் 3 மட்டும்", "1 மட்டும்"], a: 0, exp: "விளக்கம்: கொடுக்கப்பட்ட மூன்று தொடர்களுமே ஒருமை-பன்மைப் பிழைக் கொண்டவை." },
    { q: "43. சரியான ஒருமை-பன்மை ஜோடிகள்:\n1. மரம் - மரங்கள்\n2. குதிரை - குதிரைகள்\n3. ஆறு - ஆறுகள்\nகுறியீடு:", o: ["1, 2 மற்றும் 3 சரி", "1 மட்டும்", "2 மற்றும் 3 மட்டும்", "எதுவுமில்லை"], a: 0, exp: "விளக்கம்: அனைத்து ஒருமை-பன்மைச் சொற்களும் சரியானவை." },
    { q: "44. எதிர்மறைத் தொடர்களில் சரியானவை:\n1. இவை பழங்கள் அல்ல\n2. இவை காய்ந்த இலைகள் அல்ல\n3. இது பழம் அன்று\nகுறியீடு:", o: ["அனைத்தும் சரி", "1 மற்றும் 2 மட்டும்", "2 மற்றும் 3 மட்டும்", "1 மட்டும்"], a: 0, exp: "விளக்கம்: எதிர்மறை வினைமுற்றுகளின் பொருத்தங்கள் அனைத்தும் சரியானவை." },
    { q: "45. உயர்திணைப் பொருத்தமான தொடர்கள்:\n1. ஆசிரியர் பாடம் நடத்தினார்\n2. அப்பா வந்தார்\n3. தலைவர்கள் பேசினர்\nகுறியீடு:", o: ["அனைத்தும் சரி", "1 மற்றும் 2 மட்டும்", "2 மற்றும் 3 மட்டும்", "1 மட்டும்"], a: 0, exp: "விளக்கம்: உயர்திணை மற்றும் மரியாதை பன்மைத் தொடர்கள் அனைத்தும் சரியானவை." },

    // Model 10: Comparative Statement / Analytical Model (46-50)
    { q: "46. பத்தியை ஆராய்ந்து விடையளி:\n'காட்டில் பல மாடுகள் மேய்ந்தன; ஆனால் ஒரு சிங்கம் புல் தின்னாமல் கர்ச்சித்தது.'\nஇத்தொடரில் வந்துள்ள எண் பொருத்தம் குறித்த சரியான கூற்று:", o: ["மாடுகள் (பன்மை) - மேய்ந்தன (பன்மை); சிங்கம் (ஒருமை) - கர்ச்சித்தது (ஒருமை) எனச் சரியாக வந்துள்ளது.", "தவறான தொடர்", "எண் பொருத்தம் பிழை", "பயனிலை மாறியுள்ளது"], a: 0, exp: "விளக்கம்: பன்மை எழுவாய்க்குப் பன்மையும், ஒருமை எழுவாய்க்கு ஒருமையும் சரியாகப் பொருந்தியுள்ளது." },
    { q: "47. ஒப்பிட்டாய்வுக் கேள்வி:\n'ஒவ்வொரு மாணவனும் வந்தான்' மற்றும் 'ஒவ்வொரு மாணவர்களும் வந்தார்கள்' - இவற்றின் ஒப்பீடு என்ன?", o: ["முதல் தொடர் சரியானது; இரண்டாவது தொடர் 'ஒவ்வொரு' என்ற சொல்லுடன் 'கள்' பன்மை விகுதி வந்துள்ளதால் பிழையானது.", "இரண்டுமே சரியானவை", "இரண்டுமே பிழையானவை", "இரண்டாவது தொடர் மட்டுமே சரி"], a: 0, exp: "விளக்கம்: 'ஒவ்வொரு' என்னும் சொல்லின் பின் பன்மை விகுதி வரக்கூடாது." },
    { q: "48. பத்தியை ஆராய்ந்து விடையளி:\n'மழைகள் பெய்ததால் பயிர்கள் செழித்தன; குளங்கள் நிரம்பின.'\nஇத்தொடரில் இடம்பெற்றுள்ள அனைத்து எழுவாய்களும் பயனிலைகளும் எத்தகைய எண்களைக் கொண்டுள்ளன?", o: ["அனைத்தும் பன்மை எண்களைக் கொண்டுள்ளன", "அனைத்தும் ஒருமை", "கலப்பு எண்", "தவறான தொடர்"], a: 0, exp: "விளக்கம்: மழைகள், பயிர்கள், குளங்கள் (பன்மைகள்) மற்றும் செழித்தன, நிரம்பின (பன்மைப் பயனிலைகள்)." },
    { q: "49. இலக்கண ஒப்பீடு:\n'இது பழங்கள் அல்ல' மற்றும் 'இவை பழங்கள் அல்ல' - இவற்றுள் எங்கு பிழை உள்ளது?", o: ["'இது பழங்கள் அல்ல' என்பதில் சுட்டுப்பெயர் ஒருமையிலும், பெயர் பன்மையிலும் உள்ளதால் பிழையாகும்.", "இரண்டுமே பிழை", "இரண்டுமே சரி", "எங்குப் பிழையும் இல்லை"], a: 0, exp: "விளக்கம்: 'இது' என்பது ஒருமை, எனவே 'இவை பழங்கள் அல்ல' என்பதே சரி." },
    { q: "50. இறுதி ஆய்வு வினா:\nஒருமை-பன்மை பிழைகளை நீக்கி எழுதும் திறனை TNPSC தேர்வர்கள் பெறுவதன் முக்கிய நோக்கம் என்ன?", o: ["இலக்கணப் பிழையற்ற செந்தமிழ் வாக்கியங்களை அடையாளம் கண்டு தேர்வில் முழு மதிப்பெண் பெறலாம்.", "நேரத்தை வீணடிக்க", "எழுத்துக்களைக் கூட்ட", "பயனில்லை"], a: 0, exp: "விளக்கம்: தமிழ் இலக்கணத் தேர்வுகளில் பிழையின்றி பதிலளிக்க இது பெரிதும் உதவுகிறது." }
  ];

  let currentQuestion = 0;
  let userAnswers = new Array(questionsData.length).fill(null);
  let isReviewMode = false;
  let timerInterval;
  let timeLeft = 45 * 60;

  function initTest() {
    buildGrid();
    loadQuestion(0);
    startTimer();
  }

  function buildGrid() {
    const grid = document.getElementById('questionGrid');
    grid.innerHTML = '';
    questionsData.forEach((_, idx) => {
      const btn = document.createElement('button');
      btn.className = 'q-num-btn';
      btn.innerText = idx + 1;
      btn.id = `q_btn_${idx}`;
      btn.onclick = () => jumpToQuestion(idx);
      grid.appendChild(btn);
    });
    updateGridStatus();
  }

  function updateGridStatus() {
    questionsData.forEach((_, idx) => {
      const btn = document.getElementById(`q_btn_${idx}`);
      if(!btn) return;
      btn.className = 'q-num-btn';
      if(idx === currentQuestion) {
        btn.classList.add('active');
      } else if(userAnswers[idx] !== null) {
        btn.classList.add('answered');
      }
    });
  }

  function loadQuestion(idx) {
    currentQuestion = idx;
    const q = questionsData[idx];
    document.getElementById('qTitle').innerText = q.q;
    
    const optsBox = document.getElementById('optionsBox');
    optsBox.innerHTML = '';

    q.o.forEach((optText, oIdx) => {
      const card = document.createElement('div');
      card.className = 'option-card';
      
      if(userAnswers[idx] === oIdx) {
        card.classList.add('selected');
      }

      if(isReviewMode) {
        if(oIdx === q.a) {
          card.classList.add('correct-ans');
        } else if(userAnswers[idx] === oIdx && oIdx !== q.a) {
          card.classList.add('wrong-ans');
        }
      }

      card.innerHTML = `<span><b>${String.fromCharCode(65 + oIdx)}.</b> ${optText}</span>`;
      card.onclick = () => selectOption(oIdx);
      optsBox.appendChild(card);
    });

    const expBox = document.getElementById('expBox');
    if(isReviewMode) {
      expBox.style.display = 'block';
      expBox.innerText = q.exp;
    } else {
      expBox.style.display = 'none';
    }

    document.getElementById('prevBtn').style.display = idx === 0 ? 'none' : 'block';
    document.getElementById('nextBtn').style.display = idx === questionsData.length - 1 ? 'none' : 'block';
    updateGridStatus();
  }

  function selectOption(oIdx) {
    if(isReviewMode) return;
    userAnswers[currentQuestion] = oIdx;
    loadQuestion(currentQuestion);
  }

  function clearChoice() {
    if(isReviewMode) return;
    userAnswers[currentQuestion] = null;
    loadQuestion(currentQuestion);
  }

  function navigateNumberQuery(dir) {
    const next = currentQuestion + dir;
    if(next >= 0 && next < questionsData.length) {
      loadQuestion(next);
    }
  }

  function jumpToQuestion(idx) {
    loadQuestion(idx);
  }

  function startTimer() {
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      timeLeft--;
      let m = Math.floor(timeLeft / 60);
      let s = timeLeft % 60;
      const timerElem = document.getElementById('timerBox');
      if(timerElem) {
        timerElem.innerText = `⏱️ ${m}:${s < 10 ? '0' : ''}${s}`;
      }
      if(timeLeft <= 0) {
        clearInterval(timerInterval);
        submitTest();
      }
    }, 1000);
  }

  function submitTest() {
    if (timerInterval) clearInterval(timerInterval);
    document.getElementById('testView').style.display = 'none';
    document.getElementById('resultView').style.display = 'block';

    let correct = 0, wrong = 0, unans = 0;
    userAnswers.forEach((ans, idx) => {
      if(ans === null) unans++;
      else if(ans === questionsData[idx].a) correct++;
      else wrong++;
    });

    document.getElementById('scoreDisplay').innerText = `${correct} / ${questionsData.length}`;
    let pct = ((correct / questionsData.length) * 100).toFixed(1);
    document.getElementById('percentageDisplay').innerText = `சதவீதம்: ${pct}%`;
    document.getElementById('correctCnt').innerText = correct;
    document.getElementById('wrongCnt').innerText = wrong;
    document.getElementById('unansCnt').innerText = unans;
  }

  function reviewAnswerKey() {
    isReviewMode = true;
    document.getElementById('resultView').style.display = 'none';
    document.getElementById('testView').style.display = 'block';
    document.getElementById('finalSubmitBtn').style.display = 'none';
    document.getElementById('backToResultBtn').style.display = 'block';
    document.getElementById('dashFromKeyBtn').style.display = 'block';
    loadQuestion(0);
  }

  function returnToResult() {
    document.getElementById('testView').style.display = 'none';
    document.getElementById('resultView').style.display = 'block';
  }

  function returnToDashboard() {
    window.location.replace("https://tigeracadamy.github.io/preperation-hub/index.html"); 
  }

  function exitPortal() {
    window.location.replace("https://tigeracadamy.github.io/preperation-hub/index.html");
  }

  function retakeTest() {
    userAnswers = new Array(questionsData.length).fill(null);
    isReviewMode = false;
    timeLeft = 45 * 60;
    document.getElementById('resultView').style.display = 'none';
    document.getElementById('testView').style.display = 'block';
    document.getElementById('finalSubmitBtn').style.display = 'inline-block';
    document.getElementById('backToResultBtn').style.display = 'none';
    document.getElementById('dashFromKeyBtn').style.display = 'none';
    initTest();
  }

  window.onload = function() {
    initTest();
  }
</script>
