<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tiger Warriors - இன எழுத்துக்கள் 50 வினாக்கள்</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; font-weight: bold; }
    body { background: #020617; color: #f8fafc; padding: 12px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { width: 100%; max-width: 950px; background: #0f172a; border-radius: 14px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); border: 1px solid #1e293b; }
    
    .test-header { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
    .timer { font-size: 16px; font-weight: bold; color: #f59e0b; background: #091326; padding: 6px 12px; border-radius: 6px; border: 1px solid #f59e0b; }
    
    .q-grid { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 16px; max-height: 140px; overflow-y: auto; padding: 8px; background: #1e293b; border-radius: 8px; justify-content: center; }
    .q-num-btn { width: 30px; height: 30px; border-radius: 5px; border: none; background: #334155; color: #fff; font-size: 10px; cursor: pointer; font-weight: bold; }
    .q-num-btn.active { border: 2px solid #38bdf8; background: #0284c7; }
    .q-num-btn.answered { background: #10b981; }

    .q-box { background: #1e293b; padding: 18px; border-radius: 10px; margin-bottom: 16px; }
    .q-text { white-space: pre-line; line-height: 1.6; font-size: 15px; color: #f8fafc; }
    
    .option-card { background: #0f172a; border: 1px solid #334155; padding: 12px 16px; border-radius: 8px; margin-top: 10px; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: 0.2s; white-space: pre-line; line-height: 1.4; }
    .option-card:hover { border-color: #38bdf8; background: #1e293b; }
    .option-card.selected { border-color: #10b981; background: #064e3b; }
    .option-card.correct-ans { border-color: #10b981; background: #065f46; font-weight: bold; }
    .option-card.wrong-ans { border-color: #ef4444; background: #7f1d1d; }

    .explanation-box { background: #091326; border: 1px solid #38bdf8; border-radius: 8px; padding: 12px; margin-top: 14px; font-size: 13px; color: #7dd3fc; line-height: 1.5; }
    
    .nav-btns { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    .btn-action { background: #334155; color: #fff; border: none; padding: 10px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 13px; text-align: center; }
    .btn-action:hover { opacity: 0.9; }
    .btn-blue { background: #2563eb; }
    .btn-purple { background: #7c3aed; }
    .btn-danger { background: #ef4444; }
    .btn-green { background: #22c55e; }

    .result-box { text-align: center; padding: 25px; background: #1e293b; border-radius: 16px; margin-top: 10px; border: 1px solid rgba(0, 242, 254, 0.3); display: flex; flex-direction: column; align-items: center; }
    .score-circle { width: 130px; height: 130px; border-radius: 50%; background: conic-gradient(#10b981 0deg, #0f172a 0deg); display: flex; flex-direction: column; justify-content: center; align-items: center; margin: 0 auto 15px auto; border: 4px solid #38bdf8; box-shadow: 0 0 20px rgba(56, 189, 248, 0.4); }
    .score-num { font-size: 30px; color: #f8fafc; font-weight: bold; }
    
    .result-stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; width: 100%; max-width: 400px; }
    .stat-pill { background: #0f172a; border-radius: 12px; padding: 10px; border: 1px solid #334155; text-align: center; }
    .stat-pill.gold { border-color: #fbbf24; }
    .stat-pill.blue { border-color: #38bdf8; }
    .stat-pill.red { border-color: #ef4444; }

    .footer-badge { text-align: center; font-size: 11px; color: #38bdf8; margin-top: 15px; font-weight: bold; letter-spacing: 0.5px; }
  </style>
</head>
<body>

<div class="card">
  <script>
      if (localStorage.getItem('tiger_auth_passed') !== 'true') {
          alert("⚠ பாதுகாப்பு எச்சரிக்கை: நீங்கள் Tiger Warriors போர்ட்டலில் லாகின் செய்யவில்லை! முதலில் மெயின் போர்ட்டலில் லாகின் செய்யவும்.");
          window.location.replace("https://tigeracadamy.github.io/preperation-hub/index.html"); 
      }
  </script>

  <div id="testView">
    <div class="test-header">
      <div>
        <h3 style="color: #38bdf8; font-size: 15px;">🐅 TIGER WARRIORS - இன எழுத்துக்கள் (50 வினாக்கள்)</h3>
        <span style="font-size: 11px; color: #94a3b8;">TNPSC / TRB • TAMIL UNIT 1</span>
      </div>
      <div style="display: flex; gap: 8px; align-items: center;">
        <div class="timer" id="timerBox">⏱️ 45:00</div>
        <button class="btn-action btn-purple" id="backToResultBtn" onclick="returnToResult()" style="display: none; padding: 6px 12px; font-size: 12px;">📊 ரிசல்ட் செல்</button>
        <button class="btn-action btn-danger" id="dashFromKeyBtn" onclick="returnToDashboard()" style="display: none; padding: 6px 12px; font-size: 12px;">🏠 முகப்பு</button>
      </div>
    </div>

    <div class="q-grid" id="questionGrid"></div>

    <div class="q-box">
      <div id="qTitle" class="q-text"></div>
      <div id="optionsBox"></div>
      <div id="expBox" class="explanation-box" style="display: none;"></div>
    </div>

    <div class="nav-btns">
      <button class="btn-action" id="prevBtn" onclick="navigateNumberQuery(-1)">⬅️ முந்தையது</button>
      <button class="btn-action" id="clearBtn" onclick="clearChoice()">🧹 விடையை நீக்கு</button>
      <button class="btn-action btn-blue" id="nextBtn" onclick="navigateNumberQuery(1)">அடுத்து ➡️</button>
      <button class="btn-action btn-danger" id="finalSubmitBtn" onclick="submitTest()">✅ தேர்வைச் சமர்ப்பிக்க (Submit)</button>
    </div>
  </div>

  <div id="resultView" style="display: none;">
    <h2 style="color: #38bdf8; text-align: center; margin-bottom: 10px;">🏆 தேர்வு முடிவுகள் (Test Results) 🎯</h2>
    <div class="result-box">
      <div class="score-circle" id="scoreCircle">
        <div class="score-num" id="scoreDisplay">0/50</div>
        <span id="percentageDisplay" style="font-size: 11px; color: #fbbf24;">0%</span>
      </div>

      <div class="result-stats-grid">
        <div class="stat-pill gold">
          <h3 id="correctCnt" style="color: #10b981; font-size: 18px;">0</h3>
          <span style="font-size: 11px; color: #cbd5e1;">சரியானது ✅</span>
        </div>
        <div class="stat-pill red">
          <h3 id="wrongCnt" style="color: #ef4444; font-size: 18px;">0</h3>
          <span style="font-size: 11px; color: #cbd5e1;">தவறானது ❌</span>
        </div>
        <div class="stat-pill blue">
          <h3 id="unansCnt" style="color: #f59e0b; font-size: 18px;">0</h3>
          <span style="font-size: 11px; color: #cbd5e1;">விடையில்லை ⚠️</span>
        </div>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px;">
      <button class="btn-action btn-blue" onclick="reviewAnswerKey()">🔍 விடை குறிப்பு (Answer Key)</button>
      <button class="btn-action btn-purple" onclick="returnToDashboard()">🏠 முகப்புப் பக்கம்</button>
      <button class="btn-action btn-green" onclick="retakeTest()">🔄 மீண்டும் தேர்வு</button>
      <button class="btn-action btn-danger" onclick="exitPortal()">🚪 வெளியேறு</button>
    </div>
    <div class="footer-badge" style="margin-top: 20px;">🐅 டைகர் வாரியர் போர்டல் - இயக்குநர்: Dr. K. மணிகாசி[cite: 10] 🐅</div>
  </div>
</div>

<script>
  const questionsData = [
    { q: "1. ஒலிக்கும் முயற்சி பிறக்கும் இடம் ஆகியவற்றில் சில எழுத்துக்களுக்கு ஒற்றுமை உண்டு. இத்தகைய ஒற்றுமை உள்ள எழுத்துகள் ______ எனப்படும்.", o: ["அ. முதல் எழுத்துகள்", "ஆ. இன எழுத்துகள்", "இ. சார்பெழுத்துகள்", "ஈ. சிறப்பு எழுத்துகள்"], a: 1, exp: "விளக்கம்: ஒலிக்கும் முயற்சி மற்றும் பிறப்பிடம் ஆகியவற்றின் அடிப்படையில் ஒற்றுமை கொண்ட எழுத்துக்கள் இன எழுத்துகள் எனப்படும்[cite: 10]." },
    { q: "2. மெல்லினத்திற்கான இன எழுத்து இடம் பெறாத சொல் எது?", o: ["அ. மஞ்சள்", "ஆ. வந்தான்", "இ. தம்பி", "ஈ. கண்ணில்"], a: 3, exp: "விளக்கம்: கண்ணில் என்பதில் ண் (மெல்லினம்) அடுத்து ண் (மெல்லினம்) வந்துள்ளது. இதில் மெல்லினத்திற்கான இனவல்லினம் வரவில்லை[cite: 10]." },
    { q: "3. தவறான சொல்லை கண்டறிக:", o: ["அ. கண்டான்", "ஆ. வென்ரான்", "இ. நண்டு", "ஈ. வண்டு"], a: 1, exp: "விளக்கம்: சரியான சொல் வென்றான். 'ன்' க்கு இன எழுத்தாக 'ற்' வரும்[cite: 10]." },
    { q: "4. தமிழ் எழுத்துகளில் இன எழுத்து இல்லாத எழுத்து எது?", o: ["அ. ஆய்த எழுத்து", "ஆ. இவற்றில் எதுவுமில்லை", "இ. ஐ", "ஈ. ஔ"], a: 0, exp: "விளக்கம்: ஆய்த எழுத்து (ஃ) தனித்தன்மை வாய்ந்தது. அதற்கென்று இன எழுத்து இல்லை[cite: 10]." },
    { q: "5. 'ஔ' எழுத்துக்குரிய இன எழுத்து எது?", o: ["அ. அ", "ஆ. ஆ", "இ. ஏ", "ஈ. உ"], a: 3, exp: "விளக்கம்: உயிர் எழுத்துகளில் நெடிலுக்குக் குறிலும், குறிலுக்கு நெடிலும் இனமாகும். 'ஔ' ஒரு நெடில்; அதன் குறில் இனம் 'உ'[cite: 10]." },
    { q: "6. சொற்களில் மெல்லின மெய் எழுத்தை அடுத்துப் பெரும்பாலும் அதன் இனமாகிய ______ எழுத்து வரும்?", o: ["அ. வல்லினம்", "ஆ. இடையினம்", "இ. மெல்லினம்", "ஈ. இவற்றில் எதுவுமில்லை"], a: 0, exp: "விளக்கம்: மெல்லின மெய்க்குப் பிறகு அதன் இனமாகிய வல்லினம் வரும் (எ.கா: திங்கள் - ங் + க)[cite: 10]." },
    { q: "7. 'ஐ' எழுத்துக்குரிய இன எழுத்து எது?", o: ["அ. ஆ", "ஆ. இ", "இ. ஈ", "ஈ. ஏ"], a: 1, exp: "விளக்கம்: 'ஐ' ஒரு நெடில் எழுத்து; அதன் குறில் இனம் 'இ' ஆகும்[cite: 10]." },
    { q: "8. ஆறு வல்லின மெய் எழுத்துகளுக்கும் ஆறு மெல்லின எழுத்துகளுக்கும் உள்ள உறவு ______ எழுத்துகள் எனப்படும்?", o: ["அ. இன எழுத்துகள்", "ஆ. உயிர் எழுத்துக்கள்", "இ. இனம் சேரா எழுத்துகள்", "ஈ. மெய் எழுத்துகள்"], a: 0, exp: "விளக்கம்: வல்லின மெய்களும் அவற்றுக்குரிய மெல்லின மெய்களும் இன எழுத்துகள் எனப்படும்[cite: 10]." },
    { q: "9. கூற்று (A): மெய்யெழுத்துக்களைப் போலவே உயிர் எழுத்துகளிலும் இன எழுத்துகள் உண்டு.\nகாரணம் (R): உயிர் எழுத்துக்களில் குறிலுக்கு நெடிலும், நெடிலுக்கு குறிலும் இன எழுத்துகளாக வரும்.", o: ["அ. கூற்று A சரி, காரணம் R தவறு", "ஆ. கூற்று A சரி, காரணம் R சரி", "இ. கூற்று A தவறு, காரணம் R தவறு", "ஈ. கூற்று A தவறு, காரணம் R சரி"], a: 1, exp: "விளக்கம்: இரு கூற்றுகளும் சரியானவை. குறில்-நெடில் இனத்தைப் பற்றி காரணம் சரியாக விளக்குகிறது[cite: 10]." },
    { q: "10. வல்லின எழுத்துகளின் எண்ணிக்கை எத்தனை?", o: ["அ. 5", "ஆ. 6", "இ. 7", "ஈ. 18"], a: 1, exp: "விளக்கம்: வல்லின எழுத்துகள் க், ச், ட், த், ப், ற் என 6 ஆகும்." },
    { q: "11. மெல்லின எழுத்துகளின் எண்ணிக்கை எத்தனை?", o: ["அ. 5", "ஆ. 6", "இ. 8", "ஈ. 12"], a: 1, exp: "விளக்கம்: மெல்லின எழுத்துகள் ங், ஞ், ண், ந், ம், ன் என 6 ஆகும்." },
    { q: "12. இடையின எழுத்துகளின் எண்ணிக்கை எத்தனை?", o: ["அ. 4", "ஆ. 5", "இ. 6", "ஈ. 8"], a: 2, exp: "விளக்கம்: இடையின எழுத்துகள் ய், ர், ல், வ், ழ், ள் என 6 ஆகும்." },
    { q: "13. மார்பினை இடமாகக் கொண்டு பிறக்கும் எழுத்துகள் எவை?", o: ["அ. உயிரெழுத்துகள்", "ஆ. வல்லின மெய்யெழுத்துகள்", "இ. மெல்லின மெய்யெழுத்துகள்", "ஈ. இடையின மெய்யெழுத்துகள்"], a: 1, exp: "விளக்கம்: வல்லின மெய்யெழுத்துகள் ஆறும் மார்பினை இடமாகக் கொண்டு பிறக்கின்றன." },
    { q: "14. மூக்கினை இடமாகக் கொண்டு பிறக்கும் எழுத்துகள் எவை?", o: ["அ. வல்லினம்", "ஆ. மெல்லினம்", "இ. இடையினம்", "ஈ. ஆய்தம்"], a: 1, exp: "விளக்கம்: மெல்லின மெய்யெழுத்துகள் ஆறும் மூக்கினை இடமாகக் கொண்டு பிறக்கின்றன." },
    { q: "15. கழுத்தை (மிடறு) இடமாகக் கொண்டு பிறக்கும் எழுத்துகள் எவை?", o: ["அ. உயிரெழுத்துகள் மற்றும் இடையின மெய்யெழுத்துகள்", "ஆ. வல்லின மெய்யெழுத்துகள் மட்டும்", "இ. ஆய்த எழுத்து", "ஈ. மெல்லின மெய்யெழுத்துகள்"], a: 0, exp: "விளக்கம்: கழுத்தை இடமாகக் கொண்டு உயிரெழுத்துகளும் இடையின மெய்யெழுத்துகளும் பிறக்கின்றன." },
    { q: "16. தலையை இடமாகக் கொண்டு பிறக்கும் எழுத்து எது?", o: ["அ. ஃ (ஆய்த எழுத்து)", "ஆ. அ", "இ. க்", "ஈ. ங்"], a: 0, exp: "விளக்கம்: ஆய்த எழுத்து (ஃ) தலையை இடமாகக் கொண்டு பிறக்கிறது." },
    { q: "17. 'க்' என்ற எழுத்திற்கு இனமான மெல்லின எழுத்து எது?", o: ["அ. ஞ்", "ஆ. ங்", "இ. ண்", "ஈ. ந்"], a: 1, exp: "விளக்கம்: க் - ங் இரண்டும் இணை எழுத்துகள் ஆகும்." },

    { q: "22. 'ற்' என்ற எழுத்திற்கு இனமான மெல்லின எழுத்து எது?", o: ["அ. ன்", "ஆ. ம்", "இ. ந்", "ஈ. ஞ்"], a: 0, exp: "விளக்கம்: ற் - ன் இரண்டும் இன எழுத்துகள் ஆகும்." },
    { q: "23. இடையின எழுத்துகள் ஆறும் எத்தகைய தன்மையைக் கொண்டவை?", o: ["அ. தனி இனம்", "ஆ. தனித்தனி இனம்", "இ. ஒரே இனமாக இயங்குபவை", "ஈ. இனமில்லாதவை"], a: 2, exp: "விளக்கம்: இடையின எழுத்துகள் ஆறும் (ய், ர், ல், வ், ழ், ள்) ஒரே இனமாக அமையும்." },
    { q: "24. பின்வருவனவற்றுள் சரியான இணை எது?", o: ["அ. க் - ங்", "ஆ. ச் - ண்", "இ. த் - ம்", "ஈ. ப் - ன்"], a: 0, exp: "விளக்கம்: க் - ங் என்பது சரியான இணை எழுத்து முறையாகும்." },
    { q: "25. தவறಾದ இணை எது என்பதைக் கண்டறிக:", o: ["அ. ட் - ண்", "ஆ. த் - ந்", "இ. ப் - ங்", "ஈ. ற் - ன்"], a: 2, exp: "விளக்கம்: ப்-க்கு இன எழுத்து 'ம்' ஆகும்; 'ங்' அல்ல." },
    { q: "26. அளபெடை வழக்கில் நெடில் எழுத்துகளைத் தொடர்ந்து வரும் எழுத்து எது?", o: ["அ. குறில் எழுத்து", "ஆ. வல்லின எழுத்து", "இ. மெல்லின எழுத்து", "ஈ. ஆய்த எழுத்து"], a: 0, exp: "விளக்கம்: அளபெடை வழக்கில் மட்டுமே நெடிலைத் தொடர்ந்து குறில் எழுத்து இனமாக வரும்." },
    { q: "27. 'தூஉமழை' என்பதில் உகரத்தின் நீட்சிக்கு இனமாக வருவது எது?", o: ["அ. உ", "ஆ. ஊ", "இ. இ", "ஈ. அ"], a: 0, exp: "விளக்கம்: நெடிலை அடுத்து அதன் இனமான குறில் வரும் (தூஉ - உ)." },
    { q: "28. தமிழ்மொழியில் இணை எழுத்து மறிப்பு இல்லாத ஒரே எழுத்து எது?", o: ["அ. ஃ", "ஆ. அ", "இ. க", "ஈ. ஶ"], a: 0, exp: "விளக்கம்: ஆய்த எழுத்துக்கு இன எழுத்து கிடையாது." },
    { q: "29. 'திங்கள்' என்ற சொல்லில் வந்துள்ள இன எழுத்து ஜோடி எது?", o: ["அ. ங் - க", "ஆ. ஞ் - ச", "இ. ண் - ட", "ஈ. ந் - த"], a: 0, exp: "விளக்கம்: திங்கள் என்பதில் ங்-க இன எழுத்து ஜோடியாகும்." },
    { q: "30. 'மஞ்சள்' என்ற சொல்லில் உள்ள இன எழுத்து முறையைக் கண்டறிக:", o: ["அ. ஞ் - ச", "ஆ. ம் - ப", "இ. ன் - ற", "ஈ. ண் - ட"], a: 0, exp: "விளக்கம்: மஞ்சள் என்பதில் ஞ்-ச இணை எழுத்து இடம்பெற்றுள்ளது." },
    { q: "31. 'மண்டபம்' என்ற சொல்லில் உள்ள மெல்லின-வல்லின இணை எது?", o: ["அ. ண் - ட", "ஆ. ந் - த", "இ. ம் - ப", "ஈ. ங் - க"], a: 0, exp: "விளக்கம்: மண்டபம் - ண் மற்றும் ட இணை எழுத்துகள்." },

    { q: "43. தமிழ் எழுத்துக்களில் பிறப்பு முறையின் அடிப்படையில் ஒற்றுமை உள்ளவை எவ்வாறு அழைக்கப்படுகின்றன?", o: ["அ. இன எழுத்துகள்", "ஆ. முப்பத, எழுத்துகள்", "இ. சார்பெழுத்துகள்", "ஈ. முதல் எழுத்துகள்"], a: 0, exp: "விளக்கம்: பிறப்பு முறையில் ஒற்றுமையுள்ளவை இன எழுத்துகள் ஆகும்." },
    { q: "44. மெய் எழுத்துகளில் வல்லினத்திற்கு இனமாக வருவது எது?", o: ["அ. மெல்லினம்", "ஆ. இடையினம்", "இ. உயிர்", "ஈ. ஆய்தம்"], a: 0, exp: "விளக்கம்: வல்லினத்திற்கு மெல்லினம் இனமாகும்." },
    { q: "45. சரியான சொல்லைத் தேர்ந்தெடுக்கவும்:", o: ["அ. பங்கம்", "ஆ. பஞ்சு", "இ. பண்டு", "ஈ. இவை அனைத்தும்"], a: 3, exp: "விளக்கம்: மேற்கண்ட அனைத்துச் சொற்களிலும் மெல்லினத்திற்குரிய வல்லின இன எழுத்துகள் சரியாக வந்துள்ளன." },
    { q: "46. தவறಾದ எழுத்துக்கூட்டலைக் கொண்ட சொல்லைத் தேர்ந்தெடு:", o: ["அ. பந்தம்", "ஆ. கம்பம்", "இ. கன்டு", "ஈ. செண்டு"], a: 2, exp: "விளக்கம்: 'கன்டு' என்பது தவறு; 'கண்டு' என்பதே சரி (ண்-ட)." },
    { q: "47. தமிழ் இலக்கணத்தில் எழுத்துகளின் இனக்கட்டுப்பாடு எதற்காகப் பயன்படுகிறது?", o: ["அ. எளிமையாக உச்சரிக்க", "ஆ. எழுத்துப்பிழை தவிர்க்க", "இ. ஓசை நயம் பெற", "ஈ. இவை அனைத்தும்"], a: 3, exp: "விளக்கம்: இன எழுத்துகள் உச்சரிப்பு எளிமைக்கும் ஓசை நயத்திற்கும் உதவுகின்றன." },
    { q: "48. பின்வரும் கூற்றுகளில் சரியானது எது?\n1. வல்லினமும் மெல்லினமும் இனமாகும்.\n2. குறிலும் நெடிலும் இனமாகும்.", o: ["அ. 1 மட்டும்", "ஆ. 2 மட்டும்", "இ. இரண்டும் சரி", "ஈ. இரண்டும் தவறு"], a: 2, exp: "விளக்கம்: மெய் மற்றும் உயிர் இரண்டிலும் இன எழுத்து முறை உண்டு என்பதால் இரண்டும் சரி." },
    { q: "49. 'பந்து' என்ற சொல்லில் உள்ள இன எழுத்துகளின் மெய் ஜோடி எது?", o: ["அ. ந் - த", "ஆ. ம் - ப", "இ. ங் - க", "ஈ. ஞ் - ச"], a: 0, exp: "விளக்கம்: பந்து - ந் மற்றும் த இணை எழுத்துகள்." },
    { q: "50. தமிழ் மெய்யெழுத்துகளில் இணை எழுத்து இல்லாத எழுத்துகள் எவை?", o: ["அ. வல்லின மெய்கள்", "ஆ. மெல்லின மெய்கள்", "இ. இடையின மெய்கள்", "ஈ. இடையின மெயləகளுக்கு தனித்தனி இணை மெய்கள் கிடையாது (அவை தமக்குள் ஒரு இனம்)"], a: 3, exp: "விளக்கம்: இடையின மெய்கள் றும் ஆறும் தமக்குள் ஒரே இனமாகக் கொள்ளப்படும்." }
  ];

  let currentQuestion = 0;
  let userAnswers = new Array(questionsData.length).fill(null);
  let isReviewMode = false;
  let timerInterval;
  let timeLeft = 45 * 60;

  function initTest() {
    buildGrid();
    loadQuestion(0);
    startTimer();
  }

  function buildGrid() {
    const grid = document.getElementById('questionGrid');
    grid.innerHTML = '';
    questionsData.forEach((_, idx) => {
      const btn = document.createElement('button');
      btn.className = 'q-num-btn';
      btn.innerText = idx + 1;
      btn.id = `q_btn_${idx}`;
      btn.onclick = () => jumpToQuestion(idx);
      grid.appendChild(btn);
    });
    updateGridStatus();
  }

  function updateGridStatus() {
    questionsData.forEach((_, idx) => {
      const btn = document.getElementById(`q_btn_${idx}`);
      if(!btn) return;
      btn.className = 'q-num-btn';
      if(idx === currentQuestion) {
        btn.classList.add('active');
      } else if(userAnswers[idx] !== null) {
        btn.classList.add('answered');
      }
    });
  }

  function loadQuestion(idx) {
    currentQuestion = idx;
    const q = questionsData[idx];
    document.getElementById('qTitle').innerText = q.q;
    
    const optsBox = document.getElementById('optionsBox');
    optsBox.innerHTML = '';

    q.o.forEach((optText, oIdx) => {
      const card = document.createElement('div');
      card.className = 'option-card';
      
      if(userAnswers[idx] === oIdx) {
        card.classList.add('selected');
      }

      if(isReviewMode) {
        if(oIdx === q.a) {
          card.classList.add('correct-ans');
        } else if(userAnswers[idx] === oIdx && oIdx !== q.a) {
          card.classList.add('wrong-ans');
        }
      }

      card.innerHTML = `<span><b>${String.fromCharCode(65 + oIdx)}.</b> ${optText}</span>`;
      card.onclick = () => selectOption(oIdx);
      optsBox.appendChild(card);
    });

    const expBox = document.getElementById('expBox');
    if(isReviewMode) {
      expBox.style.display = 'block';
      expBox.innerText = q.exp;
    } else {
      expBox.style.display = 'none';
    }

    document.getElementById('prevBtn').style.display = idx === 0 ? 'none' : 'block';
    document.getElementById('nextBtn').style.display = idx === questionsData.length - 1 ? 'none' : 'block';
    updateGridStatus();
  }

  function selectOption(oIdx) {
    if(isReviewMode) return;
    userAnswers[currentQuestion] = oIdx;
    loadQuestion(currentQuestion);
  }

  function clearChoice() {
    if(isReviewMode) return;
    userAnswers[currentQuestion] = null;
    loadQuestion(currentQuestion);
  }

  function navigateNumberQuery(dir) {
    const next = currentQuestion + dir;
    if(next >= 0 && next < questionsData.length) {
      loadQuestion(next);
    }
  }

  function jumpToQuestion(idx) {
    loadQuestion(idx);
  }

  function startTimer() {
    timerInterval = setInterval(() => {
      timeLeft--;
      let m = Math.floor(timeLeft / 60);
      let s = timeLeft % 60;
      document.getElementById('timerBox').innerText = `⏱️ ${m}:${s < 10 ? '0' : ''}${s}`;
      if(timeLeft <= 0) {
        clearInterval(timerInterval);
        submitTest();
      }
    }, 1000);
  }

  function submitTest() {
    clearInterval(timerInterval);
    document.getElementById('testView').style.display = 'none';
    document.getElementById('resultView').style.display = 'block';

    let correct = 0, wrong = 0, unans = 0;
    userAnswers.forEach((ans, idx) => {
      if(ans === null) unans++;
      else if(ans === questionsData[idx].a) correct++;
      else wrong++;
    });

    document.getElementById('scoreDisplay').innerText = `${correct} / ${questionsData.length}`;
    let pct = ((correct / questionsData.length) * 100).toFixed(1);
    document.getElementById('percentageDisplay').innerText = `சதவீதம்: ${pct}%`;
    document.getElementById('correctCnt').innerText = correct;
    document.getElementById('wrongCnt').innerText = wrong;
    document.getElementById('unansCnt').innerText = unans;
  }

  function reviewAnswerKey() {
    isReviewMode = true;
    document.getElementById('resultView').style.display = 'none';
    document.getElementById('testView').style.display = 'block';
    document.getElementById('finalSubmitBtn').style.display = 'none';
    document.getElementById('backToResultBtn').style.display = 'block';
    document.getElementById('dashFromKeyBtn').style.display = 'block';
    loadQuestion(0);
  }

  function returnToResult() {
    document.getElementById('testView').style.display = 'none';
    document.getElementById('resultView').style.display = 'block';
  }

  function returnToDashboard() {
    window.location.replace("https://tigeracadamy.github.io/preperation-hub/index.html"); 
  }

  function exitPortal() {
    window.location.replace("https://tigeracadamy.github.io/preperation-hub/index.html");
  }

  function retakeTest() {
    userAnswers = new Array(questionsData.length).fill(null);
    isReviewMode = false;
    timeLeft = 45 * 60;
    document.getElementById('resultView').style.display = 'none';
    document.getElementById('testView').style.display = 'block';
    document.getElementById('finalSubmitBtn').style.display = 'inline-block';
    document.getElementById('backToResultBtn').style.display = 'none';
    document.getElementById('dashFromKeyBtn').style.display = 'none';
    initTest();
  }

  window.onload = function() {
    initTest();
  }
</script>

</body>
</html>
